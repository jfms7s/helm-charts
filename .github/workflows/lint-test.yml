name: Lint and Test Charts

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  # One pinned Helm for both jobs (bump with the setup-helm pin below).
  HELM_VERSION: v4.3.1

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      # Keep the helm-unittest plugin under .bin/ so one cache covers both tools.
      HELM_PLUGINS: ${{ github.workspace }}/.bin/helm-plugins
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0   # check-version-bump diffs against the PR base

      - name: Check chart version bumps
        if: github.event_name == 'pull_request'
        run: scripts/check-version-bump.sh "origin/${{ github.base_ref }}"

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: ${{ env.HELM_VERSION }}

      # Versions and checksums are pinned in the Makefile; the key changes with it.
      - name: Cache tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .bin
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile', 'scripts/fetch-verified.sh') }}

      - name: Install tools (pinned, checksum-verified)
        run: |
          make helm-unittest-plugin kubeconform
          echo "$PWD/.bin" >> "$GITHUB_PATH"

      - name: Lint Helm charts
        run: |
          helm lint -f charts/common/ci/test-values.yaml charts/common
          helm lint -f charts/common/ci/test-values.yaml -f charts/common/ci/ingress-values.yaml charts/common
          helm lint charts/data-lab-helm
          helm lint -f charts/patchmon-helm/ci/test-values.yaml charts/patchmon-helm
          helm lint charts/tompero-helm
          helm lint -f charts/padel-score-helm/ci/test-values.yaml charts/padel-score-helm
          helm lint -f charts/meiun-helm/ci/test-values.yaml charts/meiun-helm
          helm lint -f charts/ticket-live-event-scanner-helm/ci/test-values.yaml charts/ticket-live-event-scanner-helm
          helm lint charts/eng-metrics-lab-helm
          helm lint -f charts/firstdime-helm/ci/test-values.yaml charts/firstdime-helm
          helm lint -f charts/firstdime-helm/ci/test-values.yaml -f charts/firstdime-helm/ci/frankfurter-values.yaml charts/firstdime-helm
          helm lint -f charts/firstdime-helm/ci/test-values.yaml -f charts/firstdime-helm/ci/bank-sync-values.yaml charts/firstdime-helm

      - name: Template Helm charts
        run: |
          helm template test-release charts/common --values charts/common/ci/test-values.yaml
          helm template test-release charts/common --values charts/common/ci/test-values.yaml --values charts/common/ci/ingress-values.yaml
          helm template test-release charts/data-lab-helm --values charts/data-lab-helm/values.yaml
          helm template test-release charts/patchmon-helm --values charts/patchmon-helm/ci/test-values.yaml
          helm template test-release charts/tompero-helm --values charts/tompero-helm/values.yaml
          helm template test-release charts/padel-score-helm --values charts/padel-score-helm/ci/test-values.yaml
          helm template test-release charts/meiun-helm --values charts/meiun-helm/ci/test-values.yaml
          helm template test-release charts/ticket-live-event-scanner-helm --values charts/ticket-live-event-scanner-helm/ci/test-values.yaml
          helm template test-release charts/eng-metrics-lab-helm --values charts/eng-metrics-lab-helm/values.yaml
          helm template test-release charts/firstdime-helm --values charts/firstdime-helm/ci/test-values.yaml
          helm template test-release charts/firstdime-helm --values charts/firstdime-helm/ci/test-values.yaml --values charts/firstdime-helm/ci/frankfurter-values.yaml
          helm template test-release charts/firstdime-helm --values charts/firstdime-helm/ci/test-values.yaml --values charts/firstdime-helm/ci/bank-sync-values.yaml

      - name: Validate rendered templates
        run: |
          helm template test-release charts/common --values charts/common/ci/test-values.yaml | kubeconform -summary
          helm template test-release charts/common --values charts/common/ci/test-values.yaml --values charts/common/ci/ingress-values.yaml | kubeconform -summary
          helm template test-release charts/data-lab-helm --values charts/data-lab-helm/values.yaml | kubeconform -summary
          helm template test-release charts/patchmon-helm --values charts/patchmon-helm/ci/test-values.yaml | kubeconform -summary
          helm template test-release charts/tompero-helm --values charts/tompero-helm/values.yaml | kubeconform -summary
          helm template test-release charts/padel-score-helm --values charts/padel-score-helm/ci/test-values.yaml | kubeconform -summary
          helm template test-release charts/meiun-helm --values charts/meiun-helm/ci/test-values.yaml | kubeconform -summary
          helm template test-release charts/ticket-live-event-scanner-helm --values charts/ticket-live-event-scanner-helm/ci/test-values.yaml | kubeconform -summary
          helm template test-release charts/eng-metrics-lab-helm --values charts/eng-metrics-lab-helm/values.yaml | kubeconform -summary
          helm template test-release charts/firstdime-helm --values charts/firstdime-helm/ci/test-values.yaml | kubeconform -summary
          helm template test-release charts/firstdime-helm --values charts/firstdime-helm/ci/test-values.yaml --values charts/firstdime-helm/ci/frankfurter-values.yaml | kubeconform -summary
          helm template test-release charts/firstdime-helm --values charts/firstdime-helm/ci/test-values.yaml --values charts/firstdime-helm/ci/bank-sync-values.yaml | kubeconform -summary

      - name: Run helm-unittest
        run: |
          helm unittest charts/common --file 'tests/**/*.yaml'
          helm unittest charts/data-lab-helm --file 'tests/**/*.yaml'
          helm unittest charts/patchmon-helm --file 'tests/**/*.yaml'
          helm unittest charts/tompero-helm --file 'tests/**/*.yaml'
          helm unittest charts/padel-score-helm --file 'tests/**/*.yaml'
          helm unittest charts/meiun-helm --file 'tests/**/*.yaml'
          helm unittest charts/ticket-live-event-scanner-helm --file 'tests/**/*.yaml'
          helm unittest charts/eng-metrics-lab-helm --file 'tests/**/*.yaml'
          helm unittest charts/firstdime-helm --file 'tests/**/*.yaml'

  # Publishes every chart whose Chart.yaml version has no release yet, only
  # after lint-test passed on the same push to main. Never runs on PRs.
  release:
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@a917fd15b20e8b64b94d9158ad54cd6345335584 # v1.6.0
        with:
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
