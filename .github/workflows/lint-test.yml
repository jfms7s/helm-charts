name: Lint and Test Charts

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Add Helm repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Install helm-unittest plugin
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 1.1.2 --verify=false

      - name: Lint Helm charts
        run: |
          helm lint charts/common
          helm lint charts/affine-helm
          helm lint charts/data-lab-helm
          helm lint charts/patchmon-helm
          helm lint charts/ticket-live-event-scanner-helm

      - name: Template Helm charts
        run: |
          helm template test-release charts/common --values charts/common/values.yaml
          helm template test-release charts/affine-helm --values charts/affine-helm/values.yaml
          helm template test-release charts/data-lab-helm --values charts/data-lab-helm/values.yaml
          helm template test-release charts/patchmon-helm --values charts/patchmon-helm/values.yaml
          helm template test-release charts/ticket-live-event-scanner-helm --values charts/ticket-live-event-scanner-helm/values.yaml

      - name: Install kubeconform
        run: |
          # kubeval (previously used here) is archived upstream and its default
          # schema host (kubernetesjsonschema.dev) is dead; kubeconform is its
          # maintained successor.
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin

      - name: Validate rendered templates
        run: |
          helm template test-release charts/common --values charts/common/values.yaml | kubeconform -summary
          helm template test-release charts/affine-helm --values charts/affine-helm/values.yaml | kubeconform -summary
          helm template test-release charts/data-lab-helm --values charts/data-lab-helm/values.yaml | kubeconform -summary
          helm template test-release charts/patchmon-helm --values charts/patchmon-helm/values.yaml | kubeconform -summary
          helm template test-release charts/ticket-live-event-scanner-helm --values charts/ticket-live-event-scanner-helm/values.yaml | kubeconform -summary

      - name: Run helm-unittest
        run: |
          helm unittest charts/common --file 'tests/**/*.yaml'
          helm unittest charts/affine-helm --file 'tests/**/*.yaml'
          helm unittest charts/data-lab-helm --file 'tests/**/*.yaml'
          helm unittest charts/patchmon-helm --file 'tests/**/*.yaml'
          helm unittest charts/ticket-live-event-scanner-helm --file 'tests/**/*.yaml'