# Default values for data-lab-helm.

## @section Engine namespaces + RBAC

spark:
  ## @param spark.enabled Create the Spark namespace, ServiceAccount and Role
  ## @param spark.namespace Namespace for Spark drivers/executors
  ## @param spark.serviceAccount ServiceAccount the driver authenticates as
  ##
  enabled: true
  namespace: spark
  serviceAccount: spark

flink:
  ## @param flink.enabled Create the Flink namespace, ServiceAccount and Role
  ## @param flink.namespace Namespace for Flink JobManager/TaskManagers
  ## @param flink.serviceAccount ServiceAccount the JobManager authenticates as
  ##
  enabled: true
  namespace: flink
  serviceAccount: flink

## @section Pod Security Admission

## Pod Security Admission levels for both lab namespaces (privileged, baseline
## or restricted; "" skips that mode). The engine ServiceAccounts can create
## pods, so `enforce` keeps a leaked token from starting a privileged or
## hostPath pod. baseline, not restricted: the lab pods mount inline `nfs:`
## volumes, which restricted forbids. warn/audit at restricted only report.
## @param podSecurity.enforce Level the API server enforces
## @param podSecurity.warn Level reported back to the client as a warning
## @param podSecurity.audit Level recorded in the audit log
##
podSecurity:
  enforce: baseline
  warn: restricted
  audit: restricted

# Datasets are generated by the exercise scripts (obsidian-vault:
# learning/engineering/spark/exercises/scripts/seed.sh), which run locally
# and write to s3a://datasets/... — this chart provisions only the
# namespaces/RBAC the Spark driver and executors need to submit jobs. The
# object store itself (RustFS) and its buckets are provisioned separately —
# see helm-argo-cd's data-lab Application (second source) and
# terraform-provision/rustfs.
