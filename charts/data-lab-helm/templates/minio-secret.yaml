apiVersion: v1
kind: Secret
metadata:
  name: {{ include "data-lab-helm.fullname" . }}-minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-lab-helm.labels" (dict "context" $ "name" "minio" "component" "object-store") | nindent 4 }}
type: Opaque
stringData:
  root-user: {{ .Values.minio.rootUser | quote }}
  root-password: {{ .Values.minio.rootPassword | quote }}
