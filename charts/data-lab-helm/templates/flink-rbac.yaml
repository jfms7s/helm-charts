{{- if .Values.flink.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.flink.serviceAccount }}
  namespace: {{ .Values.flink.namespace }}
  labels:
    {{- include "data-lab-helm.labels" (dict "context" $ "name" "flink" "component" "rbac") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.flink.serviceAccount }}
  namespace: {{ .Values.flink.namespace }}
  labels:
    {{- include "data-lab-helm.labels" (dict "context" $ "name" "flink" "component" "rbac") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.flink.serviceAccount }}
  namespace: {{ .Values.flink.namespace }}
  labels:
    {{- include "data-lab-helm.labels" (dict "context" $ "name" "flink" "component" "rbac") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.flink.serviceAccount }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.flink.serviceAccount }}
    namespace: {{ .Values.flink.namespace }}
{{- end }}
