{{- if .Values.spark.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.spark.serviceAccount }}
  namespace: {{ .Values.spark.namespace }}
  labels:
    {{- include "data-lab-helm.labels" (dict "context" $ "name" "spark" "component" "rbac") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.spark.serviceAccount }}
  namespace: {{ .Values.spark.namespace }}
  labels:
    {{- include "data-lab-helm.labels" (dict "context" $ "name" "spark" "component" "rbac") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.spark.serviceAccount }}
  namespace: {{ .Values.spark.namespace }}
  labels:
    {{- include "data-lab-helm.labels" (dict "context" $ "name" "spark" "component" "rbac") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.spark.serviceAccount }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.spark.serviceAccount }}
    namespace: {{ .Values.spark.namespace }}
{{- end }}
