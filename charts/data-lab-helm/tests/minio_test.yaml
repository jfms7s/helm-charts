# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: minio
templates:
  - templates/minio-deployment.yaml
  - templates/minio-service.yaml
  - templates/minio-secret.yaml
tests:
  - it: deployment runs non-root with a read-only rootfs and no caps
    template: templates/minio-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: ["ALL"]
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: reads credentials from the secret, never inline
    template: templates/minio-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: RELEASE-NAME-minio
      - notExists:
          path: spec.template.spec.containers[0].env[0].value

  - it: service exposes NodePorts for S3 + console by default
    template: templates/minio-service.yaml
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - equal:
          path: spec.ports[0].nodePort
          value: 30900
      - equal:
          path: spec.ports[1].nodePort
          value: 30901

  - it: service drops NodePorts when set to ClusterIP
    template: templates/minio-service.yaml
    set:
      minio.service.type: ClusterIP
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - notExists:
          path: spec.ports[0].nodePort
