# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: namespaces
templates:
  - templates/namespaces.yaml
tests:
  - it: enforces Pod Security baseline and warns/audits at restricted on both namespaces
    asserts:
      - hasDocuments:
          count: 2
      - isSubset:
          path: metadata.labels
          content:
            pod-security.kubernetes.io/enforce: baseline
            pod-security.kubernetes.io/enforce-version: latest
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/warn-version: latest
            pod-security.kubernetes.io/audit: restricted
            pod-security.kubernetes.io/audit-version: latest

  - it: skips a mode left empty
    set:
      podSecurity.warn: ""
      podSecurity.audit: ""
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            pod-security.kubernetes.io/enforce: baseline
      - notExists:
          path: metadata.labels["pod-security.kubernetes.io/warn"]
      - notExists:
          path: metadata.labels["pod-security.kubernetes.io/warn-version"]
      - notExists:
          path: metadata.labels["pod-security.kubernetes.io/audit"]

  - it: renders no Pod Security labels when podSecurity is empty
    set:
      podSecurity: null
    asserts:
      - notExists:
          path: metadata.labels["pod-security.kubernetes.io/enforce"]
      - notExists:
          path: metadata.labels["pod-security.kubernetes.io/warn"]

  - it: fails on a level Pod Security Admission does not know
    set:
      podSecurity.enforce: strict
    asserts:
      - failedTemplate:
          errorMessage: "data-lab-helm: podSecurity.enforce must be privileged, baseline or restricted (got \"strict\")"

  - it: names the namespaces spark and flink with the chart's labels
    asserts:
      - isKind: {of: Namespace}
      - equal: {path: metadata.name, value: spark}
        documentIndex: 0
      - equal: {path: metadata.name, value: flink}
        documentIndex: 1
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: spark
            app.kubernetes.io/component: namespace
            app.kubernetes.io/part-of: data-lab
        documentIndex: 0
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: flink
            app.kubernetes.io/component: namespace
            app.kubernetes.io/part-of: data-lab
        documentIndex: 1

  - it: uses custom namespace names
    set:
      spark.namespace: spark-lab
      flink.namespace: flink-lab
    asserts:
      - equal: {path: metadata.name, value: spark-lab}
        documentIndex: 0
      - equal: {path: metadata.name, value: flink-lab}
        documentIndex: 1

  - it: drops the spark namespace when spark is disabled
    set:
      spark.enabled: false
    asserts:
      - hasDocuments: {count: 1}
      - equal: {path: metadata.name, value: flink}

  - it: drops the flink namespace when flink is disabled
    set:
      flink.enabled: false
    asserts:
      - hasDocuments: {count: 1}
      - equal: {path: metadata.name, value: spark}

  # A Namespace takes everything in it when deleted: disabling an engine,
  # renaming its namespace, uninstalling or deleting the Argo CD Application
  # must leave the Namespace in place (removing it is a manual step).
  - it: keeps both namespaces on uninstall, prune and Application deletion
    asserts:
      - equal:
          path: metadata.annotations
          value:
            helm.sh/resource-policy: keep
            argocd.argoproj.io/sync-options: Prune=false,Delete=false
