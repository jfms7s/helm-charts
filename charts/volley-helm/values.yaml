image:
  repository: ghcr.io/jfms7s/volley
  tag: v0.1.0
  pullPolicy: IfNotPresent
# Name a docker-registry Secret here if the image is private, e.g. [{name: ghcr-pull}].
imagePullSecrets: []

server:
  # Extra environment variables appended to the server container. Each entry
  # is {name, value} or {name, valueFrom} (valueFrom wins when both are set).
  # Useful ones: VOLLEY_LAG_MS (artificial latency, testing only) and
  # VOLLEY_LAYOUT (force one layout id).
  extraEnv: []

# volley is stateless on disk: rooms live in the server's memory, so there is
# no volume. That also fixes the pod count at one (see templates/deployment.yaml).
resources: {}
  # requests:
  #   cpu: 50m
  #   memory: 64Mi
  # limits:
  #   memory: 256Mi

# The image runs as the alpine "node" user (uid 1000) and writes nothing, so
# the root filesystem can be read-only.
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

podSecurityContext: {}

# Seconds the pod keeps running after SIGTERM/endpoint removal. The server has
# no graceful drain, so this only bounds how long a stuck shutdown can hang.
terminationGracePeriodSeconds: 30

ingress:
  enabled: false
  className: ""
  # WebSocket upgrades on /ws need no special annotation on Traefik or
  # ingress-nginx (nginx: raise proxy-read-timeout if idle sockets get cut).
  annotations: {}
    # traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: volley.example.local
      paths:
        - path: /
          pathType: Prefix
          port: 8080
  tls: []
