apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-affine-copilot-config
  labels:
    {{- include "affine-helm.labels" (dict "context" $ "name" "affine" "component" "server") | nindent 4 }}
type: Opaque
stringData:
  # Mounted at /root/.affine/config/config.json -- server-side AI/BYOK gating
  # as of AFFiNE 0.27+. See the `copilot` comment in values.yaml.
  config.json: |
    {{ dict "copilot" (dict "enabled" .Values.copilot.enabled "byok" (dict "enabled" .Values.copilot.byok.enabled "allowCustomEndpoint" .Values.copilot.byok.allowCustomEndpoint "allowPrivateEndpoint" .Values.copilot.byok.allowPrivateEndpoint)) | toJson }}
