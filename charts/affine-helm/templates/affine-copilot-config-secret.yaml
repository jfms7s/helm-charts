apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-affine-copilot-config
  labels:
    {{- include "affine-helm.labels" (dict "context" $ "name" "affine" "component" "server") | nindent 4 }}
type: Opaque
stringData:
  # Mounted at /root/.affine/config/config.json -- server-side AI provider
  # config as of AFFiNE 0.27+. See the `copilot` comment in values.yaml.
  config.json: |
    {{ dict "copilot" (dict "enabled" .Values.copilot.enabled "providers" (dict "openai" (dict "apiKey" .Values.copilot.openai.apiKey "baseURL" .Values.copilot.openai.baseUrl))) | toJson }}
