apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-affine
  labels:
    {{- include "affine-helm.labels" (dict "context" $ "name" "affine" "component" "server") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "affine-helm.selectorLabels" (dict "context" $ "name" "affine") | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "affine-helm.labels" (dict "context" $ "name" "affine" "component" "server") | nindent 8 }}
    spec:
      containers:
        - name: affine-server
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: AFFINE_INDEXER_ENABLED
              value: "false"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "affine-helm.postgres.secretName" . }}
                  key: {{ include "affine-helm.postgres.secretKey" . }}
            - name: DATABASE_URL
              value: postgresql://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@{{ .Release.Name }}-postgres:5432/{{ .Values.postgres.db }}
            - name: REDIS_SERVER_HOST
              value: {{ .Release.Name }}-redis
          ports:
            - name: http
              containerPort: 3010
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - mountPath: /root/.affine/storage
              name: affine-storage
            - mountPath: /root/.affine/config
              name: affine-config
            - mountPath: /root/.affine/config/config.json
              subPath: config.json
              name: affine-copilot-config
              readOnly: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      restartPolicy: Always
      volumes:
        - name: affine-config
          {{- if .Values.persistence.config.volume }}
          {{- toYaml .Values.persistence.config.volume | nindent 10 }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: affine-storage
          {{- if .Values.persistence.storage.volume }}
          {{- toYaml .Values.persistence.storage.volume | nindent 10 }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: affine-copilot-config
          secret:
            secretName: {{ .Release.Name }}-affine-copilot-config
            items:
              - key: config.json
                path: config.json
