apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "affine-helm.labels" (dict "context" $ "name" "postgres" "component" "database") | nindent 4 }}
spec:
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    {{- include "affine-helm.selectorLabels" (dict "context" $ "name" "postgres") | nindent 4 }}
