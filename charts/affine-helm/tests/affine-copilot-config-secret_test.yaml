# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: affine-copilot-config-secret
templates:
  - templates/affine-copilot-config-secret.yaml
tests:
  - it: renders default BYOK gating with copilot disabled by default
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-affine-copilot-config
      - equal:
          path: stringData["config.json"]
          value: |
            {"copilot":{"byok":{"allowCustomEndpoint":false,"allowPrivateEndpoint":false,"enabled":true},"enabled":false}}

  - it: allows a custom private-network BYOK endpoint when enabled
    set:
      copilot.enabled: true
      copilot.byok.allowCustomEndpoint: true
      copilot.byok.allowPrivateEndpoint: true
    asserts:
      - equal:
          path: stringData["config.json"]
          value: |
            {"copilot":{"byok":{"allowCustomEndpoint":true,"allowPrivateEndpoint":true,"enabled":true},"enabled":true}}
