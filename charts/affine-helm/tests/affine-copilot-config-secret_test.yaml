# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: affine-copilot-config-secret
templates:
  - templates/affine-copilot-config-secret.yaml
tests:
  - it: renders a disabled provider config by default
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-affine-copilot-config
      - equal:
          path: stringData["config.json"]
          value: |
            {"copilot":{"enabled":false,"providers":{"openai":{"apiKey":"","baseURL":"https://api.openai.com/v1"}}}}

  - it: embeds the OpenAI API key and base URL when copilot is enabled
    set:
      copilot.enabled: true
      copilot.openai.apiKey: sk-test-123
      copilot.openai.baseUrl: https://my-proxy.example.com/v1
    asserts:
      - equal:
          path: stringData["config.json"]
          value: |
            {"copilot":{"enabled":true,"providers":{"openai":{"apiKey":"sk-test-123","baseURL":"https://my-proxy.example.com/v1"}}}}
