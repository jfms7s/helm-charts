# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: affine-secret
templates:
  - templates/affine-secret.yaml
tests:
  - it: base64-encodes the CHANGE_ME placeholder password by default
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-affine-postgres
      - equal:
          path: type
          value: Opaque
      - equal:
          path: data["postgres-password"]
          value: Q0hBTkdFX01F # base64("CHANGE_ME")

  - it: base64-encodes a custom password from values
    set:
      postgres.password: s3cr3t
    asserts:
      - equal:
          path: data["postgres-password"]
          value: czNjcjN0 # base64("s3cr3t")

  - it: renders nothing when postgres.existingSecret is set
    set:
      postgres.existingSecret: my-external-secret
    asserts:
      - hasDocuments:
          count: 0
