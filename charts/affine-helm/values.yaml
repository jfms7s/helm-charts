image:
  repository: ghcr.io/toeverything/affine
  tag: stable
  pullPolicy: IfNotPresent

replicas: 1

# Volume sources for the affine server's persistent directories. Each value is
# the full body of a Kubernetes volume source (excluding `name`) -- nfs,
# hostPath, persistentVolumeClaim, etc. Left empty (emptyDir, non-persistent)
# by default since the right backend is environment-specific; set explicitly
# by the caller, e.g.:
#   config:
#     volume:
#       nfs:
#         server: 192.168.1.10
#         path: /volumes/affine/config
persistence:
  config:
    volume: {}
  storage:
    volume: {}

postgres:
  image:
    repository: pgvector/pgvector
    tag: "pg16"
    pullPolicy: IfNotPresent
  db: affine
  user: affine
  # Password for the affine-postgres database, as a standard Kubernetes
  # EnvVarSource: set `value` for a plain literal (Argo CD does not support
  # Helm's `lookup` function, so this can't be safely auto-generated and
  # persisted across syncs -- pin it explicitly, e.g. from a values-secrets
  # file kept out of version control), or `valueFrom` (e.g. a `secretKeyRef`)
  # to source it from a Secret you manage yourself instead (an external
  # secrets manager, ...). `valueFrom` takes precedence when both are set.
  password:
    value: "CHANGE_ME"
    valueFrom: {}
  resources: {}
  # Volume source for the Postgres data directory. Same shape as
  # persistence.config.volume above; defaults to emptyDir when unset.
  persistence:
    volume: {}

redis:
  image:
    repository: redis
    tag: latest
    pullPolicy: IfNotPresent
  resources: {}

# AFFiNE's AI features (server config.json, mounted read-only into
# /root/.affine/config/config.json alongside the persistent config volume --
# see https://docs.affine.pro/self-host-affine/install/configuration).
# `OPENAI_API_KEY`/`OPENAI_BASE_URL` env vars stopped being read as of server
# version 0.27; this is the only way to set a server-wide provider key now.
copilot:
  enabled: false
  openai:
    apiKey: ""
    baseUrl: "https://api.openai.com/v1"

resources: {}
  # limits:
  #   cpu: 1000m
  #   memory: 1Gi
  # requests:
  #   cpu: 250m
  #   memory: 512Mi

securityContext: {}
  # runAsNonRoot: true
  # runAsUser: 1000

podSecurityContext: {}
  # fsGroup: 1000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # traefik.ingress.kubernetes.io/rewrite-target: "/"
  hosts:
    - host: affine.example.local
      paths:
        - path: /
          pathType: Prefix
          port: 3010
  tls: []
