image:
  repository: ghcr.io/toeverything/affine
  tag: stable
  pullPolicy: IfNotPresent

replicas: 1

nfs:
  server: "192.168.10.3"
  configPath: "/volume1/k8s/volumes/affine/config"
  storagePath: "/volume1/k8s/volumes/affine/storage"
  postgresDataPath: "/volume1/k8s/volumes/affine/postgres-data"

postgres:
  image:
    repository: pgvector/pgvector
    tag: "pg16"
  db: affine
  user: affine
  # Leave empty to auto-generate and persist a random password in a Secret.
  password: ""

redis:
  image:
    repository: redis
    tag: latest

openai:
  apiKey: "none"
  baseUrl: "http://192.168.0.244:11434/api/v1"

resources: {}
  # limits:
  #   cpu: 1000m
  #   memory: 1Gi
  # requests:
  #   cpu: 250m
  #   memory: 512Mi

securityContext: {}
  # runAsNonRoot: true
  # runAsUser: 1000

podSecurityContext: {}
  # fsGroup: 1000

ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/rewrite-target: "/"
  hosts:
    - host: affine.k3s.dragonbyte.myds.me
      paths:
        - path: /
          pathType: Prefix
          port: 3010
  tls: []