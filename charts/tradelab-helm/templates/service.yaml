apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-tradelab
  labels:
    {{- include "tradelab-helm.labels" (dict "context" $ "name" "tradelab" "component" "app") | nindent 4 }}
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "tradelab-helm.selectorLabels" (dict "context" $ "name" "tradelab") | nindent 4 }}
