# CI-only: turns on every off-by-default branch so kubeconform -strict sees it
# (layered on ci/test-values.yaml by the Makefile's validate loop). The
# ServiceMonitor stays off: kubeconform has no schema for its CRD.
imagePullSecrets:
  - name: regcred
persistence:
  subPath: data
seLinuxLevel: "s0:c123,c456"
backup:
  enabled: true
  claim:
    storageClassName: nfs-client
    size: 5Gi
  volume:
    persistentVolumeClaim:
      claimName: test-release-tradelab-backup
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
api:
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
worker:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
live:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
nodeSelector:
  kubernetes.io/arch: amd64
tolerations:
  - key: dedicated
    operator: Equal
    value: apps
    effect: NoSchedule
ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
