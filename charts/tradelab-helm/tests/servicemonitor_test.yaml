# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: servicemonitor
templates:
  - templates/servicemonitor.yaml
values:
  - ../ci/test-values.yaml
release:
  name: tradelab
  namespace: tradelab
tests:
  - it: is off by default
    asserts:
      - hasDocuments:
          count: 0

  - it: scrapes /metrics on the Service's http port
    set:
      metrics.serviceMonitor.enabled: true
    asserts:
      - isKind:
          of: ServiceMonitor
      - equal:
          path: metadata.name
          value: tradelab-tradelab
      - equal:
          path: spec.selector
          value:
            matchLabels:
              app.kubernetes.io/name: tradelab
              app.kubernetes.io/instance: tradelab
      - equal:
          path: spec.namespaceSelector.matchNames
          value: [tradelab]
      - equal:
          path: spec.endpoints
          value: [{port: http, path: /metrics, interval: 30s}]

  - it: takes extra labels
    set:
      metrics.serviceMonitor.enabled: true
      metrics.serviceMonitor.labels: {release: kube-prometheus-stack}
    asserts:
      - equal:
          path: metadata.labels.release
          value: kube-prometheus-stack
