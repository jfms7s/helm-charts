# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: service
templates:
  - templates/service.yaml
tests:
  - it: exposes http 8080 to the app pod
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-tradelab
      - equal:
          path: spec.ports
          value: [{name: http, port: 8080, targetPort: http, protocol: TCP}]
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: tradelab
            app.kubernetes.io/instance: RELEASE-NAME
