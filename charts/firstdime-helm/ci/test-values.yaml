# Test values for CI/CD - contains valid dummy credentials for rendering and testing
# This file is used by: .github/workflows/lint-test.yml, Makefile, and helm-unittest

# postgres.existingSecret is required; postgres.enabled stays at its default (true) so the StatefulSet renders.
postgres:
  existingSecret: firstdime-postgres

sessionCookieSecret:
  value: "test-session-secret-1234567890abcdefghijklmnop"

appEncryptionKey:
  value: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="

# The old libSQL server stays renderable (lint/kubeconform) until it is removed.
sqld:
  enabled: true
  persistence:
    volume:
      persistentVolumeClaim:
        claimName: firstdime-sqld-data

attachments:
  volume:
    persistentVolumeClaim:
      claimName: firstdime-attachments
