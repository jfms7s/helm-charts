# Global settings
imagePullSecrets: []
  # - name: my-registry-secret

registrationEnabled: true

# Time zone for the application (used by api and worker)
tz: UTC

# Postgres 18, the database of the api and the worker: one StatefulSet replica
# on one block-storage (iSCSI) volume. Set
# enabled to false to use a Postgres outside the chart; the api and worker
# still read DATABASE_URL from existingSecret.
postgres:
  enabled: true
  image:
    repository: docker.io/library/postgres
    tag: "18.6-bookworm"     # Postgres 18 (PGlite's and meiun's major); multi-arch (amd64, arm64). Callers pin a digest.
    pullPolicy: IfNotPresent
  user: firstdime            # POSTGRES_USER: the superuser the image creates; owns the database
  database: firstdime        # POSTGRES_DB
  # REQUIRED, also when enabled is false (api, worker and the copy Job read DATABASE_URL from it).
  # Keys: POSTGRES_PASSWORD (initdb only: changing it later does not change the database's password)
  # and DATABASE_URL, e.g. postgres://firstdime:<url-encoded password>@firstdime-postgres:5432/firstdime
  existingSecret: ""
  storageClass: synology-iscsi   # block storage (iSCSI), never NFS
  size: 2Gi
  # initdb flags, applied on the first start only (an existing data directory keeps its own).
  # C collation sorts text by bytes, as SQLite's BINARY did.
  initdbArgs: "--locale=C --encoding=UTF8"
  # Server settings, each rendered as `-c <key>=<value>`, values quoted strings (a bare number fails the
  # render). A caller's map merges with these defaults (add keys, override them); set a key to null to
  # drop it. timezone and log_timezone are fixed to UTC by the chart.
  config:
    max_connections: "30"
    shared_buffers: "128MB"
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Nightly pg_dump of the chart's Postgres to an NFS export (rendered when postgres.enabled and backup.enabled).
# A dump is renamed into place only after pg_restore can read it; older ones are deleted after each good dump.
backup:
  enabled: true
  schedule: "30 2 * * *"     # UTC (the CronJob's timeZone is fixed to Etc/UTC)
  retainCount: 14            # dumps kept on the NAS; older ones are deleted after each good dump
  # NFS export the dumps go to (REQUIRED while backup and postgres are enabled). The directory
  # must exist before the first run, created by root on the NAS and writable by runAsUser
  # (e.g. chown 999:999, chmod 0700); a root-squashed export can't be written.
  nfs:
    server: ""
    path: ""
  # The postgres image's own user. fsGroup is not applied on NFS, so the directory's owner must match.
  runAsUser: 999
  runAsGroup: 999
  resources:
    requests:
      memory: 64Mi
    limits:
      memory: 256Mi

# One-shot Job that copies the old sqld (libSQL) database into the empty Postgres and verifies it, using
# First Dime's copy script. Off by default; see the README.
copyJob:
  enabled: false
  # copy: copy sqld into the empty Postgres, then verify. verify: compare only, write nothing (--verify-only).
  # Each mode has its own Job name (<fullname>-copy, <fullname>-copy-verify).
  mode: copy
  # Image with the copy script. Empty repository/tag = the api image (api.image). PR 8 in the
  # firstdime repo decides which image ships scripts/migrate-sqlite-to-pg; set these if it is not the api's.
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  command:
    - node
    - scripts/migrate-sqlite-to-pg/index.mjs
  # libSQL URL of the sqld being copied. Empty = this chart's own sqld (http://<fullname>-sqld:8080),
  # which then must be enabled (sqld.enabled: true).
  sourceUrl: ""
  # Secret key holding sqld's auth token (REQUIRED when enabled), exposed to the script as COPY_SOURCE_TOKEN.
  sourceTokenSecret:
    name: ""
    key: ""
  activeDeadlineSeconds: 3600
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# LibSQL (sqld) database server (in-cluster, strategy: Recreate). The old
# database, kept only for the move to Postgres: the copy Job reads it and a
# rollback runs on its volume. The api and worker no longer connect to it. Set
# true during the cutover window, false after.
sqld:
  enabled: false
  image:
    repository: ghcr.io/tursodatabase/libsql-server
    tag: "v0.24.33"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: 160Mi
    limits:
      memory: 384Mi
  # Non-root user ID (numeric)
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  # WAL checkpoint interval in seconds (sqld --checkpoint-interval-s). Empty
  # keeps sqld's default: SQLite checkpoints after any commit that leaves the
  # WAL over 1000 pages, and keeps retrying on every later commit while readers
  # stop the WAL from resetting. Set, sqld turns those off (wal_autocheckpoint
  # = 0) and runs one TRUNCATE checkpoint per interval instead. Every
  # checkpoint goes through sqld's write-lock queue, and in libsql-server
  # 0.24.33 a slow one can leave that lock stuck for good
  # (tursodatabase/libsql#2286), so fewer checkpoints means fewer chances.
  checkpointIntervalSeconds: ""
  # Extra command-line arguments and environment variables (lists) for sqld.
  extraArgs: []
  extraEnv: []
  # Liveness probe that writes: BEGIN IMMEDIATE; ROLLBACK against sqld's HTTP
  # API. Disabled, the liveness probe is a TCP check, which keeps passing while
  # writes are stuck. Needs /bin/bash in the image (the official one has it).
  writeProbe:
    enabled: false
    initialDelaySeconds: 30
    periodSeconds: 30
    # Seconds the probe waits for sqld's answer (kubelet's timeout is one more).
    timeoutSeconds: 10
    # Consecutive failures before kubelet restarts sqld: a stuck write lock is
    # cleared within about failureThreshold x periodSeconds.
    failureThreshold: 3
  # Volume source for sqld database file (REQUIRED). Each value is the full
  # body of a Kubernetes volume source (excluding `name`) -- nfs, hostPath,
  # persistentVolumeClaim, etc. On NFS, fsGroup is not applied; the directory
  # must be writable by uid 1000.
  persistence:
    volume:
    # Optional: have the chart create a PVC named
    # <fullname>-sqld-data, where <fullname> is the release name if it
    # contains "firstdime", else <release>-firstdime. Point `volume` at it with
    # persistentVolumeClaim.claimName. Kept on uninstall/prune.
    claim:
      # Optional PVC name (default <fullname>-<component>-data).
      name: ""
      storageClassName: ""
      size: ""
    # Optional subdirectory of the volume to mount (keeps ext4's lost+found
    # out of the data dir on block-backed PVCs).
    subPath: ""

# Frankfurter exchange-rate API (self-hosted, lineofflight/frankfurter, MIT).
# When enabled, the worker gets FRANKFURTER_URL pointing at it and fills in
# exchange rates hourly (First Dime's exchange-rate-fetch job). Its
# database is SQLite: put it on block storage (iSCSI), never NFS. Needs
# outbound internet to the central banks it downloads from.
frankfurter:
  enabled: false
  image:
    repository: docker.io/lineofflight/frankfurter
    tag: "v2.6.1"
    pullPolicy: IfNotPresent
  # Puma web worker processes (WORKER_PROCESSES). 0 = Puma single mode, one
  # process; the image default is 4. Keeps memory down on small nodes; the API
  # serves one hourly caller.
  workerProcesses: 0
  # Measured 2026-10-06 (v2.6.1): ~470-500 MB container usage during the initial backfill.
  resources:
    requests:
      memory: 384Mi
    limits:
      memory: 768Mi
  # The image's own user (frankfurter) is uid/gid 1000.
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  extraEnv: []
  # Volume source for Frankfurter's SQLite database (REQUIRED when enabled),
  # mounted at /app/data (DATABASE_URL is set to sqlite:///app/data/frankfurter.sqlite3).
  # A {volume, claim, subPath} map: `volume` is the body of a Kubernetes volume
  # source (nfs, persistentVolumeClaim, ...), as in sqld.persistence. Size the claim at 5Gi or more: a partial
  # backfill (9 of 104 providers) was already 170 MB. claim.name overrides the
  # chart-created PVC's name (default <fullname>-frankfurter-data),
  # e.g. to move to another storage class: a claim's class can't be changed in
  # place, and the old claim is kept (resource-policy keep).
  persistence:
    volume:
    claim:
      name: ""
      storageClassName: ""
      size: ""
    subPath: ""
  # Pod placement, e.g. a dedicated node pool (nodeSelector + tolerations). With
  # node-local storage (local-path) the pod stays on the node its claim was
  # first bound on.
  nodeSelector: {}
  tolerations: []
  affinity: {}

# bank-sync (apps/bank-sync): Enable Banking client that pushes booked bank
# transactions into this release's api through POST /imports (BANK_SYNC_FD_URL
# is the api Service). One instance per tenant: one PAT, one admin password.
# Its state is a SQLite file: put it on block storage (iSCSI), never NFS.
# 0 or 1 replica (never two: startup clears the run lease), Recreate (hardcoded).
bankSync:
  enabled: false
  # 0 stops it (cutover); anything above 1 fails the render.
  replicas: 1
  image:
    repository: ghcr.io/jfms7s/firstdime-bank-sync
    tag: "v0.18.0"
    pullPolicy: IfNotPresent
  # Ingress host of the admin page (REQUIRED when enabled). BANK_SYNC_PUBLIC_URL
  # is https://<host>, no path; the Enable Banking app's redirect URL must be
  # exactly https://<host>/callback. Only port 80 (the admin page) is routed;
  # the metrics port never is.
  host: ""
  # TLS for the bank-sync Ingress; empty uses ingress.tls (whose hosts must
  # then include bankSync.host) or the cluster's default certificate.
  tls: []
  # Enable Banking country whose banks are offered (BANK_SYNC_EB_COUNTRY).
  country: PT
  # Proxies whose X-Forwarded-For bank-sync believes (BANK_SYNC_TRUST_PROXY),
  # so the login limiter keys on the client, not the ingress: comma-separated
  # addresses or CIDR ranges, e.g. the pod network Traefik runs in
  # ("10.42.0.0/16" on k3s). Empty trusts nobody. Never "true" or a hop count:
  # the chart and bank-sync both refuse them.
  trustProxy: ""
  logLevel: info
  # Credentials (REQUIRED when enabled). Each is a standard Kubernetes
  # EnvVarSource like sessionCookieSecret: `value` for a literal, or `valueFrom`
  # (e.g. secretKeyRef); valueFrom wins when both are set.
  # Enable Banking application id (BANK_SYNC_EB_APP_ID).
  ebAppId:
    value: ""
    valueFrom: {}
  # First Dime personal access token (BANK_SYNC_FD_TOKEN), scopes exactly
  # imports:write imports:read accounts:read. Renamed from bmToken in 0.8.0
  # (setting bmToken fails the render).
  fdToken:
    value: ""
    valueFrom: {}
  # argon2id hash of the admin password (BANK_SYNC_ADMIN_PASSWORD_HASH), from
  # `pnpm --filter @firstdime/bank-sync hash-password`.
  adminPasswordHash:
    value: ""
    valueFrom: {}
  # Session cookie signing secret (BANK_SYNC_SESSION_SECRET), 32+ characters.
  sessionSecret:
    value: ""
    valueFrom: {}
  # Secret holding the Enable Banking application's PEM private key (REQUIRED
  # when enabled). Only that key is mounted, read-only (0400), at
  # /run/secrets/eb/private.key (BANK_SYNC_EB_PRIVATE_KEY_FILE).
  privateKeySecret:
    name: ""
    key: eb-private-key
  resources:
    requests:
      memory: 96Mi
    limits:
      memory: 256Mi
  # The image's own user (USER 1000).
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  extraEnv: []
  # Volume source for the SQLite database (REQUIRED when enabled), mounted at
  # /app/.data (BANK_SYNC_DB_PATH=/app/.data/bank-sync.db). A {volume, claim,
  # subPath} map, `volume` being the body of a Kubernetes volume source;
  # claim.name defaults to <fullname>-bank-sync-data.
  persistence:
    volume:
    claim:
      name: ""
      storageClassName: ""
      size: ""
    subPath: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}

# API server configuration
api:
  image:
    repository: ghcr.io/jfms7s/firstdime-api
    tag: "v0.18.0"
    pullPolicy: IfNotPresent
  # 0 stops it (cutover). A whole number, 0 or more.
  replicas: 1
  resources:
    requests:
      memory: 160Mi
    limits:
      memory: 384Mi
  # Port the API listens on
  port: 3000
  # Non-root user ID (numeric; the 'node' user in the image maps to uid 1000)
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Worker (async tasks, scheduler, outbox relay) configuration.
# Never more than 1 replica (scheduler and outbox relay), Recreate strategy (hardcoded in the template).
worker:
  # 0 or 1 (anything else fails the render). 0 stops it (cutover).
  replicas: 1
  image:
    repository: ghcr.io/jfms7s/firstdime-worker
    tag: "v0.18.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: 160Mi
    limits:
      memory: 384Mi
  # Log level for the worker
  logLevel: info
  # WORKER_JOBS_ENABLED. false runs no scheduled job and no outbound runner
  # (webhooks, email, notifications) while the relay and the event consumers
  # keep running; the cutover starts the Postgres worker with false until the
  # owner's go. Must be a boolean (true/false): anything else fails the render.
  jobsEnabled: true
  # Allow webhooks to call private network addresses
  webhookAllowPrivateNetworks: false
  # Non-root user ID (numeric; the 'node' user in the image maps to uid 1000)
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Web UI (frontend) configuration
web:
  image:
    repository: ghcr.io/jfms7s/firstdime-web
    tag: "v0.18.0"
    pullPolicy: IfNotPresent
  # 0 stops it (cutover). A whole number, 0 or more.
  replicas: 1
  resources:
    requests:
      memory: 16Mi
    limits:
      memory: 64Mi
  # Port the web server listens on
  port: 8080
  # Non-root user ID (nginx-unprivileged: uid 101)
  runAsUser: 101
  runAsGroup: 101

# NATS JetStream message bus (handles webhooks, events, scheduling)
nats:
  image:
    repository: nats
    tag: "2.15.0-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: 32Mi
    limits:
      memory: 128Mi
  # Non-root user ID (numeric)
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  # Volume source for NATS JetStream file storage. Each value is the full
  # body of a Kubernetes volume source (excluding `name`) -- nfs, hostPath,
  # persistentVolumeClaim, etc. Left empty (emptyDir, non-persistent) by
  # default since the right backend is environment-specific; set explicitly
  # by the caller, e.g.:
  #   persistence:
  #     volume:
  #       nfs:
  #         server: 192.168.1.10
  #         path: /volume1/k8s/volumes/firstdime/nats
  # NOTE: On NFS, fsGroup is not applied (NFS ignores it). Ensure NFS
  # directories are writable by uid 1000 (see README storage section).
  persistence:
    volume: {}
    # Optional: have the chart create a PVC named
    # <fullname>-nats-data. Point `volume` at it with
    # persistentVolumeClaim.claimName. Kept on uninstall/prune.
    claim:
      # Optional PVC name (default <fullname>-<component>-data).
      name: ""
      storageClassName: ""
      size: ""
    # Optional subdirectory of the volume to mount (keeps ext4's lost+found
    # out of the data dir on block-backed PVCs).
    subPath: ""

# Session cookie secret (required credential)
sessionCookieSecret:
  value: "CHANGE_ME"
  valueFrom: {}

# Application encryption key (required credential, used for webhook secrets and 2FA)
appEncryptionKey:
  value: "CHANGE_ME"
  valueFrom: {}

# Attachments storage volume. REQUIRED: must be a shared volume (RWX/NFS) accessible to both api and worker pods.
# Using emptyDir (the default) breaks the shared-storage contract and causes data loss when pods restart.
# Example NFS volume:
#   volume:
#     nfs:
#       server: 192.168.1.10
#       path: /volume1/k8s/volumes/firstdime/attachments
# Example ReadWriteMany PersistentVolumeClaim:
#   volume:
#     persistentVolumeClaim:
#       claimName: firstdime-attachments
attachments:
  volume:

# SMTP configuration for email notifications (optional)
# Both smtpUrl and smtpFrom must be configured together for email to work
smtp:
  # SMTP URL (e.g., smtp://user:password@smtp.example.com:587)
  url:
    value: ""
    valueFrom: {}
  # Email address to send from
  from:
    value: ""
    valueFrom: {}

# OpenTelemetry exporter endpoint (optional, e.g. http://localhost:4317)
otelEndpoint: ""

# The reverse proxies whose X-Forwarded-For the api believes (TRUST_PROXY), so
# rate limits key on the client rather than the ingress: a comma-separated list
# of addresses or CIDR ranges, e.g. the pod network Traefik runs in
# ("10.42.0.0/16" on k3s). Empty trusts nobody. Never "true": the api refuses
# it, because it would believe a header anyone can send.
trustProxy: ""

# Ingress configuration
ingress:
  enabled: true
  className: traefik
  annotations: {}
  # Hosts for the web UI and API
  web:
    host: budget.example.com
  api:
    host: budget-api.example.com
  # TLS configuration (optional; defaults to cluster's default TLSStore certificate)
  tls: []
  # Example:
  #   - secretName: firstdime-tls
  #     hosts:
  #       - budget.example.com
  #       - budget-api.example.com

# Origin values derived from ingress hosts (can be overridden)
# API origin sent to the web frontend (derived from ingress.api.host by default)
apiOrigin: ""
# Web origin sent to the API for CORS/session cookies (derived from ingress.web.host by default)
webOrigin: ""
