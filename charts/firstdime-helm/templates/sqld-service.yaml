{{- if .Values.sqld.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "firstdime-helm.fullname" . }}-sqld
  labels:
    {{- include "firstdime-helm.labels" (dict "context" $ "name" "sqld" "component" "database") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "firstdime-helm.selectorLabels" (dict "context" $ "name" "sqld") | nindent 4 }}
{{- end }}
