{{- if and .Values.postgres.enabled .Values.postgres.exporter.enabled .Values.monitoring.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PodMonitor") }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "firstdime-helm.postgresHost" . }}-exporter
  labels:
    {{- include "firstdime-helm.labels" (dict "context" $ "name" "postgres-exporter" "component" "metrics") | nindent 4 }}
    {{- with .Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "firstdime-helm.selectorLabels" (dict "context" $ "name" "postgres-exporter") | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.interval }}
{{- end }}
