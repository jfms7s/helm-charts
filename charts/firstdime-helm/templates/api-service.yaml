apiVersion: v1
kind: Service
metadata:
  name: {{ include "firstdime-helm.fullname" . }}-api
  labels:
    {{- include "firstdime-helm.labels" (dict "context" $ "name" "api" "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "firstdime-helm.selectorLabels" (dict "context" $ "name" "api") | nindent 4 }}
