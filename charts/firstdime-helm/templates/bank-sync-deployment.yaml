{{- if .Values.bankSync.enabled }}
{{- include "firstdime-helm.bankSyncValidate" $ }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "firstdime-helm.fullname" . }}-bank-sync
  labels:
    {{- include "firstdime-helm.labels" (dict "context" $ "name" "bank-sync" "component" "bank-sync") | nindent 4 }}
  annotations:
    description: "bank-sync (Enable Banking -> POST /imports, SQLite). MUST run at exactly 1 replica."
spec:
  # HARDCODED: one process per SQLite file, and startup clears the run lease a
  # previous pod left, which would break a second live replica's run.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "firstdime-helm.selectorLabels" (dict "context" $ "name" "bank-sync") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "firstdime-helm.labels" (dict "context" $ "name" "bank-sync" "component" "bank-sync") | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.bankSync.runAsUser }}
        runAsGroup: {{ .Values.bankSync.runAsGroup }}
        fsGroup: {{ .Values.bankSync.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      # bank-sync waits up to 25 s for an in-flight run on SIGTERM before
      # closing its store; keep kubelet's grace above that.
      terminationGracePeriodSeconds: 30
      {{- with .Values.bankSync.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bankSync.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bankSync.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bank-sync
          image: {{ .Values.bankSync.image.repository }}:{{ .Values.bankSync.image.tag }}
          imagePullPolicy: {{ .Values.bankSync.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # No path: bank-sync serves from the root and refuses one.
            - name: BANK_SYNC_PUBLIC_URL
              value: {{ printf "https://%s" .Values.bankSync.host | quote }}
            # This release's api Service (api-service.yaml), in-cluster.
            # BANK_SYNC_FD_* and the old BANK_SYNC_BM_* names carry the same values:
            # images up to v0.17.0 read only BM, later ones read FD. The BM pair
            # goes in a later chart version, once every deployed image reads FD.
            - name: BANK_SYNC_FD_URL
              value: {{ printf "http://%s-api:80" (include "firstdime-helm.fullname" .) | quote }}
            - name: BANK_SYNC_BM_URL
              value: {{ printf "http://%s-api:80" (include "firstdime-helm.fullname" .) | quote }}
            - name: BANK_SYNC_EB_PRIVATE_KEY_FILE
              value: /run/secrets/eb/private.key
            - name: BANK_SYNC_DB_PATH
              value: /app/.data/bank-sync.db
            - name: BANK_SYNC_EB_COUNTRY
              value: {{ .Values.bankSync.country | quote }}
            - name: BANK_SYNC_INTERVAL_HOURS
              value: {{ .Values.bankSync.intervalHours | quote }}
            - name: BANK_SYNC_PORT
              value: "8080"
            - name: BANK_SYNC_METRICS_PORT
              value: "9464"
            {{- with (toString (.Values.bankSync.trustProxy | default "")) }}
            - name: BANK_SYNC_TRUST_PROXY
              value: {{ . | quote }}
            {{- end }}
            - name: LOG_LEVEL
              value: {{ .Values.bankSync.logLevel | quote }}
            - name: TZ
              value: {{ .Values.tz | quote }}
            - name: BANK_SYNC_EB_APP_ID
              {{- include "firstdime-helm.credentialEnv" .Values.bankSync.ebAppId | nindent 14 }}
            - name: BANK_SYNC_FD_TOKEN
              {{- include "firstdime-helm.credentialEnv" .Values.bankSync.fdToken | nindent 14 }}
            # old name, same value (see BANK_SYNC_BM_URL above)
            - name: BANK_SYNC_BM_TOKEN
              {{- include "firstdime-helm.credentialEnv" .Values.bankSync.fdToken | nindent 14 }}
            - name: BANK_SYNC_ADMIN_PASSWORD_HASH
              {{- include "firstdime-helm.credentialEnv" .Values.bankSync.adminPasswordHash | nindent 14 }}
            - name: BANK_SYNC_SESSION_SECRET
              {{- include "firstdime-helm.credentialEnv" .Values.bankSync.sessionSecret | nindent 14 }}
            {{- with .Values.bankSync.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            # In-cluster scraping only: the Ingress never routes it.
            - name: metrics
              containerPort: 9464
          resources:
            {{- toYaml .Values.bankSync.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /app/.data
              {{- with .Values.bankSync.persistence.subPath }}
              subPath: {{ . | quote }}
              {{- end }}
            - name: eb-private-key
              mountPath: /run/secrets/eb
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- toYaml .Values.bankSync.persistence.volume | nindent 10 }}
        # Only the key itself, not the rest of the Secret.
        - name: eb-private-key
          secret:
            secretName: {{ .Values.bankSync.privateKeySecret.name | quote }}
            items:
              - key: {{ .Values.bankSync.privateKeySecret.key | quote }}
                path: private.key
            defaultMode: 256 # 0400: read-only, owner (plus fsGroup) only
        - name: tmp
          emptyDir: {}
{{- end }}
