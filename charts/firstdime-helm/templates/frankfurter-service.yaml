{{- if .Values.frankfurter.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "firstdime-helm.fullname" . }}-frankfurter
  labels:
    {{- include "firstdime-helm.labels" (dict "context" $ "name" "frankfurter" "component" "exchange-rates") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "firstdime-helm.selectorLabels" (dict "context" $ "name" "frankfurter") | nindent 4 }}
{{- end }}
