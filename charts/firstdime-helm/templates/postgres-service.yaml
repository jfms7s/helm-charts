{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "firstdime-helm.postgresHost" . }}
  labels:
    {{- include "firstdime-helm.labels" (dict "context" $ "name" "postgres" "component" "database") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "firstdime-helm.selectorLabels" (dict "context" $ "name" "postgres") | nindent 4 }}
{{- end }}
