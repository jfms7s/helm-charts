apiVersion: v1
kind: Service
metadata:
  name: {{ include "firstdime-helm.fullname" . }}-nats
  labels:
    {{- include "firstdime-helm.labels" (dict "context" $ "name" "nats" "component" "message-bus") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 4222
      targetPort: client
      protocol: TCP
      name: client
    - port: 8222
      targetPort: monitor
      protocol: TCP
      name: monitor
  selector:
    {{- include "firstdime-helm.selectorLabels" (dict "context" $ "name" "nats") | nindent 4 }}
