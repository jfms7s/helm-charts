{{- if .Values.copyJob.enabled }}
{{- include "firstdime-helm.validate" . }}
{{- /*
A plain Job, not an Argo hook, so a sync never re-runs it. No TTL either: Argo would re-create a deleted
Job and copy again. To re-run, delete the Job; set copyJob.enabled: false after the cutover to remove it.
The two mode names keep a mode switch from hitting the Job template's immutability.
*/ -}}
{{- $mode := .Values.copyJob.mode -}}
{{- if not (has $mode (list "copy" "verify")) }}
{{- fail (printf "firstdime-helm: copyJob.mode must be copy or verify (got %v)" $mode) }}
{{- end }}
{{- if and (not .Values.copyJob.sourceUrl) (not .Values.sqld.enabled) }}
{{- fail "firstdime-helm: copyJob.sourceUrl must be set, or sqld.enabled true to copy from this chart's sqld" }}
{{- end }}
{{- if and .Values.copyJob.sourceUrl (not (regexMatch "^(libsql|https?|wss?)://" (toString .Values.copyJob.sourceUrl))) }}
{{- fail (printf "firstdime-helm: copyJob.sourceUrl must start with libsql://, http(s):// or ws(s):// (got %v)" .Values.copyJob.sourceUrl) }}
{{- end }}
{{- if or (not .Values.copyJob.sourceTokenSecret.name) (not .Values.copyJob.sourceTokenSecret.key) }}
{{- fail "firstdime-helm: copyJob.sourceTokenSecret.name and .key must be set (the Secret key holding sqld's auth token)" }}
{{- end }}
{{- if or (not .Values.copyJob.image.repository) (not .Values.copyJob.image.tag) }}
{{- fail "firstdime-helm: copyJob.image.repository and copyJob.image.tag must be set (PR 8's image, ghcr.io/jfms7s/firstdime-migrate-sqlite-to-pg)" }}
{{- end }}
{{- if not (regexMatch "^[1-9][0-9]*$" (toString .Values.copyJob.waitTimeoutSeconds)) }}
{{- fail (printf "firstdime-helm: copyJob.waitTimeoutSeconds must be a whole number, 1 or more (got %v)" .Values.copyJob.waitTimeoutSeconds) }}
{{- end }}
{{- if not .Values.copyJob.command }}
{{- fail "firstdime-helm: copyJob.command must be set (the copy script's command)" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "firstdime-helm.fullname" . }}-copy{{ if eq $mode "verify" }}-verify{{ end }}
  labels:
    {{- include "firstdime-helm.labels" (dict "context" $ "name" "postgres-copy" "component" "migration") | nindent 4 }}
spec:
  # A human reads the report; a second attempt would find the target non-empty.
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.copyJob.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "firstdime-helm.podLabels" (dict "context" $ "name" "postgres-copy" "component" "migration") | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.copyJob.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.copyJob.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.copyJob.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command: [sh, -c]
          # Bounded: past the deadline the init container fails, and so does the Job (backoffLimit 0),
          # before the copy starts.
          args:
            - |
              timeout "$WAIT_TIMEOUT" sh -c 'until pg_isready --dbname="$DATABASE_URL" --timeout=5; do echo "waiting for postgres"; sleep 5; done' || { echo "postgres not ready after ${WAIT_TIMEOUT}s"; exit 1; }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | quote }}
                  key: DATABASE_URL
            - name: WAIT_TIMEOUT
              value: {{ .Values.copyJob.waitTimeoutSeconds | quote }}
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 64Mi
        # sqld restarts in the same sync and the copy script retries only the target, so wait for the
        # source to accept connections too. Only host:port is printed, never the URL's credentials.
        - name: wait-for-source
          image: {{ .Values.copyJob.image.repository }}:{{ .Values.copyJob.image.tag }}
          imagePullPolicy: {{ .Values.copyJob.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - node
            - -e
            - |
              const net = require("net");
              const url = new URL(process.env.COPY_SOURCE_URL);
              const defaults = { "http:": 80, "ws:": 80, "https:": 443, "wss:": 443, "libsql:": 443 };
              const host = url.hostname;
              const port = Number(url.port) || defaults[url.protocol] || 443;
              const timeout = Number(process.env.WAIT_TIMEOUT);
              const deadline = Date.now() + timeout * 1000;
              const attempt = () => {
                const socket = net.connect({ host, port });
                let settled = false;
                const retry = (why) => {
                  if (settled) return;
                  settled = true;
                  socket.destroy();
                  console.log(`source ${host}:${port} not answering (${why})`);
                  if (Date.now() >= deadline) {
                    console.error(`source ${host}:${port} not answering after ${timeout}s`);
                    process.exit(1);
                  }
                  setTimeout(attempt, 2000);
                };
                socket.setTimeout(5000);
                socket.on("connect", () => {
                  settled = true;
                  console.log(`source ${host}:${port} is answering`);
                  socket.destroy();
                  process.exit(0);
                });
                socket.on("timeout", () => retry("timeout"));
                socket.on("error", (err) => retry(err.code || "error"));
              };
              attempt();
          env:
            - name: COPY_SOURCE_URL
              value: {{ include "firstdime-helm.copySourceUrl" . | quote }}
            - name: WAIT_TIMEOUT
              value: {{ .Values.copyJob.waitTimeoutSeconds | quote }}
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
      containers:
        - name: copy
          image: {{ .Values.copyJob.image.repository }}:{{ .Values.copyJob.image.tag }}
          imagePullPolicy: {{ .Values.copyJob.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            {{- toYaml .Values.copyJob.command | nindent 12 }}
          args:
            - --source
            - {{ include "firstdime-helm.copySourceUrl" . | quote }}
            - --source-token-env
            - COPY_SOURCE_TOKEN
            - --target-env
            - DATABASE_URL
            {{- if eq $mode "verify" }}
            - --verify-only
            {{- else }}
            # Applies the Postgres baseline first: the api is at 0 during the copy.
            - --migrate
            {{- end }}
          env:
            - name: NODE_ENV
              value: "production"
            - name: TZ
              value: "UTC"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | quote }}
                  key: DATABASE_URL
            - name: COPY_SOURCE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.copyJob.sourceTokenSecret.name | quote }}
                  key: {{ .Values.copyJob.sourceTokenSecret.key | quote }}
          resources:
            {{- toYaml .Values.copyJob.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
