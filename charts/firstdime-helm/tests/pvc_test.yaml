# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: pvc
templates:
  - templates/pvc.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: names the default claim <release> when the release already says firstdime
    release:
      name: firstdime
    set:
      sqld.persistence.claim: {storageClassName: synology-iscsi, size: 2Gi}
    asserts:
      - equal:
          path: metadata.name
          value: firstdime-sqld-data

  - it: renders no claims by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the sqld claim with class, size and keep annotations
    set:
      sqld.persistence.claim:
        storageClassName: synology-iscsi
        size: 2Gi
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: RELEASE-NAME-firstdime-sqld-data
      - equal:
          path: spec.storageClassName
          value: synology-iscsi
      - equal:
          path: spec.resources.requests.storage
          value: 2Gi
      - equal:
          path: spec.accessModes
          value: [ReadWriteOnce]
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: Prune=false,Delete=false

  - it: renders both claims when both are configured
    set:
      sqld.persistence.claim: {storageClassName: synology-iscsi, size: 2Gi}
      nats.persistence.claim: {storageClassName: synology-iscsi, size: 1Gi}
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-firstdime-nats-data
        documentIndex: 1

  - it: refuses a claim with a class but no size
    set:
      nats.persistence.claim: {storageClassName: synology-iscsi}
    asserts:
      - failedTemplate:
          errorPattern: "nats.persistence.claim.size is required"

  - it: renders the frankfurter claim when configured
    set:
      frankfurter.persistence.claim: {storageClassName: synology-iscsi, size: 2Gi}
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-firstdime-frankfurter-data
      - equal:
          path: spec.resources.requests.storage
          value: 2Gi

  - it: names the claim from claim.name when set (moving to another storage class)
    set:
      frankfurter.persistence.claim:
        name: frankfurter-local
        storageClassName: local-path
        size: 5Gi
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: frankfurter-local
      - equal:
          path: spec.storageClassName
          value: local-path
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: renders no bank-sync claim while bank-sync is disabled
    set:
      bankSync.persistence.claim: {storageClassName: synology-iscsi, size: 1Gi}
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the bank-sync claim as bank-sync, not bankSync
    set:
      bankSync.enabled: true
      bankSync.persistence.claim: {storageClassName: synology-iscsi, size: 1Gi}
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-firstdime-bank-sync-data
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: bank-sync
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
