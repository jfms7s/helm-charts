# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: api-deployment
templates:
  - templates/api-deployment.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: uses the release name as the base name when it already says firstdime
    release:
      name: firstdime
    asserts:
      - equal:
          path: metadata.name
          value: firstdime-api
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: firstdime
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NATS_URL
            value: "nats://firstdime-nats:4222"

  - it: renders with chart defaults
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-firstdime-api
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/jfms7s/firstdime-api:v0.18.0
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 3000
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: fails when the renamed bankSync.bmToken is still set, even with bankSync off
    set:
      bankSync.bmToken: {value: old-pat}
    asserts:
      - failedTemplate:
          errorPattern: "bankSync.bmToken was renamed to bankSync.fdToken \\(0.8.0\\)"

  - it: fails when sessionCookieSecret is unset
    set:
      sessionCookieSecret.value: ""
    asserts:
      - failedTemplate:
          errorPattern: "sessionCookieSecret must be set"

  - it: fails when appEncryptionKey is unset
    set:
      appEncryptionKey.value: ""
    asserts:
      - failedTemplate:
          errorPattern: "appEncryptionKey must be set"

  - it: reads DATABASE_URL from the postgres.existingSecret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: firstdime-postgres
                key: DATABASE_URL

  - it: reads DATABASE_URL from the Secret when the in-chart Postgres is disabled
    set:
      postgres.enabled: false
      postgres.existingSecret: external-db
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: external-db
                key: DATABASE_URL

  - it: sets none of the libSQL variables the app refuses
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TURSO_SYNC_URL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TURSO_AUTH_TOKEN
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOCAL_DB_PATH
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PRIMARY_DIRECT
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_EMBEDDED_REPLICA
          any: true

  - it: fails when postgres.existingSecret is empty
    set:
      postgres.existingSecret: ""
    asserts:
      - failedTemplate:
          errorPattern: "postgres.existingSecret must name a Secret with keys POSTGRES_PASSWORD and DATABASE_URL"

  - it: fails when a removed database key is passed
    set:
      database.url: x
    asserts:
      - failedTemplate:
          errorPattern: "database.url and database.authToken were removed in 0.10.0: api and worker read DATABASE_URL from postgres.existingSecret"

  - it: uses valueFrom for credentials when set
    set:
      sessionCookieSecret.valueFrom.secretKeyRef.name: firstdime-secrets
      sessionCookieSecret.valueFrom.secretKeyRef.key: session-cookie-secret
      appEncryptionKey.valueFrom.secretKeyRef.name: firstdime-secrets
      appEncryptionKey.valueFrom.secretKeyRef.key: app-encryption-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SESSION_COOKIE_SECRET
            valueFrom:
              secretKeyRef:
                name: firstdime-secrets
                key: session-cookie-secret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: firstdime-secrets
                key: app-encryption-key

  - it: sets PORT to 3000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PORT
            value: "3000"

  - it: sets NODE_ENV to production
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_ENV
            value: "production"

  - it: sets NATS_URL with release name
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NATS_URL
            value: "nats://RELEASE-NAME-firstdime-nats:4222"

  - it: sets ATTACHMENTS_DIR
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ATTACHMENTS_DIR
            value: "/data/attachments"

  - it: sets REGISTRATION_ENABLED from values
    set:
      registrationEnabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REGISTRATION_ENABLED
            value: "false"

  - it: sets WEB_ORIGIN from ingress.web.host
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEB_ORIGIN
            value: "https://budget.example.com"

  - it: uses a webOrigin override as-is (no second scheme)
    set:
      webOrigin: https://custom.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEB_ORIGIN
            value: "https://custom.example.com"

  - it: rejects a webOrigin override that is not an origin
    set:
      webOrigin: custom.example.com
    asserts:
      - failedTemplate:
          errorPattern: "webOrigin must be a valid origin"

  - it: sets EMAIL_CONFIGURED when SMTP URL is configured
    set:
      smtp:
        url:
          value: "smtp://user:pass@smtp.example.com:587"
      smtp.from.value: budget@example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMAIL_CONFIGURED
            value: "true"

  - it: does not set EMAIL_CONFIGURED when SMTP is empty
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMAIL_CONFIGURED

  - it: mounts attachments volume at /data/attachments
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: attachments
            mountPath: /data/attachments

  - it: mounts tmp emptyDir at /tmp
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp

  - it: uses attachments volume with raw body when set
    set:
      attachments:
        volume:
          nfs:
            server: 192.168.1.10
            path: /volume1/k8s/volumes/firstdime/attachments
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].nfs.server
          value: 192.168.1.10

  - it: includes imagePullSecrets when configured
    set:
      imagePullSecrets:
        - name: my-registry-secret
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: my-registry-secret

  - it: includes startupProbe with 30 failures allowed
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /health

  - it: respects custom resource limits
    set:
      api:
        resources:
          requests:
            memory: 200Mi
          limits:
            memory: 512Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 200Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi

  - it: trusts no proxy by default (no TRUST_PROXY)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRUST_PROXY
          any: true

  - it: passes trustProxy to the api as TRUST_PROXY
    set:
      trustProxy: 10.42.0.0/16
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRUST_PROXY
            value: "10.42.0.0/16"
