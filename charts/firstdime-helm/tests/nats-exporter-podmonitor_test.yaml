# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: nats-exporter-podmonitor
templates:
  - templates/nats-exporter-podmonitor.yaml
values:
  - ../ci/test-values.yaml
chart:
  version: 0.0.0-test
tests:
  - it: renders nothing by default
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1/PodMonitor
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing with only nats.exporter.enabled on
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1/PodMonitor
    set:
      nats.exporter.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing with only monitoring on
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1/PodMonitor
    set:
      monitoring.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a PodMonitor for the nats-exporter pod when both switches are on
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1/PodMonitor
    set:
      nats.exporter.enabled: true
      monitoring.enabled: true
    release:
      namespace: firstdime
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodMonitor
      - isAPIVersion:
          of: monitoring.coreos.com/v1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-firstdime-nats-exporter
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: metrics
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: nats-exporter
            app.kubernetes.io/instance: RELEASE-NAME
      - equal:
          path: spec.namespaceSelector.matchNames
          value: [firstdime]
      - equal:
          path: spec.podMetricsEndpoints
          value:
            - port: metrics
              path: /metrics
              interval: 30s

  - it: adds monitoring.labels and monitoring.interval, keeping the chart's own labels
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1/PodMonitor
    set:
      nats.exporter.enabled: true
      monitoring.enabled: true
      monitoring.interval: 60s
      monitoring.labels:
        app.kubernetes.io/name: other
        release: kube-prometheus-stack
    asserts:
      - equal:
          path: metadata.labels.release
          value: kube-prometheus-stack
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: nats-exporter
      - equal:
          path: spec.podMetricsEndpoints[0].interval
          value: 60s

  - it: renders nothing when the cluster has no PodMonitor CRD
    set:
      nats.exporter.enabled: true
      monitoring.enabled: true
    asserts:
      - hasDocuments:
          count: 0
