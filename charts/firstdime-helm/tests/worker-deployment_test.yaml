# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: worker-deployment
templates:
  - templates/worker-deployment.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: renders with chart defaults
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-firstdime-worker

  - it: is hardcoded to 1 replica regardless of values
    set:
      worker:
        replicas: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: uses Recreate strategy (hardcoded)
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: runs as numeric non-root user 1000 with fsGroup
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000

  - it: fails when appEncryptionKey is unset
    set:
      appEncryptionKey.value: ""
    asserts:
      - failedTemplate:
          errorPattern: "appEncryptionKey must be set"

  - it: fails without a shared attachments volume
    set:
      attachments.volume: null
    asserts:
      - failedTemplate:
          errorPattern: "attachments.volume must be a volume shared by the api and the worker"

  - it: fails when an SMTP URL is set without smtp.from
    set:
      smtp.url.value: smtp://user:pass@mail.example:587
    asserts:
      - failedTemplate:
          errorPattern: "smtp.from must be set when smtp.url is configured"

  - it: uses valueFrom for credentials when set
    set:
      appEncryptionKey.valueFrom.secretKeyRef.name: firstdime-secrets
      appEncryptionKey.valueFrom.secretKeyRef.key: app-encryption-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: firstdime-secrets
                key: app-encryption-key

  - it: reads DATABASE_URL from the postgres.existingSecret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: firstdime-postgres
                key: DATABASE_URL

  - it: reads DATABASE_URL from the Secret when the in-chart Postgres is disabled
    set:
      postgres.enabled: false
      postgres.existingSecret: external-db
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: external-db
                key: DATABASE_URL

  - it: sets none of the libSQL variables the app refuses
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TURSO_SYNC_URL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TURSO_AUTH_TOKEN
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOCAL_DB_PATH
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PRIMARY_DIRECT
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_EMBEDDED_REPLICA
          any: true

  - it: fails when postgres.existingSecret is empty
    set:
      postgres.existingSecret: ""
    asserts:
      - failedTemplate:
          errorPattern: "postgres.existingSecret must name a Secret with keys POSTGRES_PASSWORD and DATABASE_URL"

  - it: fails when a removed database key is passed
    set:
      database.url: x
    asserts:
      - failedTemplate:
          errorPattern: "database.url and database.authToken were removed in 0.10.0: api and worker read DATABASE_URL from postgres.existingSecret"

  - it: runs the scheduled jobs and outbound runner by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WORKER_JOBS_ENABLED
            value: "true"

  - it: worker.jobsEnabled false renders WORKER_JOBS_ENABLED "false"
    set:
      worker.jobsEnabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WORKER_JOBS_ENABLED
            value: "false"

  - it: fails when worker.jobsEnabled is the string "false"
    set:
      worker.jobsEnabled: "false"
    asserts:
      - failedTemplate:
          errorPattern: "worker.jobsEnabled must be true or false \\(got false\\)"

  - it: fails when worker.jobsEnabled is "yes"
    set:
      worker.jobsEnabled: "yes"
    asserts:
      - failedTemplate:
          errorPattern: "worker.jobsEnabled must be true or false \\(got yes\\)"

  - it: fails when worker.jobsEnabled is null
    set:
      worker.jobsEnabled: null
    asserts:
      - failedTemplate:
          errorPattern: "worker.jobsEnabled must be true or false"

  - it: sets NODE_ENV to production
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_ENV
            value: "production"

  - it: sets NATS_URL with release name
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NATS_URL
            value: "nats://RELEASE-NAME-firstdime-nats:4222"

  - it: sets ATTACHMENTS_DIR
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ATTACHMENTS_DIR
            value: "/data/attachments"

  - it: sets WEBHOOK_ALLOW_PRIVATE_NETWORKS
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEBHOOK_ALLOW_PRIVATE_NETWORKS
            value: "false"

  - it: sets LOG_LEVEL
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
            value: "info"

  - it: sets WEB_ORIGIN from ingress.web.host
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEB_ORIGIN
            value: "https://budget.example.com"

  - it: includes SMTP_URL and SMTP_FROM when configured
    set:
      smtp:
        url:
          value: "smtp://user:pass@smtp.example.com:587"
        from:
          value: "noreply@example.com"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_URL
            value: "smtp://user:pass@smtp.example.com:587"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_FROM
            value: "noreply@example.com"

  - it: mounts attachments volume at /data/attachments
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: attachments
            mountPath: /data/attachments

  - it: mounts tmp emptyDir at /tmp
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp

  - it: gives slow first migrations a startupProbe budget before liveness applies
    asserts:
      - isNotNull:
          path: spec.template.spec.containers[0].startupProbe.exec
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 10
      - isNotNull:
          path: spec.template.spec.containers[0].livenessProbe.exec
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 0

  - it: includes imagePullSecrets when configured
    set:
      imagePullSecrets:
        - name: my-registry-secret
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: my-registry-secret

  - it: respects custom resource limits
    set:
      worker:
        resources:
          requests:
            memory: 200Mi
          limits:
            memory: 512Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 200Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi

  - it: sets FRANKFURTER_URL to the in-chart service when frankfurter is enabled
    set:
      frankfurter:
        enabled: true
        persistence:
          volume:
            persistentVolumeClaim:
              claimName: frankfurter-data
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FRANKFURTER_URL
            value: "http://RELEASE-NAME-firstdime-frankfurter:8080"

  - it: leaves FRANKFURTER_URL unset by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: FRANKFURTER_URL
