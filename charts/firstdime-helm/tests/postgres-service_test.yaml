# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: postgres-service
templates:
  - templates/postgres-service.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: renders with CI values
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-firstdime-postgres
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 5432
      - equal:
          path: spec.ports[0].name
          value: postgres
      - equal:
          path: spec.ports[0].targetPort
          value: postgres
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: postgres
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: database

  - it: is named <release>-postgres when the release already says firstdime
    release:
      name: firstdime
    asserts:
      - equal:
          path: metadata.name
          value: firstdime-postgres

  - it: renders nothing when postgres.enabled is false
    set:
      postgres.enabled: false
    asserts:
      - hasDocuments:
          count: 0
