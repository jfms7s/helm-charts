{{- if .Values.frankfurter.enabled }}
{{- if not .Values.frankfurter.persistence.volume -}}
  {{- fail "budget-manager-helm: frankfurter.persistence.volume must be persistent storage (its SQLite database lives there)" -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-budget-manager-frankfurter
  labels:
    {{- include "budget-manager-helm.labels" (dict "context" $ "name" "frankfurter" "component" "exchange-rates") | nindent 4 }}
  annotations:
    description: "Frankfurter exchange-rate API (SQLite). MUST run at exactly 1 replica."
spec:
  # HARDCODED: one process per SQLite file.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "budget-manager-helm.selectorLabels" (dict "context" $ "name" "frankfurter") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "budget-manager-helm.labels" (dict "context" $ "name" "frankfurter" "component" "exchange-rates") | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.frankfurter.runAsUser }}
        runAsGroup: {{ .Values.frankfurter.runAsGroup }}
        fsGroup: {{ .Values.frankfurter.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      {{- with .Values.frankfurter.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frankfurter.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frankfurter.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frankfurter
          image: {{ .Values.frankfurter.image.repository }}:{{ .Values.frankfurter.image.tag }}
          imagePullPolicy: {{ .Values.frankfurter.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # The image's default database is /app/db/frankfurter_production.sqlite3,
            # inside the image next to its migrations; move it onto the volume.
            - name: DATABASE_URL
              value: "sqlite:///app/data/frankfurter.sqlite3"
            - name: WORKER_PROCESSES
              value: {{ .Values.frankfurter.workerProcesses | quote }}
            - name: PORT
              value: "8080"
            {{- with .Values.frankfurter.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml .Values.frankfurter.resources | nindent 12 }}
          # First start runs db:setup and boots the scheduler; slow on small nodes.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /app/data
              {{- with .Values.frankfurter.persistence.subPath }}
              subPath: {{ . | quote }}
              {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- toYaml .Values.frankfurter.persistence.volume | nindent 10 }}
        - name: tmp
          emptyDir: {}
{{- end }}
