{{- if .Values.sqld.enabled }}
{{- if not .Values.sqld.persistence.volume -}}
  {{- fail "budget-manager-helm: sqld.persistence.volume must be persistent storage (the database lives there)" -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-budget-manager-sqld
  labels:
    {{- include "budget-manager-helm.labels" (dict "context" $ "name" "sqld" "component" "database") | nindent 4 }}
  annotations:
    description: "LibSQL (Turso) database server. MUST run at exactly 1 replica."
spec:
  # HARDCODED: Single replica (never two sqld processes on one SQLite file — corruption risk)
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "budget-manager-helm.selectorLabels" (dict "context" $ "name" "sqld") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "budget-manager-helm.labels" (dict "context" $ "name" "sqld" "component" "database") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.sqld.runAsUser }}
        runAsGroup: {{ .Values.sqld.runAsGroup }}
        fsGroup: {{ .Values.sqld.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: sqld
          image: {{ .Values.sqld.image.repository }}:{{ .Values.sqld.image.tag }}
          imagePullPolicy: {{ .Values.sqld.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sqld
          args:
            - --db-path
            - /var/lib/sqld/data.sqld
            - --http-listen-addr
            - "0.0.0.0:8080"
            {{- with .Values.sqld.checkpointIntervalSeconds }}
            # Time-based checkpoints only: sqld then sets wal_autocheckpoint=0, so
            # commits stop checkpointing (see values.yaml).
            - --checkpoint-interval-s
            - {{ . | quote }}
            {{- end }}
            {{- with .Values.sqld.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.sqld.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml .Values.sqld.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            {{- if .Values.sqld.writeProbe.enabled }}
            # Write probe: BEGIN IMMEDIATE; ROLLBACK through sqld's own HTTP API.
            # A TCP check passes while sqld's write lock is wedged (reads keep
            # working), so only a write tells. The image has bash but no curl,
            # hence /dev/tcp. One pipeline request carries both statements, so
            # sqld finishes the ROLLBACK even if the probe gives up first.
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  body='{"requests":[{"type":"execute","stmt":{"sql":"BEGIN IMMEDIATE"}},{"type":"execute","stmt":{"sql":"ROLLBACK"}},{"type":"close"}]}'
                  exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1
                  printf 'POST /v2/pipeline HTTP/1.1\r\nHost: 127.0.0.1\r\nContent-Type: application/json\r\nContent-Length: %d\r\nConnection: close\r\n\r\n%s' "${#body}" "$body" >&3
                  # Read to EOF (Connection: close); a status over 128 is the timeout.
                  IFS= read -r -d '' -t {{ .Values.sqld.writeProbe.timeoutSeconds }} resp <&3
                  (( $? > 128 )) && { echo "sqld write probe: no answer within {{ .Values.sqld.writeProbe.timeoutSeconds }}s"; exit 1; }
                  [[ $resp == "HTTP/1.1 200"* && $resp != *'"type":"error"'* && $resp == *'"type":"close"'* ]] || { echo "sqld write probe failed: ${resp:0:300}"; exit 1; }
            initialDelaySeconds: {{ .Values.sqld.writeProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.sqld.writeProbe.periodSeconds }}
            # One second over the script's own read timeout, so the script
            # decides and kubelet's timeout is only the backstop.
            timeoutSeconds: {{ add1 .Values.sqld.writeProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.sqld.writeProbe.failureThreshold }}
            {{- else }}
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 2
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/sqld
              {{- with .Values.sqld.persistence.subPath }}
              subPath: {{ . | quote }}
              {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- toYaml .Values.sqld.persistence.volume | nindent 10 }}
        - name: tmp
          emptyDir: {}
{{- end }}
