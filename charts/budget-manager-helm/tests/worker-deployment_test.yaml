# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: worker-deployment
values:
  - ../ci/test-values.yaml
templates:
  - templates/worker-deployment.yaml
tests:
  - it: renders with chart defaults (ci values)
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-budget-manager-worker
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: is hardcoded to 1 replica even when overridden
    set:
      worker.replicas: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: runs as numeric non-root user 1000
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000

  - it: includes startupProbe with heartbeat check
    asserts:
      - isNotNull:
          path: spec.template.spec.containers[0].startupProbe
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30
