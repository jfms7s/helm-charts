# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: bank-sync-service
templates:
  - templates/bank-sync-service.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: does not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: exposes the admin page on 80 and metrics on 9464
    values:
      - ../ci/bank-sync-values.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-budget-manager-bank-sync
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports
          value:
            - {port: 80, targetPort: http, protocol: TCP, name: http}
            - {port: 9464, targetPort: metrics, protocol: TCP, name: metrics}
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: bank-sync
