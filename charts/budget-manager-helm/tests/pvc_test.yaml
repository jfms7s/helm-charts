# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: pvc
templates:
  - templates/pvc.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: renders no claims by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the sqld claim with class, size and keep annotations
    set:
      sqld.persistence.claim:
        storageClassName: synology-iscsi
        size: 2Gi
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: RELEASE-NAME-budget-manager-sqld-data
      - equal:
          path: spec.storageClassName
          value: synology-iscsi
      - equal:
          path: spec.resources.requests.storage
          value: 2Gi
      - equal:
          path: spec.accessModes
          value: [ReadWriteOnce]
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: Prune=false,Delete=false

  - it: renders both claims when both are configured
    set:
      sqld.persistence.claim: {storageClassName: synology-iscsi, size: 2Gi}
      nats.persistence.claim: {storageClassName: synology-iscsi, size: 1Gi}
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-budget-manager-nats-data
        documentIndex: 1

  - it: refuses a claim with a class but no size
    set:
      nats.persistence.claim: {storageClassName: synology-iscsi}
    asserts:
      - failedTemplate:
          errorPattern: "nats.persistence.claim.size is required"

  - it: renders the frankfurter claim when configured
    set:
      frankfurter.persistence.claim: {storageClassName: synology-iscsi, size: 2Gi}
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-budget-manager-frankfurter-data
      - equal:
          path: spec.resources.requests.storage
          value: 2Gi
