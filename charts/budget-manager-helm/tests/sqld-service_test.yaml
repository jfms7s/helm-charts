# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: sqld-service
templates:
  - templates/sqld-service.yaml
tests:
  - it: renders with chart defaults when enabled
    set:
      sqld:
        enabled: true
        persistence:
          volume:
            persistentVolumeClaim:
              claimName: sqld-data
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-budget-manager-sqld
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.ports[0].targetPort
          value: http
      - equal:
          path: spec.ports[0].name
          value: http
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: sqld

  - it: does not render when disabled
    set:
      sqld:
        enabled: false
    asserts:
      - isNull:
          path: kind
