# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: nats-service
templates:
  - templates/nats-service.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: renders with chart defaults
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-budget-manager-nats
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 4222
      - equal:
          path: spec.ports[0].name
          value: client
      - equal:
          path: spec.ports[1].port
          value: 8222
      - equal:
          path: spec.ports[1].name
          value: monitor
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: nats
