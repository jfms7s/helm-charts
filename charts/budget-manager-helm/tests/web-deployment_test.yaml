# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: web-deployment
values:
  - ../ci/test-values.yaml
templates:
  - templates/web-deployment.yaml
tests:
  - it: renders with chart defaults (ci values)
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-budget-manager-web

  - it: runs as numeric non-root user 101 (nginx-unprivileged)
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 101

  - it: uses custom apiOrigin when set correctly
    set:
      apiOrigin: "https://custom-api.example.com"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_ORIGIN
            value: "https://custom-api.example.com"
