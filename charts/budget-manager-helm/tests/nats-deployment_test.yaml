# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: nats-deployment
values:
  - ../ci/test-values.yaml
templates:
  - templates/nats-deployment.yaml
tests:
  - it: renders with chart defaults (ci values)
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-budget-manager-nats
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: uses correct pinned image
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: nats:2.15.0-alpine

  - it: runs as numeric non-root user 1000 with fsGroup
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000

  - it: has read-only root filesystem with /tmp mount
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp

  - it: starts with JetStream and monitor enabled
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: -js
      - contains:
          path: spec.template.spec.containers[0].args
          content: /data
      - contains:
          path: spec.template.spec.containers[0].args
          content: "8222"

  - it: exposes ports 4222 and 8222
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: client
            containerPort: 4222
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: monitor
            containerPort: 8222
