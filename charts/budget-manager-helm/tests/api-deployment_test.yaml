# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: api-deployment
templates:
  - templates/api-deployment.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: renders with chart defaults
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-budget-manager-api
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/jfms7s/budget-manager-api:v0.1.0
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 3000
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: fails when database.authToken is unset
    set:
      database.authToken.value: ""
    asserts:
      - failedTemplate:
          errorPattern: "database.authToken must be set \\(value or valueFrom\\)"

  - it: fails when database.authToken is still CHANGE_ME
    set:
      database.authToken.value: CHANGE_ME
    asserts:
      - failedTemplate:
          errorPattern: "database.authToken must be set"

  - it: fails when sessionCookieSecret is unset
    set:
      sessionCookieSecret.value: ""
    asserts:
      - failedTemplate:
          errorPattern: "sessionCookieSecret must be set"

  - it: fails when appEncryptionKey is unset
    set:
      appEncryptionKey.value: ""
    asserts:
      - failedTemplate:
          errorPattern: "appEncryptionKey must be set"

  - it: fails when database.url is empty and the in-chart sqld is disabled
    set:
      sqld.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "database.url must be set"

  - it: derives database.url from the in-chart sqld
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TURSO_SYNC_URL
            value: "http://RELEASE-NAME-budget-manager-sqld:8080"

  - it: an explicit database.url wins over the derived one
    set:
      database.url: http://external-db:8080
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TURSO_SYNC_URL
            value: "http://external-db:8080"

  - it: uses valueFrom for credentials when set
    set:
      database.authToken.valueFrom.secretKeyRef.name: budget-manager-secrets
      database.authToken.valueFrom.secretKeyRef.key: db-auth-token
      sessionCookieSecret.valueFrom.secretKeyRef.name: budget-manager-secrets
      sessionCookieSecret.valueFrom.secretKeyRef.key: session-cookie-secret
      appEncryptionKey.valueFrom.secretKeyRef.name: budget-manager-secrets
      appEncryptionKey.valueFrom.secretKeyRef.key: app-encryption-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TURSO_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: budget-manager-secrets
                key: db-auth-token
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SESSION_COOKIE_SECRET
            valueFrom:
              secretKeyRef:
                name: budget-manager-secrets
                key: session-cookie-secret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: budget-manager-secrets
                key: app-encryption-key

  - it: sets PORT to 3000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PORT
            value: "3000"

  - it: sets NODE_ENV to production
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_ENV
            value: "production"

  - it: sets NATS_URL with release name
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NATS_URL
            value: "nats://RELEASE-NAME-budget-manager-nats:4222"

  - it: sets ATTACHMENTS_DIR
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ATTACHMENTS_DIR
            value: "/data/attachments"

  - it: sets REGISTRATION_ENABLED from values
    set:
      registrationEnabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REGISTRATION_ENABLED
            value: "false"

  - it: sets WEB_ORIGIN from ingress.web.host
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEB_ORIGIN
            value: "https://budget.example.com"

  - it: uses a webOrigin override as-is (no second scheme)
    set:
      webOrigin: https://custom.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEB_ORIGIN
            value: "https://custom.example.com"

  - it: rejects a webOrigin override that is not an origin
    set:
      webOrigin: custom.example.com
    asserts:
      - failedTemplate:
          errorPattern: "webOrigin must be a valid origin"

  - it: sets EMAIL_CONFIGURED when SMTP URL is configured
    set:
      smtp:
        url:
          value: "smtp://user:pass@smtp.example.com:587"
      smtp.from.value: budget@example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMAIL_CONFIGURED
            value: "true"

  - it: does not set EMAIL_CONFIGURED when SMTP is empty
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMAIL_CONFIGURED

  - it: mounts attachments volume at /data/attachments
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: attachments
            mountPath: /data/attachments

  - it: mounts tmp emptyDir at /tmp
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp

  - it: uses attachments volume with raw body when set
    set:
      attachments:
        volume:
          nfs:
            server: 192.168.1.10
            path: /volume1/k8s/volumes/budget-manager/attachments
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].nfs.server
          value: 192.168.1.10

  - it: includes imagePullSecrets when configured
    set:
      imagePullSecrets:
        - name: my-registry-secret
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: my-registry-secret

  - it: includes startupProbe with 30 failures allowed
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /health

  - it: respects custom resource limits
    set:
      api:
        resources:
          requests:
            memory: 200Mi
          limits:
            memory: 512Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 200Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi

  - it: trusts no proxy by default (no TRUST_PROXY)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRUST_PROXY
          any: true

  - it: passes trustProxy to the api as TRUST_PROXY
    set:
      trustProxy: 10.42.0.0/16
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRUST_PROXY
            value: "10.42.0.0/16"
