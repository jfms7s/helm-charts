# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: api-deployment
values:
  - ../ci/test-values.yaml
templates:
  - templates/api-deployment.yaml
tests:
  - it: renders with chart defaults (ci values)
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-budget-manager-api
      - equal:
          path: spec.replicas
          value: 1

  - it: uses valueFrom for credentials when set
    set:
      database.authToken.valueFrom.secretKeyRef.name: budget-manager-secrets
      database.authToken.valueFrom.secretKeyRef.key: db-auth-token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TURSO_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: budget-manager-secrets
                key: db-auth-token
