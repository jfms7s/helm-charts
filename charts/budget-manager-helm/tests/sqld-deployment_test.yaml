# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: sqld-deployment
values:
  - ../ci/test-values.yaml
templates:
  - templates/sqld-deployment.yaml
tests:
  - it: renders with chart defaults when enabled (ci values)
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-budget-manager-sqld
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: does not render when disabled
    set:
      sqld.enabled: false
    asserts:
      - isNull:
          path: kind

  - it: uses correct pinned image
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/tursodatabase/libsql-server:v0.24.33

  - it: runs as numeric non-root user 1000 with fsGroup
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000

  - it: has read-only root filesystem with /tmp mount
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp

  - it: starts with correct command and args
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command[0]
          value: /bin/sqld
      - contains:
          path: spec.template.spec.containers[0].args
          content: --db-path
