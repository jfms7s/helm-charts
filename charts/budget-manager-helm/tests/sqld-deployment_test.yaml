# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: sqld-deployment
templates:
  - templates/sqld-deployment.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: renders with chart defaults when enabled
    set:
      sqld:
        enabled: true
        persistence:
          volume:
            persistentVolumeClaim:
              claimName: sqld-data
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-budget-manager-sqld
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: does not render when disabled
    set:
      sqld:
        enabled: false
    asserts:
      - isNull:
          path: kind

  - it: runs as numeric non-root user 1000 with fsGroup
    set:
      sqld:
        enabled: true
        persistence:
          volume:
            persistentVolumeClaim:
              claimName: sqld-data
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000

  - it: uses correct pinned image
    set:
      sqld:
        enabled: true
        persistence:
          volume:
            persistentVolumeClaim:
              claimName: sqld-data
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/tursodatabase/libsql-server:v0.24.33

  - it: starts with correct command and args
    set:
      sqld:
        enabled: true
        persistence:
          volume:
            persistentVolumeClaim:
              claimName: sqld-data
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command[0]
          value: /bin/sqld
      - contains:
          path: spec.template.spec.containers[0].args
          content: --db-path
      - contains:
          path: spec.template.spec.containers[0].args
          content: /var/lib/sqld/data.sqld
      - contains:
          path: spec.template.spec.containers[0].args
          content: --http-listen-addr
      - contains:
          path: spec.template.spec.containers[0].args
          content: "0.0.0.0:8080"

  - it: has read-only root filesystem
    set:
      sqld:
        enabled: true
        persistence:
          volume:
            persistentVolumeClaim:
              claimName: sqld-data
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: mounts data and tmp volumes
    set:
      sqld:
        enabled: true
        persistence:
          volume:
            persistentVolumeClaim:
              claimName: sqld-data
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /var/lib/sqld
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp

  - it: fails when persistence.volume is empty
    set:
      sqld.persistence.volume: null
    asserts:
      - failedTemplate:
          errorPattern: "sqld.persistence.volume must be persistent storage"

  - it: respects custom resource limits
    set:
      sqld:
        enabled: true
        persistence:
          volume:
            persistentVolumeClaim:
              claimName: sqld-data
        resources:
          requests:
            memory: 200Mi
          limits:
            memory: 512Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 200Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi

  - it: mounts the data volume at a subPath when persistence.subPath is set
    set:
      sqld:
        enabled: true
        persistence:
          subPath: data
          volume:
            persistentVolumeClaim:
              claimName: sqld-data
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /var/lib/sqld
            subPath: data

  - it: mounts the data volume without a subPath by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /var/lib/sqld

  - it: keeps a TCP liveness probe and sqld's default checkpointing by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: http
      - isNull:
          path: spec.template.spec.containers[0].livenessProbe.exec
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --checkpoint-interval-s
      - isNull:
          path: spec.template.spec.containers[0].env

  - it: replaces the TCP liveness probe with a write probe when writeProbe.enabled
    set:
      sqld.writeProbe.enabled: true
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command[0]
          value: /bin/bash
      - matchRegex:
          path: spec.template.spec.containers[0].livenessProbe.exec.command[2]
          pattern: 'BEGIN IMMEDIATE.*ROLLBACK'
      - matchRegex:
          path: spec.template.spec.containers[0].livenessProbe.exec.command[2]
          pattern: '/dev/tcp/127\.0\.0\.1/8080'
      - matchRegex:
          path: spec.template.spec.containers[0].livenessProbe.exec.command[2]
          pattern: "read -r -d '' -t 10 resp"
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 11
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 3
      # Readiness stays a TCP check: a stuck write lock is liveness' job.
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: http

  - it: passes the write probe's timeout to the script and kubelet
    set:
      sqld.writeProbe:
        enabled: true
        timeoutSeconds: 4
        periodSeconds: 15
        failureThreshold: 5
        initialDelaySeconds: 60
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].livenessProbe.exec.command[2]
          pattern: "read -r -d '' -t 4 resp"
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 15
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 5
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 60

  - it: passes checkpointIntervalSeconds as --checkpoint-interval-s
    set:
      sqld.checkpointIntervalSeconds: 60
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --db-path
            - /var/lib/sqld/data.sqld
            - --http-listen-addr
            - "0.0.0.0:8080"
            - --checkpoint-interval-s
            - "60"

  - it: appends extraArgs and renders extraEnv
    set:
      sqld:
        extraArgs:
          - --max-log-duration
          - "3600"
        extraEnv:
          - name: RUST_LOG
            value: info
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args[4]
          value: --max-log-duration
      - equal:
          path: spec.template.spec.containers[0].args[5]
          value: "3600"
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: RUST_LOG
              value: info
