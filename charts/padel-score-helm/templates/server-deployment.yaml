apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-padel-score-server
  labels:
    {{- include "padel-score-helm.labels" (dict "context" $ "name" "server" "component" "server") | nindent 4 }}
spec:
  # One replica only: SQLite allows a single writer, so a second pod (or an
  # overlapping rollout) sharing the volume would corrupt it.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "padel-score-helm.selectorLabels" (dict "context" $ "name" "server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "padel-score-helm.labels" (dict "context" $ "name" "server" "component" "server") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: padel-score-server
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DATA_DIR
              value: /data
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: {{ .Values.server.logLevel | quote }}
            {{- range .Values.server.extraEnv }}
            - name: {{ .name }}
              {{- if .valueFrom }}
              valueFrom: {{- toYaml .valueFrom | nindent 16 }}
              {{- else }}
              value: {{ .value | quote }}
              {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
              {{- with .Values.server.persistence.subPath }}
              subPath: {{ . }}
              {{- end }}
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      restartPolicy: Always
      volumes:
        - name: data
          {{- if .Values.server.persistence.volume }}
          {{- toYaml .Values.server.persistence.volume | nindent 10 }}
          {{- else if .Values.server.persistence.ephemeral }}
          emptyDir: {}
          {{- else }}
          {{- fail "padel-score-helm: set server.persistence.volume (or claim.size and point volume at it), or server.persistence.ephemeral=true to accept data loss" }}
          {{- end }}
        - name: tmp
          emptyDir: {}
