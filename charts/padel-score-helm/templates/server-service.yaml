apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-padel-score-server
  labels:
    {{- include "padel-score-helm.labels" (dict "context" $ "name" "server" "component" "server") | nindent 4 }}
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    {{- include "padel-score-helm.selectorLabels" (dict "context" $ "name" "server") | nindent 4 }}
