# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: pvc
templates:
  - templates/pvc.yaml
tests:
  - it: renders no claim by default
    asserts:
      - hasDocuments:
          count: 0

  - it: pvc kept on uninstall
    set:
      server.persistence.claim: {storageClassName: synology-iscsi, size: 1Gi}
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: RELEASE-NAME-padel-score-server-data
      - equal:
          path: spec.storageClassName
          value: synology-iscsi
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: Prune=false,Delete=false

  - it: refuses a claim with a class but no size
    set:
      server.persistence.claim: {storageClassName: synology-iscsi}
    asserts:
      - failedTemplate:
          errorMessage: "padel-score-helm: server.persistence.claim.size is required"
