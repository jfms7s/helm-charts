# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: server-service
templates:
  - templates/server-service.yaml
tests:
  - it: exposes port 8080 with immutable selectors
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-padel-score-server
      - equal:
          path: spec.ports[0]
          value: {name: http, port: 8080, targetPort: 8080, protocol: TCP}
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: server
            app.kubernetes.io/instance: RELEASE-NAME
