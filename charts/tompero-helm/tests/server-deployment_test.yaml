# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: server-deployment
templates:
  - templates/server-deployment.yaml
tests:
  - it: renders with chart defaults
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-tompero-server
      - equal:
          path: metadata.labels
          value:
            app.kubernetes.io/name: server
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: server
            app.kubernetes.io/part-of: tompero
            app.kubernetes.io/managed-by: Helm
            helm.sh/chart: tompero-helm-0.2.0
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: server
            app.kubernetes.io/instance: RELEASE-NAME
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/jfms7s/tompero:v0.1.0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATA_DIR
            value: /data
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SECURE_COOKIES
            value: "false"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
          any: true
      - equal:
          path: spec.template.spec.containers[0].ports[0]
          value:
            name: http
            containerPort: 8080
            protocol: TCP
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /api/health
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0]
          value:
            name: data
            mountPath: /data
      - equal:
          path: spec.template.spec.volumes[0]
          value:
            name: data
            emptyDir: {}
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: uses a Postgres URL given as a literal
    set:
      server.databaseUrl.value: postgres://tompero:pw@db:5432/tompero
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            value: postgres://tompero:pw@db:5432/tompero

  - it: prefers a Postgres URL from a Secret over a literal
    set:
      server.databaseUrl:
        value: postgres://ignored
        valueFrom:
          secretKeyRef: {name: tompero-db, key: url}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef: {name: tompero-db, key: url}

  - it: mounts a custom volume source with a subPath
    set:
      server.persistence.volume:
        nfs: {server: 192.168.1.10, path: /volumes/tompero}
      server.persistence.subPath: data
    asserts:
      - equal:
          path: spec.template.spec.volumes[0]
          value:
            name: data
            nfs: {server: 192.168.1.10, path: /volumes/tompero}
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].subPath
          value: data

  - it: passes secure cookies, log level, extra env and pull secrets through
    set:
      server.secureCookies: true
      server.logLevel: debug
      server.extraEnv: [{name: TZ, value: Europe/Lisbon}]
      imagePullSecrets: [{name: ghcr-pull}]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SECURE_COOKIES, value: "true"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOG_LEVEL, value: debug}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: TZ, value: Europe/Lisbon}
      - equal:
          path: spec.template.spec.imagePullSecrets
          value: [{name: ghcr-pull}]

  - it: takes an extra env var from a Secret with valueFrom
    set:
      server.extraEnv:
        - name: TOMPERO_SECRET_KEY
          valueFrom:
            secretKeyRef: {name: tompero-secrets, key: TOMPERO_SECRET_KEY}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOMPERO_SECRET_KEY
            valueFrom:
              secretKeyRef: {name: tompero-secrets, key: TOMPERO_SECRET_KEY}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: TOMPERO_SECRET_KEY, value: ""}
