# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: server-ingress
templates:
  - templates/server-ingress.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: routes the host to the server service with TLS
    set:
      ingress.enabled: true
      ingress.className: traefik
      ingress.hosts: [{host: tompero.k3s.example, paths: [{path: /}]}]
      ingress.tls: [{secretName: tompero-tls, hosts: [tompero.k3s.example]}]
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: spec.ingressClassName
          value: traefik
      - equal:
          path: spec.rules[0].host
          value: tompero.k3s.example
      - equal:
          path: spec.rules[0].http.paths[0].backend.service
          value: {name: RELEASE-NAME-tompero-server, port: {number: 8080}}
      - equal:
          path: spec.tls[0].secretName
          value: tompero-tls
