# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: servicemonitor
templates:
  - templates/servicemonitor.yaml
values:
  - ../ci/test-values.yaml
chart:
  version: 0.0.0-test
release:
  name: rel
  namespace: tools
tests:
  - it: renders nothing by default
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when enabled but the cluster has no monitoring.coreos.com/v1 API
    set:
      serviceMonitor.enabled: true
      serviceMonitor.port: http
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a ServiceMonitor that selects the chart's Service
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1
    set:
      fullnameOverride: my-app
      serviceMonitor.enabled: true
      serviceMonitor.port: http
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceMonitor
      - equal:
          path: metadata.name
          value: my-app
      - equal:
          path: metadata.namespace
          value: tools
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: common
            app.kubernetes.io/instance: rel
            app.kubernetes.io/component: common
      - equal:
          path: spec.namespaceSelector.matchNames
          value: [tools]
      - equal:
          path: spec.endpoints
          value:
            - port: http
              path: /metrics

  - it: passes path, interval, scrapeTimeout and extra labels through
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1
    set:
      serviceMonitor.enabled: true
      serviceMonitor.port: http
      serviceMonitor.path: /stats
      serviceMonitor.interval: 30s
      serviceMonitor.scrapeTimeout: 10s
      serviceMonitor.labels:
        release: kube-prometheus-stack
    asserts:
      - equal:
          path: spec.endpoints[0].path
          value: /stats
      - equal:
          path: spec.endpoints[0].interval
          value: 30s
      - equal:
          path: spec.endpoints[0].scrapeTimeout
          value: 10s
      - equal:
          path: metadata.labels.release
          value: kube-prometheus-stack

  - it: fails when enabled without a port
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1
    set:
      serviceMonitor.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: serviceMonitor.port must name a service.ports key

  - it: fails when the port is not a service.ports key
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1
    set:
      serviceMonitor.enabled: true
      serviceMonitor.port: metrics
    asserts:
      - failedTemplate:
          errorPattern: 'serviceMonitor.port "metrics" is not a service.ports key'
