# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: serviceaccount
templates:
  - templates/serviceaccount.yaml
tests:
  - it: does not render when serviceAccount.create is false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders with the fullname when create is true and name is empty
    set:
      deploy.serviceAccount.create: true
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-common
      - equal:
          path: metadata.namespace
          value: NAMESPACE

  - it: renders with the explicit name when create is true and name is set
    set:
      deploy.serviceAccount.create: true
      deploy.serviceAccount.name: my-sa
    asserts:
      - equal:
          path: metadata.name
          value: my-sa

  - it: renders annotations when provided
    set:
      deploy.serviceAccount.create: true
      deploy.serviceAccount.annotations:
        example.com/annotation: "true"
    asserts:
      - equal:
          path: metadata.annotations["example.com/annotation"]
          value: "true"

  - it: applies standard labels
    set:
      deploy.serviceAccount.create: true
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: common
