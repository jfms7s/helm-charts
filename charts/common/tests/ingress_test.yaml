# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: ingress
templates:
  - templates/ingress.yaml
tests:
  - it: does not render when disabled by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders default host and path when enabled
    set:
      ingress.enabled: true
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: metadata.name
          value: RELEASE-NAME-common
      - equal:
          path: spec.rules[0].host
          value: chart-example.local
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Prefix
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: NAMESPACE-RELEASE-NAME-common
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          # NOTE: values.yaml's own default host ships `port: http` (a port
          # *name*), but the template does `number: {{ .port | default 80 }}`
          # -- it never resolves a name to a number, so this renders a
          # non-numeric `port.number`, which is invalid per the Ingress API
          # schema. Captured here as current behavior; see PR discussion for
          # whether values.yaml's example or the template should change.
          value: "http"
      - notExists:
          path: spec.ingressClassName
      - notExists:
          path: spec.tls

  - it: sets the ingress class name when provided
    set:
      ingress.enabled: true
      ingress.className: nginx
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx

  - it: renders annotations when provided
    set:
      ingress.enabled: true
      ingress.annotations:
        kubernetes.io/ingress.class: nginx
    asserts:
      - equal:
          path: metadata.annotations["kubernetes.io/ingress.class"]
          value: nginx

  - it: renders tls hosts and secretName when provided
    set:
      ingress.enabled: true
      ingress.tls:
        - secretName: chart-example-tls
          hosts:
            - chart-example.local
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: chart-example-tls
      - equal:
          path: spec.tls[0].hosts[0]
          value: chart-example.local

  - it: renders multiple hosts with custom paths and ports
    set:
      ingress.enabled: true
      ingress.hosts:
        - host: a.example.com
          paths:
            - path: /a
              pathType: Exact
              port: http
        - host: b.example.com
          paths:
            - path: /b
              port: metrics
    asserts:
      - equal:
          path: spec.rules[0].host
          value: a.example.com
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Exact
      - equal:
          path: spec.rules[1].host
          value: b.example.com
      - equal:
          path: spec.rules[1].http.paths[0].pathType
          value: Prefix
