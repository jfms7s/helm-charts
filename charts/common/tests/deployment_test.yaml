# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: deployment
templates:
  - templates/deployment.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: renders with chart defaults
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-common
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - equal:
          path: spec.replicas
          value: 1
      # 3 old ReplicaSets, not the default 10 (Deployment spec: rolls nothing).
      - equal:
          path: spec.revisionHistoryLimit
          value: 3
      - equal:
          path: spec.template.spec.containers[0].image
          value: "nginx:1.27"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
      - notExists:
          path: spec.template.spec.containers[0].env
      - isNullOrEmpty:
          path: spec.template.spec.containers[0].ports
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value: []
      - equal:
          path: spec.template.spec.volumes
          value: []
      - notExists:
          path: spec.template.spec.serviceAccountName

  - it: sets image repository and tag from values
    set:
      deploy.image.repository: nginx
      deploy.image.tag: "1.27"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "nginx:1.27"

  - it: fails when deploy.image.repository is empty
    set:
      deploy.image.repository: ""
    asserts:
      - failedTemplate:
          errorMessage: "common: deploy.image.repository must be set"

  - it: renders the repository alone when deploy.image.tag is empty
    set:
      deploy.image.tag: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx

  - it: names scalar-form container ports after their key
    set:
      deploy.containerPorts:
        http: 8080
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - name: http
              containerPort: 8080
              protocol: TCP

  - it: defaults protocol to TCP for map-form container ports
    set:
      deploy.containerPorts:
        metrics:
          port: 9090
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - name: metrics
              containerPort: 9090
              protocol: TCP

  - it: keeps an explicit map-form protocol
    set:
      deploy.containerPorts:
        dns:
          port: 53
          protocol: UDP
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].protocol
          value: UDP

  - it: fails on a container port key that is not a valid port name
    set:
      deploy.containerPorts:
        Bad_Name: 8080
    asserts:
      - failedTemplate:
          errorPattern: "deploy.containerPorts key \"Bad_Name\" is not a valid port name"

  - it: fails on a container port key longer than 15 characters
    set:
      deploy.containerPorts:
        a-very-long-port-name: 8080
    asserts:
      - failedTemplate:
          errorPattern: "is not a valid port name"

  - it: applies standard and component labels to the pod template and matchLabels
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: common
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: common
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: common
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: common

  - it: renders simple and map-form container ports together
    set:
      deploy.containerPorts:
        http: 80
        https:
          port: 443
          protocol: TCP
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
            containerPort: 80
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: https
            containerPort: 443
            protocol: TCP

  - it: renders env vars only when deploy.env is set
    set:
      deploy.env:
        - name: MY_VAR
          value: my-value
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MY_VAR
            value: my-value

  - it: omits strategy when not set, leaving the Kubernetes default (RollingUpdate)
    asserts:
      - notExists:
          path: spec.strategy

  - it: renders Recreate with an explicit null rollingUpdate
    # The null is what lets client-side apply (kubectl, Argo CD) switch a
    # live RollingUpdate Deployment in place -- without it the API-defaulted
    # rollingUpdate survives the patch and the API rejects the update.
    set:
      deploy.strategy:
        type: Recreate
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: Recreate
            rollingUpdate: null

  - it: drops a user-supplied rollingUpdate when type is Recreate
    set:
      deploy.strategy:
        type: Recreate
        rollingUpdate:
          maxSurge: 1
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: Recreate
            rollingUpdate: null

  - it: renders a RollingUpdate strategy verbatim
    set:
      deploy.strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 1

  - it: omits command and args when not set
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].command
      - notExists:
          path: spec.template.spec.containers[0].args

  - it: renders command and args when set
    set:
      deploy.command:
        - flood
      deploy.args:
        - --auth=none
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["flood"]
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["--auth=none"]

  - it: renders liveness, readiness, and startup probes only when set
    set:
      deploy.livenessProbe:
        httpGet:
          path: /health
          port: http
      deploy.readinessProbe:
        httpGet:
          path: /ready
          port: http
      deploy.startupProbe:
        httpGet:
          path: /health
          port: http
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /ready
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /health

  - it: omits probes when not set
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe
      - notExists:
          path: spec.template.spec.containers[0].startupProbe

  - it: renders resources, securityContext, and podSecurityContext
    set:
      deploy.resources:
        limits:
          cpu: 100m
          memory: 128Mi
      deploy.securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      deploy.podSecurityContext:
        fsGroup: 1000
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000

  - it: renders extra volumes and volumeMounts
    set:
      deploy.volumes:
        - name: extra
          emptyDir: {}
      deploy.volumeMounts:
        - name: extra
          mountPath: /extra
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: extra
            emptyDir: {}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra
            mountPath: /extra

  - it: omits initContainers when not set
    asserts:
      - notExists:
          path: spec.template.spec.initContainers

  - it: renders initContainers verbatim when set
    set:
      deploy.initContainers:
        - name: init-example
          image: busybox:1.36
          command: ["sh", "-c", "echo init"]
          volumeMounts:
            - name: extra
              mountPath: /extra
    asserts:
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: init-example
            image: busybox:1.36
            command: ["sh", "-c", "echo init"]
            volumeMounts:
              - name: extra
                mountPath: /extra

  - it: renders commonAnnotations on the pod template
    set:
      commonAnnotations:
        example.com/annotation: "true"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["example.com/annotation"]
          value: "true"

  - it: renders no pod-template annotations key when every annotation source is empty
    asserts:
      - notExists:
          path: spec.template.metadata.annotations

  - it: renders deploy.podAnnotations on the pod template
    set:
      deploy.podAnnotations:
        reloader.stakater.com/auto: "true"
    asserts:
      - equal:
          path: spec.template.metadata.annotations
          value:
            reloader.stakater.com/auto: "true"

  - it: merges commonAnnotations and deploy.podAnnotations, podAnnotations winning a shared key
    set:
      commonAnnotations:
        example.com/common: "c"
        example.com/shared: "from-common"
      deploy.podAnnotations:
        example.com/pod: "p"
        example.com/shared: "from-pod"
    asserts:
      - equal:
          path: spec.template.metadata.annotations
          value:
            example.com/common: "c"
            example.com/pod: "p"
            example.com/shared: "from-pod"

  - it: renders no extra containers by default
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1

  - it: renders deploy.extraContainers verbatim after the app container
    set:
      deploy.extraContainers:
        - name: side
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2
      - equal:
          path: spec.template.spec.containers[0].name
          value: common
      - equal:
          path: spec.template.spec.containers[1]
          value:
            name: side
            image: busybox:1.36
            command: ["sh", "-c", "sleep infinity"]

  - it: adds a checksum/config-<key> pod annotation per ConfigMap
    set:
      configMaps:
        app:
          data:
            k: v
        other:
          data:
            a: b
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config-app"]
          pattern: ^[0-9a-f]{64}$
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config-other"]
          pattern: ^[0-9a-f]{64}$

  - it: the checksum/config-app annotation is the sha256 of the ConfigMap data
    set:
      configMaps:
        app:
          data:
            k: v
    asserts:
      # sha256sum of "k: v" (toYaml of the data map, no trailing newline)
      - equal:
          path: spec.template.metadata.annotations["checksum/config-app"]
          value: 5aa06bf80d7cdbef426d0a77e5162c2cd3b1439e4ea9542861a3fc2dc4537cfd

  - it: the checksum/config-app annotation changes when the data changes
    set:
      configMaps:
        app:
          data:
            k: w
    asserts:
      - notEqual:
          path: spec.template.metadata.annotations["checksum/config-app"]
          value: 5aa06bf80d7cdbef426d0a77e5162c2cd3b1439e4ea9542861a3fc2dc4537cfd

  - it: keeps commonAnnotations and podAnnotations next to the ConfigMap checksums
    set:
      commonAnnotations:
        example.com/common: "c"
      deploy.podAnnotations:
        example.com/pod: "p"
      configMaps:
        app:
          data:
            k: v
    asserts:
      - equal:
          path: spec.template.metadata.annotations["example.com/common"]
          value: "c"
      - equal:
          path: spec.template.metadata.annotations["example.com/pod"]
          value: "p"
      - exists:
          path: spec.template.metadata.annotations["checksum/config-app"]

  - it: sets serviceAccountName to the fullname when serviceAccount.create is true and name is empty
    set:
      deploy.serviceAccount.create: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-common

  - it: sets serviceAccountName to the explicit name when serviceAccount.create is true
    set:
      deploy.serviceAccount.create: true
      deploy.serviceAccount.name: my-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: my-sa

  - it: sets serviceAccountName to the explicit name when serviceAccount.create is false
    set:
      deploy.serviceAccount.create: false
      deploy.serviceAccount.name: my-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: my-sa

  - it: omits serviceAccountName when neither create nor name is set
    asserts:
      - notExists:
          path: spec.template.spec.serviceAccountName

  - it: uses fullnameOverride verbatim when set
    set:
      fullnameOverride: my-override
    asserts:
      - equal:
          path: metadata.name
          value: my-override

  - it: uses the release name alone when nameOverride is contained in the release name
    set:
      nameOverride: common
    release:
      name: test-common
    asserts:
      - equal:
          path: metadata.name
          value: test-common

  - it: prefixes nameOverride with the release name when not already contained in it
    set:
      nameOverride: myapp
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-myapp

  - it: renders no nodeSelector, affinity or tolerations by default
    asserts:
      - notExists:
          path: spec.template.spec.nodeSelector
      - notExists:
          path: spec.template.spec.affinity
      - notExists:
          path: spec.template.spec.tolerations

  - it: renders deploy.nodeSelector, deploy.affinity and deploy.tolerations verbatim
    set:
      deploy.nodeSelector:
        kubernetes.io/arch: amd64
      deploy.affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      deploy.tolerations:
        - key: workload
          operator: Equal
          value: ci
          effect: NoSchedule
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            kubernetes.io/arch: amd64
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0]
          value:
            key: node-role.kubernetes.io/control-plane
            operator: DoesNotExist
      - equal:
          path: spec.template.spec.tolerations
          value:
            - key: workload
              operator: Equal
              value: ci
              effect: NoSchedule

  # Pod template labels must not change with the chart release, or every
  # common version bump restarts every consumer's pod.
  - it: keeps chart-version labels off the pod template
    asserts:
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - exists:
          path: metadata.labels["app.kubernetes.io/version"]
      - notExists:
          path: spec.template.metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.template.metadata.labels["app.kubernetes.io/version"]
      - equal:
          path: spec.template.metadata.labels
          value:
            app.kubernetes.io/name: common
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/component: common
