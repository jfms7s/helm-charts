# Default values for common.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

## @section Common parameters

## @param nameOverride String to partially override common.names.name
##
nameOverride: ""

## @param fullnameOverride String to fully override common.names.fullname
##
fullnameOverride: ""

## @param commonAnnotations Annotations added to the pod template
## Merged with deploy.podAnnotations (which wins a shared key); no annotations key
## is rendered when both are empty and there are no configMaps.
##
commonAnnotations: {}

## @param configMaps Chart-owned ConfigMaps, keyed by name suffix
## Each entry renders a ConfigMap `<fullname>-<key>` with the chart's labels, plus a
## `checksum/config-<key>` pod annotation (sha256 of its data), so a data change rolls
## the pod. Keys: lowercase letters, digits and "-", at most 56 characters. Mount one
## through deploy.volumes as `configMap: {name: <fullname>-<key>}`.
##
configMaps: {}
  # app:
  #   data:
  #     config.yml: |
  #       key: value

deploy:

  ## deploy image
  ## @param deploy.image.repository deploy image repository (required: the render fails without it)
  ## @param deploy.image.tag deploy image tag (immutable tags are recommended; empty renders the repository alone)
  ## @param deploy.image.pullPolicy deploy image pull policy
  ##
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

  ## @param deploy.replicas Number of deployment replicas
  ##
  replicas: 1

  ## @param deploy.strategy Deployment update strategy, rendered verbatim (empty = Kubernetes default, RollingUpdate)
  ## Set `type: Recreate` for single-writer workloads (e.g. SQLite/sqld on a
  ## shared volume) that must never run two pods at once during a rollout.
  ## ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
  ##
  strategy: {}
    # type: Recreate

  ## @param deploy.resources Resource limits and requests
  ##
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  ## @param deploy.securityContext Security context for the container
  ##
  securityContext: {}
    # runAsNonRoot: true
    # runAsUser: 1000
    # fsGroup: 1000

  ## @param deploy.podSecurityContext Security context for the pod
  ##
  podSecurityContext: {}
    # fsGroup: 1000

  ## @param deploy.serviceAccount.create Create a service account
  ## @param deploy.serviceAccount.name Service account name to use
  ## @param deploy.serviceAccount.annotations Service account annotations
  ##
  serviceAccount:
    create: false
    name: ""
    annotations: {}

  ## @param deploy.hostNetwork Run the pod in the node's network namespace (for LAN discovery: mDNS/SSDP)
  ## Its ports bind on the node itself, so pin the pod with nodeSelector and run one replica.
  ##
  hostNetwork: false

  ## @param deploy.dnsPolicy Pod DNS policy (empty = Kubernetes default; ClusterFirstWithHostNet when hostNetwork is true)
  ## ref: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-s-dns-policy
  ##
  dnsPolicy: ""

  ## @param deploy.nodeSelector Node labels the pod must match, rendered verbatim (empty = none)
  ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
  ##
  nodeSelector: {}
    # kubernetes.io/arch: amd64

  ## @param deploy.affinity Pod affinity/anti-affinity and node affinity, rendered verbatim (empty = none)
  ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
  ##
  affinity: {}

  ## @param deploy.tolerations Tolerations for tainted nodes, rendered verbatim (empty = none)
  ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  ##
  tolerations: []

  ## @param deploy.volumes Optionally specify extra list of additional volumes
  ##
  volumes: []
  ## @param deploy.volumeMounts Optionally specify extra list of additional volumeMounts
  ##
  volumeMounts: []

  ## @param deploy.persistentVolumeClaims PVCs to create in the release namespace
  ## Each: {name, storageClassName (required), size (required), accessModes (default [ReadWriteOnce])}.
  ## Reference one from deploy.volumes as persistentVolumeClaim.claimName: <name>.
  ## Claims are kept on uninstall/prune (helm.sh/resource-policy: keep + Argo CD Prune=false,Delete=false).
  ##
  persistentVolumeClaims: []

  ## @param deploy.initContainers Optionally specify a list of initContainers, rendered verbatim
  ## ref: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
  ##
  initContainers: []
    # - name: init-example
    #   image: busybox:1.36
    #   command: ["sh", "-c", "echo init"]
    #   volumeMounts:
    #     - name: extra
    #       mountPath: /extra

  ## @param deploy.extraContainers Sidecar containers, rendered verbatim after the app container
  ## ref: https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/
  ##
  extraContainers: []
    # - name: sidecar
    #   image: busybox:1.36
    #   command: ["sh", "-c", "sleep infinity"]

  ## @param deploy.podAnnotations Annotations added to the pod template, merged over commonAnnotations
  ##
  podAnnotations: {}
    # reloader.stakater.com/auto: "true"

  ## @param deploy.env Environment variables for the container
  ##
  env: []

  ## @param deploy.command Override the container's ENTRYPOINT (Docker exec form)
  ##
  command: []
    # - flood

  ## @param deploy.args Override the container's CMD (Docker exec form)
  ##
  args: []
    # - --auth=none

  ## @param deploy.containerPorts Container ports, keyed by port name (both forms are named, so probes can use `port: http`)
  ## Scalar form `http: 8080`, or map form `http: {port: 8080, protocol: TCP}` (protocol defaults to TCP).
  ## Keys must be IANA port names: lowercase letters, digits and "-", at most 15 characters.
  ##
  containerPorts: {}
    # http: 80
    # https: 443

  ## @param deploy.livenessProbe Liveness probe configuration
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  ##
  livenessProbe: {}
    # httpGet:
    #   path: /health
    #   port: http
    # initialDelaySeconds: 30
    # periodSeconds: 10
    # timeoutSeconds: 5
    # successThreshold: 1
    # failureThreshold: 3

  ## @param deploy.readinessProbe Readiness probe configuration
  ##
  readinessProbe: {}
    # httpGet:
    #   path: /ready
    #   port: http
    # initialDelaySeconds: 5
    # periodSeconds: 10
    # timeoutSeconds: 3
    # successThreshold: 1
    # failureThreshold: 3

  ## @param deploy.startupProbe Startup probe configuration
  ##
  startupProbe: {}
    # httpGet:
    #   path: /health
    #   port: http
    # initialDelaySeconds: 0
    # periodSeconds: 10
    # timeoutSeconds: 3
    # successThreshold: 1
    # failureThreshold: 30

service:
  ## @param service.type Service type
  ##
  type: ClusterIP

  ## @param service.ports Service ports configuration
  ## Can be defined as simple values (port: 80) or objects (port: { port: 80, targetPort: 8080, protocol: TCP })
  ##
  ports:
    http: 80

  ## @param service.annotations Service annotations
  ##
  annotations: {}

  ## @param service.labels Service labels
  ##
  labels: {}

serviceMonitor:
  ## @param serviceMonitor.enabled Render a Prometheus Operator ServiceMonitor for the Service
  ## Only rendered when the cluster has the monitoring.coreos.com/v1 API.
  ##
  enabled: false

  ## @param serviceMonitor.port Name of the service.ports key to scrape (required when enabled)
  ##
  port: ""

  ## @param serviceMonitor.path Metrics path
  ##
  path: /metrics

  ## @param serviceMonitor.interval Scrape interval (empty = Prometheus default)
  ##
  interval: ""

  ## @param serviceMonitor.scrapeTimeout Scrape timeout (empty = Prometheus default)
  ##
  scrapeTimeout: ""

  ## @param serviceMonitor.labels Extra labels on the ServiceMonitor
  ##
  labels: {}

ingress:
  ## @param ingress.enabled Enable ingress controller resource
  ##
  enabled: false

  ## @param ingress.className IngressClass that will be be used to implement the Ingress
  ## This is supported in Kubernetes 1.18+ and required if you have more than one IngressClass marked as the default for your cluster .
  ## ref: https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class
  ##
  className: ""

  ## @param ingress.annotations Annotations to add to the ingress resource
  ##
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # nginx.ingress.kubernetes.io/rewrite-target: /
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"

  ## @param ingress.hosts Host configuration for ingress
  ## host - Host to be used for ingress
  ## paths - List of paths for the host
  ## path - Path for the host
  ## pathType - Path type (ImplementationSpecific, Prefix, Exact)
  ## port - Service port to be used for the path
  ##
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
          port: http

  ## @param ingress.tls TLS configuration for ingress
  ## secretName - Name of the secret containing TLS certificate
  ## hosts - List of hosts for the TLS certificate
  ##
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

  