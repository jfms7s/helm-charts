# NATS (JetStream) message bus wiring the scraper, telegram-notifier, and
# web-ui-api together. A single-replica in-cluster broker, not exposed
# outside the release.
nats:
  image:
    repository: nats
    tag: "2-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Volume source for NATS JetStream file storage. Each value is the full
  # body of a Kubernetes volume source (excluding `name`) -- nfs, hostPath,
  # persistentVolumeClaim, etc. Left empty (emptyDir, non-persistent) by
  # default since the right backend is environment-specific; set explicitly
  # by the caller, e.g.:
  #   persistence:
  #     volume:
  #       nfs:
  #         server: 192.168.1.10
  #         path: /volumes/ticket-scanner/nats
  persistence:
    volume: {}
    # Optional: have the chart create a PVC named
    # <release>-ticket-scanner-nats-data. Point `volume` at it with
    # persistentVolumeClaim.claimName. Kept on uninstall/prune.
    claim:
      storageClassName: ""
      size: ""
    # Optional subdirectory of the volume to mount as /data (keeps ext4's
    # lost+found out of it, and lets the copy chown it for the non-root user).
    subPath: ""
  # Optional shared token the broker requires from every client. Same
  # {value, valueFrom} shape as turso below. Empty (default) = no auth, the
  # broker accepts anonymous clients as before. When set, the broker loads
  # `authorization { token: ... }` from a chart ConfigMap (the token itself
  # comes from the env, never the ConfigMap or argv) and every client gets
  # NATS_TOKEN. Needs app images v0.5.0 or later (older ones ignore
  # NATS_TOKEN and are refused). Must not contain `"`, `\` or a newline.
  auth:
    token:
      value: ""
      valueFrom: {}

# Optional NetworkPolicy limiting ingress to the NATS pod to TCP 4222 from
# this release's scraper, notifiers and web-ui-api. Off by default; needs a
# CNI that enforces NetworkPolicy (k3s does). Egress is not restricted.
networkPolicy:
  enabled: false

# Turso (libSQL) database credentials, shared by the scraper (writer) and
# web-ui-api (reader). Each is a standard Kubernetes EnvVarSource: set
# `value` for a plain literal (Argo CD does not support Helm's `lookup`
# function, so these can't be safely auto-generated and persisted across
# syncs -- pin explicitly, e.g. from a values-secrets file kept out of
# version control), or `valueFrom` (e.g. a `secretKeyRef`) to source it from
# a Secret you manage yourself instead. `valueFrom` takes precedence when
# both are set; each field toggles independently.
turso:
  databaseUrl:
    value: "CHANGE_ME"
    valueFrom: {}
  authToken:
    value: "CHANGE_ME"
    valueFrom: {}

# Telegram bot credentials for telegram-notifier. Same shape/rationale as
# turso above.
telegram:
  botToken:
    value: "CHANGE_ME"
    valueFrom: {}
  chatId:
    value: "CHANGE_ME"
    valueFrom: {}

# SMTP relay credentials for email-notifier, which emails a calendar
# invite (.ics) when an event is marked purchased. host/port/from/to are
# plain config (not secret-worthy on their own), so they're bare scalars
# rather than the value/valueFrom shape used for username/password below
# -- those two follow turso/telegram's shape/rationale above. Defaults
# below assume Gmail (smtp.gmail.com:587 with STARTTLS); username must be
# a full Gmail address and password a Gmail App Password, not the account
# password.
smtp:
  host: "smtp.gmail.com"
  port: 587
  username:
    value: "CHANGE_ME"
    valueFrom: {}
  password:
    value: "CHANGE_ME"
    valueFrom: {}
  from: "CHANGE_ME"
  to: "CHANGE_ME"

scraper:
  image:
    repository: ghcr.io/jfms7s/ticket-live-event-scanner-scraper
    tag: latest
    pullPolicy: IfNotPresent
  # Cron schedule the scraper CronJob runs on.
  schedule: "0 * * * *"
  backoffLimit: 2
  # Seconds a finished scraper Job (and its pod's logs) is kept before deletion.
  ttlSecondsAfterFinished: 86400
  # Comma-separated ticketline.pt hub page slugs the scraper re-checks for
  # new session IDs.
  hubPages: "auchan-live-academia-maia-98164,auchan-live-academia-aveiro-98167"
  # HTTP User-Agent the scraper sends. Add your own contact (a URL or an
  # address) so the site can reach whoever runs this install.
  userAgent: "ticket-live-event-scanner (+https://github.com/jfms7s/ticket-live-event-scanner)"
  requestDelayMs: 1500
  # Weekly Telegram digest (app >= v0.6.0): a second CronJob running the
  # scraper image with --digest, which publishes one summary for
  # telegram-notifier to send (next 14 days, new this week, hubs, runs).
  # Off by default. Never retried (backoffLimit 0) and never caught up late.
  digest:
    enabled: false
    schedule: "0 19 * * 0"
    # IANA zone for the schedule (CronJob spec.timeZone).
    timeZone: "Europe/Lisbon"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

telegramNotifier:
  image:
    repository: ghcr.io/jfms7s/ticket-live-event-scanner-telegram-notifier
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

emailNotifier:
  image:
    repository: ghcr.io/jfms7s/ticket-live-event-scanner-email-notifier
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

webUiApi:
  image:
    repository: ghcr.io/jfms7s/ticket-live-event-scanner-web-ui-api
    tag: latest
    pullPolicy: IfNotPresent
  # CORS_ORIGIN, only for a dashboard served from another origin than the
  # API (e.g. a dev setup on two ports). Empty (default): no CORS headers;
  # web-ui-api serves the dashboard itself, so the browser makes same-origin
  # calls. Never "*": the API is unauthenticated and has side effects.
  corsOrigin: ""
  # Scraper run health on web-ui-api's /metrics (app >= v0.6.0): last run,
  # run failed and per-hub consecutive empty runs, for Prometheus alert
  # rules. Off by default; needs the Prometheus Operator CRDs.
  metrics:
    serviceMonitor:
      enabled: false
      interval: 60s
      # Extra labels, for a Prometheus that selects ServiceMonitors by label.
      labels: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
    # traefik.ingress.kubernetes.io/rewrite-target: "/"
  hosts:
    - host: ticket-scanner.example.local
      paths:
        - path: /
          pathType: Prefix
          # Optional: `service: <name>` routes the path to another Service
          # instead of web-ui-api, which serves both the dashboard and /api.
          # The backend is that Service's port named `http`; a `port` key is ignored.
  tls: []
