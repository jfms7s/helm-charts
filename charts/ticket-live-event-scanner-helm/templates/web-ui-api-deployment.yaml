{{- include "ticket-live-event-scanner-helm.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ticket-scanner-web-ui-api
  labels:
    {{- include "ticket-live-event-scanner-helm.labels" (dict "context" $ "name" "web-ui-api" "component" "api") | nindent 4 }}
  annotations:
    # Kept at 1 replica because multi-replica operation is untested. The
    # JetStream consumers are durable pull consumers with explicit ack, so a
    # second pod (as during a rolling update) shares the messages rather
    # than processing each one twice.
    description: "Web UI API, dashboard, scraper, weekly digest and the Telegram and email notifiers. Kept at 1 replica (multi-replica untested)."
spec:
  replicas: 1
  {{- if .Values.database.sqlite.enabled }}
  # One pod owns the SQLite file on its ReadWriteOnce volume: stop the old
  # pod before starting the new one.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "ticket-live-event-scanner-helm.selectorLabels" (dict "context" $ "name" "web-ui-api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ticket-live-event-scanner-helm.podLabels" (dict "context" $ "name" "web-ui-api" "component" "api") | nindent 8 }}
      {{- with include "ticket-live-event-scanner-helm.credentialsChecksum" (dict "ctx" $ "keys" (list "TURSO_AUTH_TOKEN" "TURSO_DATABASE_URL" "NATS_TOKEN" "TELEGRAM_BOT_TOKEN" "TELEGRAM_CHAT_ID" "SMTP_USERNAME" "SMTP_PASSWORD")) }}{{ . | nindent 6 }}{{ end }}
    spec:
      securityContext:
        {{- include "ticket-live-event-scanner-helm.podSecurityContext" . | nindent 8 }}
      automountServiceAccountToken: false
      containers:
        - name: web-ui-api
          image: {{ .Values.webUiApi.image.repository }}:{{ .Values.webUiApi.image.tag }}
          imagePullPolicy: {{ .Values.webUiApi.image.pullPolicy }}
          securityContext:
            {{- include "ticket-live-event-scanner-helm.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.database.sqlite.enabled }}
            - name: data
              mountPath: {{ dir .Values.database.sqlite.path }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- if .Values.database.sqlite.enabled }}
            - name: DATABASE_PATH
              value: {{ .Values.database.sqlite.path | quote }}
            {{- if .Values.database.sqlite.allowEmpty }}
            - name: DATABASE_ALLOW_EMPTY
              value: "true"
            {{- end }}
            {{- end }}
            {{- if include "ticket-live-event-scanner-helm.sqldInUse" . }}
            - name: TURSO_DATABASE_URL
              {{- include "ticket-live-event-scanner-helm.credentialEnv" (dict "ctx" $ "key" "TURSO_DATABASE_URL") | nindent 14 }}
            - name: TURSO_AUTH_TOKEN
              {{- include "ticket-live-event-scanner-helm.credentialEnv" (dict "ctx" $ "key" "TURSO_AUTH_TOKEN") | nindent 14 }}
            {{- end }}
            - name: LISTEN_ADDR
              value: ":8080"
            # The scraper and the weekly digest (app >= v0.11.0).
            {{- if not .Values.scraper.enabled }}
            - name: SCRAPER_ENABLED
              value: "false"
            {{- end }}
            - name: TICKETLINE_HUB_PAGES
              value: {{ .Values.scraper.hubPages | quote }}
            - name: USER_AGENT
              value: {{ .Values.scraper.userAgent | quote }}
            - name: REQUEST_DELAY_MS
              value: {{ .Values.scraper.requestDelayMs | quote }}
            # The delivery channels (app >= v0.10.0): Telegram and the
            # calendar-invite email run in this process.
            - name: TELEGRAM_BOT_TOKEN
              {{- include "ticket-live-event-scanner-helm.credentialEnv" (dict "ctx" $ "key" "TELEGRAM_BOT_TOKEN") | nindent 14 }}
            - name: TELEGRAM_CHAT_ID
              {{- include "ticket-live-event-scanner-helm.credentialEnv" (dict "ctx" $ "key" "TELEGRAM_CHAT_ID") | nindent 14 }}
            - name: SMTP_HOST
              value: {{ .Values.smtp.host | quote }}
            - name: SMTP_PORT
              value: {{ .Values.smtp.port | quote }}
            - name: SMTP_USERNAME
              {{- include "ticket-live-event-scanner-helm.credentialEnv" (dict "ctx" $ "key" "SMTP_USERNAME") | nindent 14 }}
            - name: SMTP_PASSWORD
              {{- include "ticket-live-event-scanner-helm.credentialEnv" (dict "ctx" $ "key" "SMTP_PASSWORD") | nindent 14 }}
            - name: EMAIL_FROM
              value: {{ .Values.smtp.from | quote }}
            - name: EMAIL_TO
              value: {{ .Values.smtp.to | quote }}
            {{- with .Values.webUiApi.corsOrigin }}
            - name: CORS_ORIGIN
              value: {{ . | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.webUiApi.resources | nindent 12 }}
          # The first start with an import from sqld runs before the HTTP
          # listener opens (up to 3 minutes): hold the other probes back.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
      restartPolicy: Always
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.database.sqlite.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "ticket-live-event-scanner-helm.sqliteClaimName" . }}
        {{- end }}
