{{- include "ticket-live-event-scanner-helm.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ticket-scanner-web-ui-api
  labels:
    {{- include "ticket-live-event-scanner-helm.labels" (dict "context" $ "name" "web-ui-api" "component" "api") | nindent 4 }}
  annotations:
    # Kept at 1 replica because multi-replica operation is untested. The
    # JetStream consumers are durable pull consumers with explicit ack, so a
    # second pod (as during a rolling update) shares the messages rather
    # than processing each one twice.
    description: "Web UI API backend. Kept at 1 replica (multi-replica untested)."
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ticket-live-event-scanner-helm.selectorLabels" (dict "context" $ "name" "web-ui-api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ticket-live-event-scanner-helm.podLabels" (dict "context" $ "name" "web-ui-api" "component" "api") | nindent 8 }}
      {{- with include "ticket-live-event-scanner-helm.credentialsChecksum" $ }}{{ . | nindent 6 }}{{ end }}
    spec:
      securityContext:
        {{- include "ticket-live-event-scanner-helm.podSecurityContext" . | nindent 8 }}
      automountServiceAccountToken: false
      containers:
        - name: web-ui-api
          image: {{ .Values.webUiApi.image.repository }}:{{ .Values.webUiApi.image.tag }}
          imagePullPolicy: {{ .Values.webUiApi.image.pullPolicy }}
          securityContext:
            {{- include "ticket-live-event-scanner-helm.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NATS_URL
              value: nats://{{ .Release.Name }}-ticket-scanner-nats:4222
            - name: TURSO_DATABASE_URL
              {{- include "ticket-live-event-scanner-helm.credentialEnv" (dict "ctx" $ "key" "TURSO_DATABASE_URL") | nindent 14 }}
            - name: TURSO_AUTH_TOKEN
              {{- include "ticket-live-event-scanner-helm.credentialEnv" (dict "ctx" $ "key" "TURSO_AUTH_TOKEN") | nindent 14 }}
            - name: LISTEN_ADDR
              value: ":8080"
            - name: CORS_ORIGIN
              value: {{ include "ticket-live-event-scanner-helm.corsOrigin" . | quote }}
          resources:
            {{- toYaml .Values.webUiApi.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
      restartPolicy: Always
      volumes:
        - name: tmp
          emptyDir: {}
