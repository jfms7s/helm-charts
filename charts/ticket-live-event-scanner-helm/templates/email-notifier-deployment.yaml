{{- include "ticket-live-event-scanner-helm.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ticket-scanner-email-notifier
  labels:
    {{- include "ticket-live-event-scanner-helm.labels" (dict "context" $ "name" "email-notifier" "component" "notifier") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ticket-live-event-scanner-helm.selectorLabels" (dict "context" $ "name" "email-notifier") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ticket-live-event-scanner-helm.podLabels" (dict "context" $ "name" "email-notifier" "component" "notifier") | nindent 8 }}
      {{- with include "ticket-live-event-scanner-helm.credentialsChecksum" (dict "ctx" $ "keys" (list "SMTP_PASSWORD" "SMTP_USERNAME" "NATS_TOKEN")) }}{{ . | nindent 6 }}{{ end }}
    spec:
      securityContext:
        {{- include "ticket-live-event-scanner-helm.podSecurityContext" . | nindent 8 }}
      automountServiceAccountToken: false
      containers:
        - name: email-notifier
          image: {{ .Values.emailNotifier.image.repository }}:{{ .Values.emailNotifier.image.tag }}
          imagePullPolicy: {{ .Values.emailNotifier.image.pullPolicy }}
          securityContext:
            {{- include "ticket-live-event-scanner-helm.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            {{- include "ticket-live-event-scanner-helm.natsClientEnv" . | nindent 12 }}
            - name: SMTP_HOST
              value: {{ .Values.smtp.host | quote }}
            - name: SMTP_PORT
              value: {{ .Values.smtp.port | quote }}
            - name: SMTP_USERNAME
              {{- include "ticket-live-event-scanner-helm.credentialEnv" (dict "ctx" $ "key" "SMTP_USERNAME") | nindent 14 }}
            - name: SMTP_PASSWORD
              {{- include "ticket-live-event-scanner-helm.credentialEnv" (dict "ctx" $ "key" "SMTP_PASSWORD") | nindent 14 }}
            - name: EMAIL_FROM
              value: {{ .Values.smtp.from | quote }}
            - name: EMAIL_TO
              value: {{ .Values.smtp.to | quote }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "kill -0 1"
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.emailNotifier.resources | nindent 12 }}
      restartPolicy: Always
      volumes:
        - name: tmp
          emptyDir: {}
