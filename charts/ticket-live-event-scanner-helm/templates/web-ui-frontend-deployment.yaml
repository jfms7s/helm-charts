apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ticket-scanner-web-ui-frontend
  labels:
    {{- include "ticket-live-event-scanner-helm.labels" (dict "context" $ "name" "web-ui-frontend" "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.webUiFrontend.replicas }}
  selector:
    matchLabels:
      {{- include "ticket-live-event-scanner-helm.selectorLabels" (dict "context" $ "name" "web-ui-frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ticket-live-event-scanner-helm.labels" (dict "context" $ "name" "web-ui-frontend" "component" "frontend") | nindent 8 }}
    spec:
      containers:
        - name: web-ui-frontend
          image: {{ .Values.webUiFrontend.image.repository }}:{{ .Values.webUiFrontend.image.tag }}
          imagePullPolicy: {{ .Values.webUiFrontend.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: API_BASE_URL
              # This becomes window.API_BASE_URL in the browser (see
              # web/frontend/server.js's config.js generation) -- it must be
              # reachable from the user's browser, not just in-cluster, so
              # it defaults to the internal Service DNS name (fine for
              # cluster-internal testing) but should be overridden to the
              # public ingress origin (e.g. https://ticket-scanner.example.com,
              # no trailing /api -- the frontend's own JS already appends
              # /api/... per request) wherever the API is exposed outside
              # the cluster.
              value: {{ .Values.webUiFrontend.apiBaseUrl | default (printf "http://%s-ticket-scanner-web-ui-api" .Release.Name) | quote }}
            - name: PORT
              value: "3000"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.webUiFrontend.resources | nindent 12 }}
      restartPolicy: Always
