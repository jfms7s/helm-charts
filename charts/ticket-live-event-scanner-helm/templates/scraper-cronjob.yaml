apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-ticket-scanner-scraper
  labels:
    {{- include "ticket-live-event-scanner-helm.labels" (dict "context" $ "name" "scraper" "component" "scraper") | nindent 4 }}
spec:
  schedule: {{ .Values.scraper.schedule | quote }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.scraper.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "ticket-live-event-scanner-helm.labels" (dict "context" $ "name" "scraper" "component" "scraper") | nindent 12 }}
        spec:
          serviceAccountName: {{ .Release.Name }}-ticket-scanner-scraper
          containers:
            - name: scraper
              image: {{ .Values.scraper.image.repository }}:{{ .Values.scraper.image.tag }}
              imagePullPolicy: {{ .Values.scraper.image.pullPolicy }}
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
              env:
                - name: TICKETLINE_HUB_PAGES
                  value: {{ .Values.scraper.hubPages | quote }}
                - name: NATS_URL
                  value: nats://{{ .Release.Name }}-ticket-scanner-nats:4222
                - name: TURSO_DATABASE_URL
                  {{- include "ticket-live-event-scanner-helm.credentialEnv" .Values.turso.databaseUrl | nindent 18 }}
                - name: TURSO_AUTH_TOKEN
                  {{- include "ticket-live-event-scanner-helm.credentialEnv" .Values.turso.authToken | nindent 18 }}
                - name: USER_AGENT
                  value: {{ .Values.scraper.userAgent | quote }}
                - name: REQUEST_DELAY_MS
                  value: {{ .Values.scraper.requestDelayMs | quote }}
              resources:
                {{- toYaml .Values.scraper.resources | nindent 16 }}
          restartPolicy: OnFailure
