{{- include "ticket-live-event-scanner-helm.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ticket-scanner-nats
  labels:
    {{- include "ticket-live-event-scanner-helm.labels" (dict "context" $ "name" "nats" "component" "message-bus") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ticket-live-event-scanner-helm.selectorLabels" (dict "context" $ "name" "nats") | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "ticket-live-event-scanner-helm.podLabels" (dict "context" $ "name" "nats" "component" "message-bus") | nindent 8 }}
      {{- with include "ticket-live-event-scanner-helm.credentialsChecksum" (dict "ctx" $ "keys" (list "NATS_TOKEN")) }}{{ . | nindent 6 }}{{ end }}
    spec:
      securityContext:
        {{- include "ticket-live-event-scanner-helm.podSecurityContext" . | nindent 8 }}
      automountServiceAccountToken: false
      containers:
        - name: nats
          image: {{ .Values.nats.image.repository }}:{{ .Values.nats.image.tag }}
          imagePullPolicy: {{ .Values.nats.image.pullPolicy }}
          securityContext:
            {{- include "ticket-live-event-scanner-helm.containerSecurityContext" . | nindent 12 }}
          {{- if include "ticket-live-event-scanner-helm.natsAuthEnabled" . }}
          env:
            - name: NATS_TOKEN
              {{- include "ticket-live-event-scanner-helm.credentialEnv" (dict "ctx" $ "key" "NATS_TOKEN") | nindent 14 }}
            # nats.conf references this one. The server parses an env value
            # as config, so quoting it keeps any token a string (a bare
            # numeric token would otherwise crash the server).
            - name: NATS_TOKEN_QUOTED
              value: "\"$(NATS_TOKEN)\""
          {{- end }}
          args:
            {{- if include "ticket-live-event-scanner-helm.natsAuthEnabled" . }}
            - -c
            - /etc/nats/nats.conf
            {{- end }}
            - -js
            - -sd
            - /data
          ports:
            - name: client
              containerPort: 4222
          readinessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
              {{- with .Values.nats.persistence.subPath }}
              subPath: {{ . | quote }}
              {{- end }}
            - name: tmp
              mountPath: /tmp
            {{- if include "ticket-live-event-scanner-helm.natsAuthEnabled" . }}
            - name: config
              mountPath: /etc/nats
              readOnly: true
            {{- end }}
      restartPolicy: Always
      volumes:
        - name: data
          {{- if .Values.nats.persistence.volume }}
          {{- toYaml .Values.nats.persistence.volume | nindent 10 }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if include "ticket-live-event-scanner-helm.natsAuthEnabled" . }}
        - name: config
          configMap:
            name: {{ include "ticket-live-event-scanner-helm.natsConfigName" . }}
        {{- end }}
