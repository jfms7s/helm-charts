{{- include "ticket-live-event-scanner-helm.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ticket-scanner-telegram-notifier
  labels:
    {{- include "ticket-live-event-scanner-helm.labels" (dict "context" $ "name" "telegram-notifier" "component" "notifier") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ticket-live-event-scanner-helm.selectorLabels" (dict "context" $ "name" "telegram-notifier") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ticket-live-event-scanner-helm.podLabels" (dict "context" $ "name" "telegram-notifier" "component" "notifier") | nindent 8 }}
      {{- with include "ticket-live-event-scanner-helm.credentialsChecksum" $ }}{{ . | nindent 6 }}{{ end }}
    spec:
      securityContext:
        {{- include "ticket-live-event-scanner-helm.podSecurityContext" . | nindent 8 }}
      automountServiceAccountToken: false
      containers:
        - name: telegram-notifier
          image: {{ .Values.telegramNotifier.image.repository }}:{{ .Values.telegramNotifier.image.tag }}
          imagePullPolicy: {{ .Values.telegramNotifier.image.pullPolicy }}
          securityContext:
            {{- include "ticket-live-event-scanner-helm.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: NATS_URL
              value: nats://{{ .Release.Name }}-ticket-scanner-nats:4222
            - name: TELEGRAM_BOT_TOKEN
              {{- include "ticket-live-event-scanner-helm.credentialEnv" (dict "ctx" $ "key" "TELEGRAM_BOT_TOKEN") | nindent 14 }}
            - name: TELEGRAM_CHAT_ID
              {{- include "ticket-live-event-scanner-helm.credentialEnv" (dict "ctx" $ "key" "TELEGRAM_CHAT_ID") | nindent 14 }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "kill -0 1"
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.telegramNotifier.resources | nindent 12 }}
      restartPolicy: Always
      volumes:
        - name: tmp
          emptyDir: {}
