{{- $claim := .Values.nats.persistence.claim | default dict }}
{{- if $claim.storageClassName }}
{{- if not $claim.size }}
{{- fail "ticket-live-event-scanner-helm: nats.persistence.claim.size is required" }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-ticket-scanner-nats-data
  labels:
    {{- include "ticket-live-event-scanner-helm.labels" (dict "context" $ "name" "nats" "component" "storage") | nindent 4 }}
  annotations:
    # Data outlives the release: never delete on uninstall, prune, or
    # Application deletion. Removing a claim is a deliberate manual step.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ $claim.storageClassName | quote }}
  resources:
    requests:
      storage: {{ $claim.size | quote }}
{{- end }}
