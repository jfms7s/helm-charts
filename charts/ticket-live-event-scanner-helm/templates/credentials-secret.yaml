{{- include "ticket-live-event-scanner-helm.validate" . }}
{{- with include "ticket-live-event-scanner-helm.credentialsSecretData" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ticket-live-event-scanner-helm.credentialsSecretName" $ }}
  labels:
    {{- include "ticket-live-event-scanner-helm.labels" (dict "context" $ "name" "credentials" "component" "credentials") | nindent 4 }}
type: Opaque
data:
  {{- . | trim | nindent 2 }}
{{- end }}
