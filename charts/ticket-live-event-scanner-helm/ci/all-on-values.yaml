# CI-only: turns on every off-by-default branch so kubeconform -strict sees it
# (layered on ci/test-values.yaml by the Makefile's validate loop).
database:
  sqlite:
    allowEmpty: true
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: ticket-scanner.example.local
      paths:
        - path: /
          pathType: Prefix
          port: 80
        - path: /api
          pathType: Prefix
          service: test-release-ticket-scanner-web-ui-api
          port: 80
  tls:
    - secretName: ticket-scanner-tls
      hosts: [ticket-scanner.example.local]
