# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: credentials-in-workloads
templates:
  - templates/email-notifier-deployment.yaml
  - templates/scraper-cronjob.yaml
  - templates/telegram-notifier-deployment.yaml
  - templates/web-ui-api-deployment.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: never inlines a credential given as value into a workload spec
    template: templates/web-ui-api-deployment.yaml
    set:
      turso.authToken.value: s3ntinel
    asserts:
      - notExists:
          path: spec.template.spec.containers[*].env[?(@.value == "s3ntinel")]
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TURSO_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-ticket-scanner-credentials
                key: TURSO_AUTH_TOKEN

  - it: passes a credential's own valueFrom through unchanged
    template: templates/web-ui-api-deployment.yaml
    set:
      turso.authToken.valueFrom.secretKeyRef: {name: my-secret, key: my-key}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TURSO_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: my-key

  - it: annotates email-notifier-deployment with a checksum of only the credentials it reads
    template: templates/email-notifier-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/credentials"]
          value: 3306459d1e28261453ee81d0dad9ff9ef053de0a7619448f845136f6ef4a4e33

  - it: keeps email-notifier-deployment's checksum when an unrelated credential changes
    template: templates/email-notifier-deployment.yaml
    set:
      turso.databaseUrl.value: rotated-elsewhere
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/credentials"]
          value: 3306459d1e28261453ee81d0dad9ff9ef053de0a7619448f845136f6ef4a4e33

  - it: changes email-notifier-deployment's checksum when one of its credentials changes
    template: templates/email-notifier-deployment.yaml
    set:
      smtp.password.value: rotated
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/credentials"]
          value: 8e4de5836bf47fd1f47921d9281b467ba633c36707e33f5e8de5a2d78ed3ade0

  - it: has no credentials checksum on email-notifier-deployment when every credential uses valueFrom
    template: templates/email-notifier-deployment.yaml
    set:
      turso.databaseUrl.valueFrom.secretKeyRef: {name: ext, key: TURSO_DATABASE_URL}
      turso.authToken.valueFrom.secretKeyRef: {name: ext, key: TURSO_AUTH_TOKEN}
      telegram.botToken.valueFrom.secretKeyRef: {name: ext, key: TELEGRAM_BOT_TOKEN}
      telegram.chatId.valueFrom.secretKeyRef: {name: ext, key: TELEGRAM_CHAT_ID}
      smtp.username.valueFrom.secretKeyRef: {name: ext, key: SMTP_USERNAME}
      smtp.password.valueFrom.secretKeyRef: {name: ext, key: SMTP_PASSWORD}
    asserts:
      - notExists:
          path: spec.template.metadata.annotations

  - it: annotates scraper-cronjob with a checksum of only the credentials it reads
    template: templates/scraper-cronjob.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.metadata.annotations["checksum/credentials"]
          value: ff57a3c7db5a27235dd056b67e1f99d252b80cdabb990b83d8472bd683471b5f

  - it: keeps scraper-cronjob's checksum when an unrelated credential changes
    template: templates/scraper-cronjob.yaml
    set:
      telegram.botToken.value: rotated-elsewhere
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.metadata.annotations["checksum/credentials"]
          value: ff57a3c7db5a27235dd056b67e1f99d252b80cdabb990b83d8472bd683471b5f

  - it: changes scraper-cronjob's checksum when one of its credentials changes
    template: templates/scraper-cronjob.yaml
    set:
      turso.authToken.value: rotated
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.metadata.annotations["checksum/credentials"]
          value: 173b997aa5e5da6ed7c5af7385ff9ab64ae2ac67ffe03d844a706df2c9a42723

  - it: has no credentials checksum on scraper-cronjob when every credential uses valueFrom
    template: templates/scraper-cronjob.yaml
    set:
      turso.databaseUrl.valueFrom.secretKeyRef: {name: ext, key: TURSO_DATABASE_URL}
      turso.authToken.valueFrom.secretKeyRef: {name: ext, key: TURSO_AUTH_TOKEN}
      telegram.botToken.valueFrom.secretKeyRef: {name: ext, key: TELEGRAM_BOT_TOKEN}
      telegram.chatId.valueFrom.secretKeyRef: {name: ext, key: TELEGRAM_CHAT_ID}
      smtp.username.valueFrom.secretKeyRef: {name: ext, key: SMTP_USERNAME}
      smtp.password.valueFrom.secretKeyRef: {name: ext, key: SMTP_PASSWORD}
    asserts:
      - notExists:
          path: spec.jobTemplate.spec.template.metadata.annotations

  - it: annotates telegram-notifier-deployment with a checksum of only the credentials it reads
    template: templates/telegram-notifier-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/credentials"]
          value: ec85ea4737cf6383281a7543625d75ac3140e82b91fe01763dbb53ddfc0e5fe5

  - it: keeps telegram-notifier-deployment's checksum when an unrelated credential changes
    template: templates/telegram-notifier-deployment.yaml
    set:
      turso.databaseUrl.value: rotated-elsewhere
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/credentials"]
          value: ec85ea4737cf6383281a7543625d75ac3140e82b91fe01763dbb53ddfc0e5fe5

  - it: changes telegram-notifier-deployment's checksum when one of its credentials changes
    template: templates/telegram-notifier-deployment.yaml
    set:
      telegram.botToken.value: rotated
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/credentials"]
          value: 644311ec1d0850894a9ea04f505af12f615cae5233c2e4e4f07b35ff53d029c5

  - it: has no credentials checksum on telegram-notifier-deployment when every credential uses valueFrom
    template: templates/telegram-notifier-deployment.yaml
    set:
      turso.databaseUrl.valueFrom.secretKeyRef: {name: ext, key: TURSO_DATABASE_URL}
      turso.authToken.valueFrom.secretKeyRef: {name: ext, key: TURSO_AUTH_TOKEN}
      telegram.botToken.valueFrom.secretKeyRef: {name: ext, key: TELEGRAM_BOT_TOKEN}
      telegram.chatId.valueFrom.secretKeyRef: {name: ext, key: TELEGRAM_CHAT_ID}
      smtp.username.valueFrom.secretKeyRef: {name: ext, key: SMTP_USERNAME}
      smtp.password.valueFrom.secretKeyRef: {name: ext, key: SMTP_PASSWORD}
    asserts:
      - notExists:
          path: spec.template.metadata.annotations

  - it: annotates web-ui-api-deployment with a checksum of only the credentials it reads
    template: templates/web-ui-api-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/credentials"]
          value: ff57a3c7db5a27235dd056b67e1f99d252b80cdabb990b83d8472bd683471b5f

  - it: keeps web-ui-api-deployment's checksum when an unrelated credential changes
    template: templates/web-ui-api-deployment.yaml
    set:
      telegram.botToken.value: rotated-elsewhere
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/credentials"]
          value: ff57a3c7db5a27235dd056b67e1f99d252b80cdabb990b83d8472bd683471b5f

  - it: changes web-ui-api-deployment's checksum when one of its credentials changes
    template: templates/web-ui-api-deployment.yaml
    set:
      turso.authToken.value: rotated
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/credentials"]
          value: 173b997aa5e5da6ed7c5af7385ff9ab64ae2ac67ffe03d844a706df2c9a42723

  - it: has no credentials checksum on web-ui-api-deployment when every credential uses valueFrom
    template: templates/web-ui-api-deployment.yaml
    set:
      turso.databaseUrl.valueFrom.secretKeyRef: {name: ext, key: TURSO_DATABASE_URL}
      turso.authToken.valueFrom.secretKeyRef: {name: ext, key: TURSO_AUTH_TOKEN}
      telegram.botToken.valueFrom.secretKeyRef: {name: ext, key: TELEGRAM_BOT_TOKEN}
      telegram.chatId.valueFrom.secretKeyRef: {name: ext, key: TELEGRAM_CHAT_ID}
      smtp.username.valueFrom.secretKeyRef: {name: ext, key: SMTP_USERNAME}
      smtp.password.valueFrom.secretKeyRef: {name: ext, key: SMTP_PASSWORD}
    asserts:
      - notExists:
          path: spec.template.metadata.annotations
