# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: scraper-serviceaccount
templates:
  - templates/scraper-serviceaccount.yaml
tests:
  - it: renders the scraper ServiceAccount
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ticket-scanner-scraper
      - equal:
          path: metadata.labels
          value:
            app.kubernetes.io/name: scraper
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: scraper
            app.kubernetes.io/part-of: ticket-scanner
            app.kubernetes.io/managed-by: Helm
            helm.sh/chart: ticket-live-event-scanner-helm-0.3.0
