# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: scraper-rolebinding
templates:
  - templates/scraper-rolebinding.yaml
tests:
  - it: renders the scraper RoleBinding, wiring the Role to the ServiceAccount
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ticket-scanner-scraper
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: RELEASE-NAME-ticket-scanner-scraper
      - equal:
          path: subjects[0]
          value:
            kind: ServiceAccount
            name: RELEASE-NAME-ticket-scanner-scraper
            namespace: NAMESPACE
