# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
# Render-time credential guard (<chart>.validate): every credential must be
# set through value or valueFrom; empty, null and the CHANGE_ME placeholder fail.
suite: credentials
templates:
  - templates/web-ui-api-deployment.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: fails when telegram.botToken is CHANGE_ME
    template: templates/web-ui-api-deployment.yaml
    set:
      telegram.botToken.value: "CHANGE_ME"
    asserts:
      - failedTemplate:
          errorPattern: "telegram.botToken must be set"
  - it: fails when telegram.botToken is empty
    template: templates/web-ui-api-deployment.yaml
    set:
      telegram.botToken.value: ""
    asserts:
      - failedTemplate:
          errorPattern: "telegram.botToken must be set"
  - it: fails when telegram.botToken is null
    template: templates/web-ui-api-deployment.yaml
    set:
      telegram.botToken: null
    asserts:
      - failedTemplate:
          errorPattern: "telegram.botToken must be set"
  - it: fails when telegram.chatId is CHANGE_ME
    template: templates/web-ui-api-deployment.yaml
    set:
      telegram.chatId.value: "CHANGE_ME"
    asserts:
      - failedTemplate:
          errorPattern: "telegram.chatId must be set"
  - it: fails when telegram.chatId is empty
    template: templates/web-ui-api-deployment.yaml
    set:
      telegram.chatId.value: ""
    asserts:
      - failedTemplate:
          errorPattern: "telegram.chatId must be set"
  - it: fails when telegram.chatId is null
    template: templates/web-ui-api-deployment.yaml
    set:
      telegram.chatId: null
    asserts:
      - failedTemplate:
          errorPattern: "telegram.chatId must be set"
  - it: fails when smtp.username is CHANGE_ME
    template: templates/web-ui-api-deployment.yaml
    set:
      smtp.username.value: "CHANGE_ME"
    asserts:
      - failedTemplate:
          errorPattern: "smtp.username must be set"
  - it: fails when smtp.username is empty
    template: templates/web-ui-api-deployment.yaml
    set:
      smtp.username.value: ""
    asserts:
      - failedTemplate:
          errorPattern: "smtp.username must be set"
  - it: fails when smtp.username is null
    template: templates/web-ui-api-deployment.yaml
    set:
      smtp.username: null
    asserts:
      - failedTemplate:
          errorPattern: "smtp.username must be set"
  - it: fails when smtp.password is CHANGE_ME
    template: templates/web-ui-api-deployment.yaml
    set:
      smtp.password.value: "CHANGE_ME"
    asserts:
      - failedTemplate:
          errorPattern: "smtp.password must be set"
  - it: fails when smtp.password is empty
    template: templates/web-ui-api-deployment.yaml
    set:
      smtp.password.value: ""
    asserts:
      - failedTemplate:
          errorPattern: "smtp.password must be set"
  - it: fails when smtp.password is null
    template: templates/web-ui-api-deployment.yaml
    set:
      smtp.password: null
    asserts:
      - failedTemplate:
          errorPattern: "smtp.password must be set"
  - it: fails when smtp.from is CHANGE_ME
    template: templates/web-ui-api-deployment.yaml
    set:
      smtp.from: "CHANGE_ME"
    asserts:
      - failedTemplate:
          errorPattern: "smtp.from must be set"
  - it: fails when smtp.from is empty
    template: templates/web-ui-api-deployment.yaml
    set:
      smtp.from: ""
    asserts:
      - failedTemplate:
          errorPattern: "smtp.from must be set"
  - it: fails when smtp.from is null
    template: templates/web-ui-api-deployment.yaml
    set:
      smtp.from: null
    asserts:
      - failedTemplate:
          errorPattern: "smtp.from must be set"
  - it: fails when smtp.to is CHANGE_ME
    template: templates/web-ui-api-deployment.yaml
    set:
      smtp.to: "CHANGE_ME"
    asserts:
      - failedTemplate:
          errorPattern: "smtp.to must be set"
  - it: fails when smtp.to is empty
    template: templates/web-ui-api-deployment.yaml
    set:
      smtp.to: ""
    asserts:
      - failedTemplate:
          errorPattern: "smtp.to must be set"
  - it: fails when smtp.to is null
    template: templates/web-ui-api-deployment.yaml
    set:
      smtp.to: null
    asserts:
      - failedTemplate:
          errorPattern: "smtp.to must be set"
  - it: web-ui-api-deployment.yaml refuses to render with a placeholder credential
    template: templates/web-ui-api-deployment.yaml
    set:
      telegram.botToken.value: "CHANGE_ME"
    asserts:
      - failedTemplate:
          errorPattern: "telegram.botToken must be set"
  - it: web-ui-api-deployment.yaml renders with every credential given as valueFrom only
    template: templates/web-ui-api-deployment.yaml
    set:
      telegram.botToken.value: ""
      telegram.botToken.valueFrom.secretKeyRef.name: s
      telegram.botToken.valueFrom.secretKeyRef.key: bottoken
      telegram.chatId.value: ""
      telegram.chatId.valueFrom.secretKeyRef.name: s
      telegram.chatId.valueFrom.secretKeyRef.key: chatid
      smtp.username.value: ""
      smtp.username.valueFrom.secretKeyRef.name: s
      smtp.username.valueFrom.secretKeyRef.key: username
      smtp.password.value: ""
      smtp.password.valueFrom.secretKeyRef.name: s
      smtp.password.valueFrom.secretKeyRef.key: password
    asserts:
      - notFailedTemplate: {}
  - it: fails when a credential is whitespace only
    template: templates/web-ui-api-deployment.yaml
    set:
      telegram.botToken.value: "   "
    asserts:
      - failedTemplate:
          errorPattern: "telegram.botToken must be set"
  - it: fails when a scalar is whitespace only
    template: templates/web-ui-api-deployment.yaml
    set:
      smtp.to: "  "
    asserts:
      - failedTemplate:
          errorPattern: "smtp.to must be set"
