# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: nats-service
templates:
  - templates/nats-service.yaml
tests:
  - it: renders the nats Service
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ticket-scanner-nats
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: message-bus
      - equal:
          path: spec.ports[0]
          value:
            name: client
            port: 4222
            targetPort: 4222
            protocol: TCP
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: nats
            app.kubernetes.io/instance: RELEASE-NAME
