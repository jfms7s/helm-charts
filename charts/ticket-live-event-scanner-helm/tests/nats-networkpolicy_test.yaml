# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: nats-networkpolicy
templates:
  - templates/nats-networkpolicy.yaml
values:
  - ../ci/test-values.yaml
chart:
  version: 0.0.0-test
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: limits NATS ingress to 4222 from this release's bus clients
    set:
      networkPolicy.enabled: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ticket-scanner-nats
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: nats
            app.kubernetes.io/instance: RELEASE-NAME
      - equal:
          path: spec.policyTypes
          value: [Ingress]
      - equal:
          path: spec.ingress
          value:
            - from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/instance: RELEASE-NAME
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values: [scraper, telegram-notifier, email-notifier, web-ui-api]
              ports:
                - protocol: TCP
                  port: 4222
