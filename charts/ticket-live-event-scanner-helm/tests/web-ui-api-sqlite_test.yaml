# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: web-ui-api-sqlite
templates:
  - templates/web-ui-api-deployment.yaml
  - templates/web-ui-api-pvc.yaml
values:
  - ../ci/test-values.yaml
chart:
  version: 0.0.0-test
tests:
  - it: owns the file on a Recreate pod with the volume mounted
    template: templates/web-ui-api-deployment.yaml
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_PATH
            value: /data/ticket-scanner.db
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /data
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim:
              claimName: RELEASE-NAME-ticket-scanner-web-ui-api-data
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "DATABASE_ALLOW_EMPTY")]

  - it: holds the first start open while the database is opened and migrated
    template: templates/web-ui-api-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30

  - it: creates the claim and keeps it
    template: templates/web-ui-api-pvc.yaml
    set:
      database.sqlite.claim: {storageClassName: iscsi, size: 1Gi}
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ticket-scanner-web-ui-api-data
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: Prune=false,Delete=false
      - equal:
          path: spec.storageClassName
          value: iscsi
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi

  - it: uses an existing claim and creates none
    set:
      database.sqlite.existingClaim: mine
    asserts:
      - hasDocuments:
          count: 0
        template: templates/web-ui-api-pvc.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim:
              claimName: mine
        template: templates/web-ui-api-deployment.yaml

  - it: marks a fresh install as allowed to start empty
    template: templates/web-ui-api-deployment.yaml
    set:
      database.sqlite.allowEmpty: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_ALLOW_EMPTY
            value: "true"

  - it: refuses a database without a volume
    template: templates/web-ui-api-pvc.yaml
    set:
      database.sqlite.claim: {storageClassName: "", size: ""}
    asserts:
      - failedTemplate:
          errorPattern: "the SQLite database needs a volume"

  - it: refuses a chart-created claim without a size
    template: templates/web-ui-api-pvc.yaml
    set:
      database.sqlite.claim: {storageClassName: iscsi, size: ""}
    asserts:
      - failedTemplate:
          errorPattern: "database.sqlite.claim.size is required"
