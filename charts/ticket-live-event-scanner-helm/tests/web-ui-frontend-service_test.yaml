# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: web-ui-frontend-service
templates:
  - templates/web-ui-frontend-service.yaml
tests:
  - it: renders the web-ui-frontend Service
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ticket-scanner-web-ui-frontend
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: frontend
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0]
          value:
            name: http
            port: 80
            targetPort: 3000
            protocol: TCP
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: web-ui-frontend
            app.kubernetes.io/instance: RELEASE-NAME
