# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: web-ui-frontend-ingress
templates:
  - templates/web-ui-frontend-ingress.yaml
tests:
  - it: does not render when disabled by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the default host and path when enabled
    set:
      ingress.enabled: true
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ticket-scanner-web-ui-frontend
      - equal:
          path: spec.rules[0].host
          value: ticket-scanner.example.local
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Prefix
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-ticket-scanner-web-ui-frontend
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 80
      - notExists:
          path: spec.ingressClassName
      - notExists:
          path: spec.tls

  - it: sets the ingress class name when provided
    set:
      ingress.enabled: true
      ingress.className: traefik
    asserts:
      - equal:
          path: spec.ingressClassName
          value: traefik

  - it: renders annotations as quoted strings
    set:
      ingress.enabled: true
      ingress.annotations:
        traefik.ingress.kubernetes.io/rewrite-target: "/"
    asserts:
      - equal:
          path: metadata.annotations["traefik.ingress.kubernetes.io/rewrite-target"]
          value: "/"

  - it: renders tls hosts and secretName when provided
    set:
      ingress.enabled: true
      ingress.tls:
        - secretName: ticket-scanner-tls
          hosts:
            - ticket-scanner.example.local
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: ticket-scanner-tls
      - equal:
          path: spec.tls[0].hosts[0]
          value: ticket-scanner.example.local

  - it: falls back to the default backend port when a path omits it
    set:
      ingress.enabled: true
      ingress.hosts:
        - host: ticket-scanner.example.local
          paths:
            - path: /
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 80

  - it: routes a path to a different service when service is set
    # e.g. exposing web-ui-api under /api on the same host as the frontend.
    set:
      ingress.enabled: true
      ingress.hosts:
        - host: ticket-scanner.example.local
          paths:
            - path: /
              port: 80
            - path: /api
              service: RELEASE-NAME-ticket-scanner-web-ui-api
              port: 80
    asserts:
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 2
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-ticket-scanner-web-ui-frontend
      - equal:
          path: spec.rules[0].http.paths[1].path
          value: /api
      - equal:
          path: spec.rules[0].http.paths[1].backend.service.name
          value: RELEASE-NAME-ticket-scanner-web-ui-api
