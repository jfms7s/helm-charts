# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: scraper-cronjob
templates:
  - templates/scraper-cronjob.yaml
tests:
  - it: renders with chart defaults
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ticket-scanner-scraper
      - equal:
          path: metadata.labels
          value:
            app.kubernetes.io/name: scraper
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: scraper
            app.kubernetes.io/part-of: ticket-scanner
            app.kubernetes.io/managed-by: Helm
            helm.sh/chart: ticket-live-event-scanner-helm-0.1.0
      - equal:
          path: spec.schedule
          value: "0 * * * *"
      - equal:
          path: spec.jobTemplate.spec.backoffLimit
          value: 2
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: RELEASE-NAME-ticket-scanner-scraper
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: ghcr.io/jfms7s/ticket-live-event-scanner-scraper:latest
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: TICKETLINE_HUB_PAGES
            value: "auchan-live-academia-maia-98164,auchan-live-academia-aveiro-98167"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: NATS_URL
            value: nats://RELEASE-NAME-ticket-scanner-nats:4222
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: TURSO_DATABASE_URL
            value: "CHANGE_ME"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: TURSO_AUTH_TOKEN
            value: "CHANGE_ME"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: REQUEST_DELAY_MS
            value: "1500"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      - equal:
          path: spec.jobTemplate.spec.template.spec.restartPolicy
          value: OnFailure

  - it: sources TURSO_DATABASE_URL/TURSO_AUTH_TOKEN from their valueFrom when set, taking precedence over the value default
    set:
      turso.databaseUrl.valueFrom.secretKeyRef.name: turso-credentials
      turso.databaseUrl.valueFrom.secretKeyRef.key: database_url
      turso.authToken.valueFrom.secretKeyRef.name: turso-credentials
      turso.authToken.valueFrom.secretKeyRef.key: auth_token
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: TURSO_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: turso-credentials
                key: database_url
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: TURSO_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: turso-credentials
                key: auth_token

  - it: uses a custom schedule and image
    set:
      scraper.schedule: "*/30 * * * *"
      scraper.image.repository: my-registry/scraper
      scraper.image.tag: "1.2.3"
    asserts:
      - equal:
          path: spec.schedule
          value: "*/30 * * * *"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: my-registry/scraper:1.2.3
