# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: email-notifier-deployment
templates:
  - templates/email-notifier-deployment.yaml
tests:
  - it: renders with chart defaults
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ticket-scanner-email-notifier
      - equal:
          path: metadata.labels
          value:
            app.kubernetes.io/name: email-notifier
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: notifier
            app.kubernetes.io/part-of: ticket-scanner
            app.kubernetes.io/managed-by: Helm
            helm.sh/chart: ticket-live-event-scanner-helm-0.3.0
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/jfms7s/ticket-live-event-scanner-email-notifier:latest
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NATS_URL
            value: nats://RELEASE-NAME-ticket-scanner-nats:4222
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_HOST
            value: "smtp.gmail.com"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_PORT
            value: "587"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_USERNAME
            value: "CHANGE_ME"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_PASSWORD
            value: "CHANGE_ME"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMAIL_FROM
            value: "CHANGE_ME"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMAIL_TO
            value: "CHANGE_ME"
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value:
            - sh
            - -c
            - "kill -0 1"
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      - equal:
          path: spec.template.spec.restartPolicy
          value: Always

  - it: sources SMTP_USERNAME/SMTP_PASSWORD from their valueFrom when set, taking precedence over the value default
    set:
      smtp.username.valueFrom.secretKeyRef.name: smtp-credentials
      smtp.username.valueFrom.secretKeyRef.key: username
      smtp.password.valueFrom.secretKeyRef.name: smtp-credentials
      smtp.password.valueFrom.secretKeyRef.key: password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_USERNAME
            valueFrom:
              secretKeyRef:
                name: smtp-credentials
                key: username
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: smtp-credentials
                key: password

  - it: honors overridden smtp host/port/from/to
    set:
      smtp.host: "smtp.example.com"
      smtp.port: 465
      smtp.from: "notifier@example.com"
      smtp.to: "you@example.com"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_HOST
            value: "smtp.example.com"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_PORT
            value: "465"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMAIL_FROM
            value: "notifier@example.com"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMAIL_TO
            value: "you@example.com"
