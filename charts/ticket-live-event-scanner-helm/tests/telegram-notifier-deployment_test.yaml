# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: telegram-notifier-deployment
templates:
  - templates/telegram-notifier-deployment.yaml
values:
  - ../ci/test-values.yaml
# Pin the chart version so a version bump needs no test edit.
chart:
  version: 0.0.0-test
tests:
  - it: renders with chart defaults
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ticket-scanner-telegram-notifier
      - equal:
          path: metadata.labels
          value:
            app.kubernetes.io/name: telegram-notifier
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: notifier
            app.kubernetes.io/part-of: ticket-scanner
            app.kubernetes.io/managed-by: Helm
            helm.sh/chart: ticket-live-event-scanner-helm-0.0.0-test
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/jfms7s/ticket-live-event-scanner-telegram-notifier:latest
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NATS_URL
            value: nats://RELEASE-NAME-ticket-scanner-nats:4222
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TELEGRAM_BOT_TOKEN
            value: "test-bot-token-not-real"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TELEGRAM_CHAT_ID
            value: "123456"
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value:
            - sh
            - -c
            - "kill -0 1"
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      - equal:
          path: spec.template.spec.restartPolicy
          value: Always

  - it: sources TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID from their valueFrom when set, taking precedence over the value default
    set:
      telegram.botToken.valueFrom.secretKeyRef.name: telegram-bot-token
      telegram.botToken.valueFrom.secretKeyRef.key: bot_token
      telegram.chatId.valueFrom.secretKeyRef.name: telegram-bot-token
      telegram.chatId.valueFrom.secretKeyRef.key: chat_id
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TELEGRAM_BOT_TOKEN
            valueFrom:
              secretKeyRef:
                name: telegram-bot-token
                key: bot_token
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TELEGRAM_CHAT_ID
            valueFrom:
              secretKeyRef:
                name: telegram-bot-token
                key: chat_id

  # Credential guard (<chart>.validate): this template refuses to render alone
  # with a placeholder credential, and renders with valueFrom only.
  - it: telegram-notifier-deployment.yaml refuses to render with a placeholder credential
    set:
      turso.databaseUrl.value: "CHANGE_ME"
    asserts:
      - failedTemplate:
          errorPattern: "turso.databaseUrl must be set"
  - it: telegram-notifier-deployment.yaml renders with every credential given as valueFrom only
    set:
      turso.databaseUrl.value: ""
      turso.databaseUrl.valueFrom.secretKeyRef.name: s
      turso.databaseUrl.valueFrom.secretKeyRef.key: databaseurl
      turso.authToken.value: ""
      turso.authToken.valueFrom.secretKeyRef.name: s
      turso.authToken.valueFrom.secretKeyRef.key: authtoken
      telegram.botToken.value: ""
      telegram.botToken.valueFrom.secretKeyRef.name: s
      telegram.botToken.valueFrom.secretKeyRef.key: bottoken
      telegram.chatId.value: ""
      telegram.chatId.valueFrom.secretKeyRef.name: s
      telegram.chatId.valueFrom.secretKeyRef.key: chatid
      smtp.username.value: ""
      smtp.username.valueFrom.secretKeyRef.name: s
      smtp.username.valueFrom.secretKeyRef.key: username
      smtp.password.value: ""
      smtp.password.valueFrom.secretKeyRef.name: s
      smtp.password.valueFrom.secretKeyRef.key: password
    asserts:
      - notFailedTemplate: {}
