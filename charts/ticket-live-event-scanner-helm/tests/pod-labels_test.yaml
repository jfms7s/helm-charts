# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
# Pod templates never carry helm.sh/chart (or any other chart-version-derived
# label): a chart release that does not change a workload's spec must not
# restart its pods. Top-level metadata keeps the full label set.
suite: pod-labels
templates:
  - templates/nats-deployment.yaml
  - templates/telegram-notifier-deployment.yaml
  - templates/email-notifier-deployment.yaml
  - templates/web-ui-api-deployment.yaml
  - templates/web-ui-frontend-deployment.yaml
  - templates/scraper-cronjob.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: nats-deployment.yaml pod template has no chart label
    template: templates/nats-deployment.yaml
    asserts:
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.template.metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.template.metadata.labels["app.kubernetes.io/version"]
      - isSubset:
          path: spec.template.metadata.labels
          content:
            app.kubernetes.io/instance: RELEASE-NAME
  - it: telegram-notifier-deployment.yaml pod template has no chart label
    template: templates/telegram-notifier-deployment.yaml
    asserts:
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.template.metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.template.metadata.labels["app.kubernetes.io/version"]
      - isSubset:
          path: spec.template.metadata.labels
          content:
            app.kubernetes.io/instance: RELEASE-NAME
  - it: email-notifier-deployment.yaml pod template has no chart label
    template: templates/email-notifier-deployment.yaml
    asserts:
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.template.metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.template.metadata.labels["app.kubernetes.io/version"]
      - isSubset:
          path: spec.template.metadata.labels
          content:
            app.kubernetes.io/instance: RELEASE-NAME
  - it: web-ui-api-deployment.yaml pod template has no chart label
    template: templates/web-ui-api-deployment.yaml
    asserts:
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.template.metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.template.metadata.labels["app.kubernetes.io/version"]
      - isSubset:
          path: spec.template.metadata.labels
          content:
            app.kubernetes.io/instance: RELEASE-NAME
  - it: web-ui-frontend-deployment.yaml pod template has no chart label
    template: templates/web-ui-frontend-deployment.yaml
    asserts:
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.template.metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.template.metadata.labels["app.kubernetes.io/version"]
      - isSubset:
          path: spec.template.metadata.labels
          content:
            app.kubernetes.io/instance: RELEASE-NAME
  - it: scraper-cronjob.yaml job pod template has no chart label
    template: templates/scraper-cronjob.yaml
    asserts:
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.jobTemplate.spec.template.metadata.labels["helm.sh/chart"]
      - isSubset:
          path: spec.jobTemplate.spec.template.metadata.labels
          content:
            app.kubernetes.io/instance: RELEASE-NAME
