# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: credentials-secret
templates:
  - templates/credentials-secret.yaml
values:
  - ../ci/test-values.yaml
chart:
  version: 0.0.0-test
tests:
  - it: holds every credential given as value, base64-encoded
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ticket-scanner-credentials
      - equal:
          path: type
          value: Opaque
      - equal:
          path: data
          value:
            SMTP_PASSWORD: dGVzdC1zbXRwLXBhc3N3b3JkLW5vdC1yZWFs
            SMTP_USERNAME: c2VuZGVyQGV4YW1wbGUuY29t
            TELEGRAM_BOT_TOKEN: dGVzdC1ib3QtdG9rZW4tbm90LXJlYWw=
            TELEGRAM_CHAT_ID: MTIzNDU2
            TURSO_AUTH_TOKEN: dGVzdC1hdXRoLXRva2VuLW5vdC1yZWFs
            TURSO_DATABASE_URL: aHR0cDovL3Rlc3QtbGlic3FsOjgwODA=

  - it: leaves out a credential given as valueFrom
    set:
      turso.authToken.valueFrom.secretKeyRef: {name: ext, key: k}
    asserts:
      - notExists:
          path: data.TURSO_AUTH_TOKEN

  - it: renders no Secret when every credential uses valueFrom
    set:
      turso.databaseUrl.valueFrom.secretKeyRef: {name: ext, key: TURSO_DATABASE_URL}
      turso.authToken.valueFrom.secretKeyRef: {name: ext, key: TURSO_AUTH_TOKEN}
      telegram.botToken.valueFrom.secretKeyRef: {name: ext, key: TELEGRAM_BOT_TOKEN}
      telegram.chatId.valueFrom.secretKeyRef: {name: ext, key: TELEGRAM_CHAT_ID}
      smtp.username.valueFrom.secretKeyRef: {name: ext, key: SMTP_USERNAME}
      smtp.password.valueFrom.secretKeyRef: {name: ext, key: SMTP_PASSWORD}
    asserts:
      - hasDocuments:
          count: 0

  - it: stores an integer chat ID as digits, not in exponent form
    values:
      - ../ci/test-values.yaml
      - ../ci/int-chat-id-values.yaml
    asserts:
      - equal:
          path: data.TELEGRAM_CHAT_ID
          value: LTEwMDEyMzQ1Njc4OTA=
