# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: web-ui-api-deployment
templates:
  - templates/web-ui-api-deployment.yaml
values:
  - ../ci/test-values.yaml
# Pin the chart version so a version bump needs no test edit.
chart:
  version: 0.0.0-test
tests:
  - it: renders with chart defaults, always at 1 replica
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ticket-scanner-web-ui-api
      - equal:
          path: metadata.labels
          value:
            app.kubernetes.io/name: web-ui-api
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: api
            app.kubernetes.io/part-of: ticket-scanner
            app.kubernetes.io/managed-by: Helm
            helm.sh/chart: ticket-live-event-scanner-helm-0.0.0-test
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/jfms7s/ticket-live-event-scanner-web-ui-api:latest
      - equal:
          path: spec.template.spec.containers[0].ports[0]
          value:
            name: http
            containerPort: 8080
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NATS_URL
            value: nats://RELEASE-NAME-ticket-scanner-nats:4222
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TURSO_DATABASE_URL
            value: "http://test-libsql:8080"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TURSO_AUTH_TOKEN
            value: "test-auth-token-not-real"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LISTEN_ADDR
            value: ":8080"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CORS_ORIGIN
            value: "*"
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      - equal:
          path: spec.template.spec.restartPolicy
          value: Always

  - it: sources TURSO_DATABASE_URL/TURSO_AUTH_TOKEN from their valueFrom when set, taking precedence over the value default
    set:
      turso.databaseUrl.valueFrom.secretKeyRef.name: turso-credentials
      turso.databaseUrl.valueFrom.secretKeyRef.key: database_url
      turso.authToken.valueFrom.secretKeyRef.name: turso-credentials
      turso.authToken.valueFrom.secretKeyRef.key: auth_token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TURSO_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: turso-credentials
                key: database_url
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TURSO_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: turso-credentials
                key: auth_token

  - it: uses a custom CORS origin
    set:
      webUiApi.corsOrigin: "https://ticket-scanner.example.com"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CORS_ORIGIN
            value: "https://ticket-scanner.example.com"

  - it: defaults CORS_ORIGIN to the first ingress host when the ingress is on
    set:
      ingress.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CORS_ORIGIN
            value: "https://ticket-scanner.example.local"

  - it: lets an explicit corsOrigin win over the ingress-derived origin
    set:
      ingress.enabled: true
      webUiApi.corsOrigin: "https://other.example.com"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CORS_ORIGIN
            value: "https://other.example.com"

  - it: falls back to "*" with the ingress on but no host
    set:
      ingress.enabled: true
      ingress.hosts: []
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CORS_ORIGIN
            value: "*"

  # Credential guard (<chart>.validate): this template refuses to render alone
  # with a placeholder credential, and renders with valueFrom only.
  - it: web-ui-api-deployment.yaml refuses to render with a placeholder credential
    set:
      turso.databaseUrl.value: "CHANGE_ME"
    asserts:
      - failedTemplate:
          errorPattern: "turso.databaseUrl must be set"
  - it: web-ui-api-deployment.yaml renders with every credential given as valueFrom only
    set:
      turso.databaseUrl.value: ""
      turso.databaseUrl.valueFrom.secretKeyRef.name: s
      turso.databaseUrl.valueFrom.secretKeyRef.key: databaseurl
      turso.authToken.value: ""
      turso.authToken.valueFrom.secretKeyRef.name: s
      turso.authToken.valueFrom.secretKeyRef.key: authtoken
      telegram.botToken.value: ""
      telegram.botToken.valueFrom.secretKeyRef.name: s
      telegram.botToken.valueFrom.secretKeyRef.key: bottoken
      telegram.chatId.value: ""
      telegram.chatId.valueFrom.secretKeyRef.name: s
      telegram.chatId.valueFrom.secretKeyRef.key: chatid
      smtp.username.value: ""
      smtp.username.valueFrom.secretKeyRef.name: s
      smtp.username.valueFrom.secretKeyRef.key: username
      smtp.password.value: ""
      smtp.password.valueFrom.secretKeyRef.name: s
      smtp.password.valueFrom.secretKeyRef.key: password
    asserts:
      - notFailedTemplate: {}
