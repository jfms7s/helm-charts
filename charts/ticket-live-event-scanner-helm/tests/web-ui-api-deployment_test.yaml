# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: web-ui-api-deployment
templates:
  - templates/web-ui-api-deployment.yaml
values:
  - ../ci/test-values.yaml
# Pin the chart version so a version bump needs no test edit.
chart:
  version: 0.0.0-test
tests:
  - it: renders with chart defaults, always at 1 replica
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ticket-scanner-web-ui-api
      - equal:
          path: metadata.labels
          value:
            app.kubernetes.io/name: web-ui-api
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: api
            app.kubernetes.io/part-of: ticket-scanner
            app.kubernetes.io/managed-by: Helm
            helm.sh/chart: ticket-live-event-scanner-helm-0.0.0-test
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/jfms7s/ticket-live-event-scanner-web-ui-api:latest
      - equal:
          path: spec.template.spec.containers[0].ports[0]
          value:
            name: http
            containerPort: 8080
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_PATH
            value: /data/ticket-scanner.db
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LISTEN_ADDR
            value: ":8080"
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: CORS_ORIGIN
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 256Mi
      - equal:
          path: spec.template.spec.restartPolicy
          value: Always

  - it: passes the Telegram and email notifier credentials and settings to this container
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TELEGRAM_BOT_TOKEN
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-ticket-scanner-credentials
                key: TELEGRAM_BOT_TOKEN
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TELEGRAM_CHAT_ID
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-ticket-scanner-credentials
                key: TELEGRAM_CHAT_ID
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-ticket-scanner-credentials
                key: SMTP_PASSWORD
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMAIL_TO
            value: recipient@example.com
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name == "SMTP_HOST")]

  - it: runs the scraper and the digest with the chart's scraper settings
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TICKETLINE_HUB_PAGES
            value: "auchan-live-academia-maia-98164,auchan-live-academia-aveiro-98167"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REQUEST_DELAY_MS
            value: "1500"
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name == "USER_AGENT")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "SCRAPER_ENABLED")]

  - it: turns the scraper and digest off with scraper.enabled false
    set:
      scraper.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCRAPER_ENABLED
            value: "false"

  - it: uses a custom CORS origin
    set:
      webUiApi.corsOrigin: "https://ticket-scanner.example.com"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CORS_ORIGIN
            value: "https://ticket-scanner.example.com"

  - it: sets no CORS_ORIGIN by default, even with the ingress on
    set:
      ingress.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: CORS_ORIGIN

  # Credential guard (<chart>.validate): this template refuses to render alone
  # with a placeholder credential, and renders with valueFrom only.
  - it: web-ui-api-deployment.yaml refuses to render with a placeholder credential
    set:
      telegram.botToken.value: "CHANGE_ME"
    asserts:
      - failedTemplate:
          errorPattern: "telegram.botToken must be set"
  - it: web-ui-api-deployment.yaml renders with every credential given as valueFrom only
    set:
      telegram.botToken.value: ""
      telegram.botToken.valueFrom.secretKeyRef.name: s
      telegram.botToken.valueFrom.secretKeyRef.key: bottoken
      telegram.chatId.value: ""
      telegram.chatId.valueFrom.secretKeyRef.name: s
      telegram.chatId.valueFrom.secretKeyRef.key: chatid
      smtp.username.value: ""
      smtp.username.valueFrom.secretKeyRef.name: s
      smtp.username.valueFrom.secretKeyRef.key: username
      smtp.password.value: ""
      smtp.password.valueFrom.secretKeyRef.name: s
      smtp.password.valueFrom.secretKeyRef.key: password
    asserts:
      - notFailedTemplate: {}
