# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: scraper-digest-cronjob
templates:
  - templates/scraper-digest-cronjob.yaml
values:
  - ../ci/test-values.yaml
chart:
  version: 0.0.0-test
tests:
  - it: is off by default
    asserts:
      - hasDocuments:
          count: 0
  - it: runs the scraper image with --digest on Sunday 19:00 Lisbon, never retried
    set:
      scraper.digest.enabled: true
      scraper.image.tag: v0.6.0
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ticket-scanner-digest
      - equal:
          path: spec.schedule
          value: "0 19 * * 0"
      - equal:
          path: spec.timeZone
          value: Europe/Lisbon
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid
      - equal:
          path: spec.jobTemplate.spec.backoffLimit
          value: 0
      - equal:
          path: spec.jobTemplate.spec.template.spec.restartPolicy
          value: Never
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: ghcr.io/jfms7s/ticket-live-event-scanner-scraper:v0.6.0
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          value: ["--digest"]
      # The NATS NetworkPolicy admits pods named scraper.
      - equal:
          path: spec.jobTemplate.spec.template.metadata.labels["app.kubernetes.io/name"]
          value: scraper
      - equal:
          path: spec.jobTemplate.spec.template.metadata.labels["app.kubernetes.io/component"]
          value: digest
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: TICKETLINE_HUB_PAGES
            value: "auchan-live-academia-maia-98164,auchan-live-academia-aveiro-98167"
  - it: takes another schedule and zone
    set:
      scraper.digest.enabled: true
      scraper.digest.schedule: "0 9 * * 1"
      scraper.digest.timeZone: ""
    asserts:
      - equal:
          path: spec.schedule
          value: "0 9 * * 1"
      - notExists:
          path: spec.timeZone
