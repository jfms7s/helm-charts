# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: web-ui-api-servicemonitor
templates:
  - templates/web-ui-api-servicemonitor.yaml
values:
  - ../ci/test-values.yaml
release:
  name: ticket-live-event-scanner
  namespace: ticket-scanner
chart:
  version: 0.0.0-test
tests:
  - it: is off by default
    asserts:
      - hasDocuments:
          count: 0
  - it: scrapes web-ui-api's /metrics on its http port in its own namespace
    set:
      webUiApi.metrics.serviceMonitor.enabled: true
      webUiApi.metrics.serviceMonitor.labels: {release: kps}
    asserts:
      - isKind:
          of: ServiceMonitor
      - equal:
          path: metadata.name
          value: ticket-live-event-scanner-ticket-scanner-web-ui-api
      - equal:
          path: metadata.labels.release
          value: kps
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: web-ui-api
            app.kubernetes.io/instance: ticket-live-event-scanner
      - equal:
          path: spec.namespaceSelector.matchNames
          value: [ticket-scanner]
      - equal:
          path: spec.endpoints
          value: [{port: http, path: /metrics, interval: 60s}]
