# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: postgres-deployment
templates:
  - templates/postgres-deployment.yaml
values:
  - ../ci/test-values.yaml
release:
  name: meiun
tests:
  - it: runs one pgvector Postgres on its claim, Recreate, mounted on /var/lib/postgresql at subPath data
    asserts:
      - equal:
          path: metadata.name
          value: meiun-postgres
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/pgvector/pgvector:pg18
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0]
          value: {name: data, mountPath: /var/lib/postgresql, subPath: data}
      - equal:
          path: spec.template.spec.volumes[0]
          value: {name: data, persistentVolumeClaim: {claimName: meiun-postgres-data}}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: POSTGRES_USER, value: meiun}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: POSTGRES_PASSWORD, value: test-postgres-password}
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: [ALL]
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            exec: {command: [pg_isready, -U, meiun, -d, meiun]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

  - it: renders nothing when the in-chart Postgres is off
    set:
      postgres.enabled: false
      database.url: postgres://meiun:pw@db.example.test:5432/meiun
    asserts:
      - hasDocuments:
          count: 0

  - it: refuses an emptyDir (the villages would not survive a restart)
    set:
      postgres.persistence.volume: {emptyDir: {}}
    asserts:
      - failedTemplate:
          errorPattern: "postgres.persistence.volume must be persistent storage, not emptyDir"
