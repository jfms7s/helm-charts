apiVersion: v1
kind: Service
metadata:
  name: {{ include "meiun-helm.fullname" . }}-web
  labels:
    {{- include "meiun-helm.labels" (dict "context" $ "name" "web" "component" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "meiun-helm.selectorLabels" (dict "context" $ "name" "web") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
