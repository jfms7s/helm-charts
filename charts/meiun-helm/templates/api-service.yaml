apiVersion: v1
kind: Service
metadata:
  name: {{ include "meiun-helm.fullname" . }}-api
  labels:
    {{- include "meiun-helm.labels" (dict "context" $ "name" "api" "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "meiun-helm.selectorLabels" (dict "context" $ "name" "api") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
