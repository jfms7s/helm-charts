{{- if .Values.ingress.enabled }}
{{- include "meiun-helm.validate" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "meiun-helm.fullname" . }}
  labels:
    {{- include "meiun-helm.labels" (dict "context" $ "name" "web" "component" "ingress") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  # One host, one origin (the app sets no CORS headers): the API's paths to the API, the rest to the PWA. Prefix
  # matching is per path segment, so /api never catches /apiary. The metrics port is on no path.
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /trpc
            pathType: Prefix
            backend:
              service:
                name: {{ include "meiun-helm.fullname" . }}-api
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "meiun-helm.fullname" . }}-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "meiun-helm.fullname" . }}-web
                port:
                  name: http
{{- end }}
