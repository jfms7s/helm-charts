# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: backup-pvc
templates:
  - templates/backup-pvc.yaml
release:
  name: eng-metrics-lab
tests:
  - it: keeps the NFS backup claim on uninstall
    asserts:
      - equal: {path: metadata.name, value: eng-metrics-lab-backup}
      - equal: {path: "metadata.annotations[\"helm.sh/resource-policy\"]", value: keep}
      - equal: {path: spec.storageClassName, value: nfs-client}
      - equal: {path: spec.resources.requests.storage, value: 1Gi}

  - it: renders nothing when an existing claim is named
    set:
      backup.persistence.claim: my-claim
    asserts:
      - hasDocuments: {count: 0}
