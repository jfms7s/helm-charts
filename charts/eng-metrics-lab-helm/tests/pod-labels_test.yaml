# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
# Pod templates never carry helm.sh/chart (or any other chart-version-derived
# label): a chart release that does not change a workload's spec must not
# restart its pods. Top-level metadata keeps the full label set.
suite: pod-labels
templates:
  - templates/postgres-deployment.yaml
  - templates/migrate-job.yaml
  - templates/collector-cronjob.yaml
  - templates/hotspots-cronjob.yaml
  - templates/backup-cronjob.yaml
set:
  hotspots.repos: [a/b]
tests:
  - it: postgres-deployment.yaml pod template has no chart label
    template: templates/postgres-deployment.yaml
    asserts:
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.template.metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.template.metadata.labels["app.kubernetes.io/version"]
      - isSubset:
          path: spec.template.metadata.labels
          content:
            app.kubernetes.io/instance: RELEASE-NAME
  - it: migrate-job.yaml pod template has no chart label
    template: templates/migrate-job.yaml
    asserts:
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.template.metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.template.metadata.labels["app.kubernetes.io/version"]
      - isSubset:
          path: spec.template.metadata.labels
          content:
            app.kubernetes.io/instance: RELEASE-NAME
  - it: collector-cronjob.yaml job pod template has no chart label
    template: templates/collector-cronjob.yaml
    asserts:
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.jobTemplate.spec.template.metadata.labels["helm.sh/chart"]
      - isSubset:
          path: spec.jobTemplate.spec.template.metadata.labels
          content:
            app.kubernetes.io/instance: RELEASE-NAME
  - it: hotspots-cronjob.yaml job pod template has no chart label
    template: templates/hotspots-cronjob.yaml
    asserts:
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.jobTemplate.spec.template.metadata.labels["helm.sh/chart"]
      - isSubset:
          path: spec.jobTemplate.spec.template.metadata.labels
          content:
            app.kubernetes.io/instance: RELEASE-NAME
  - it: backup-cronjob.yaml job pod template has no chart label
    template: templates/backup-cronjob.yaml
    asserts:
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.jobTemplate.spec.template.metadata.labels["helm.sh/chart"]
      - isSubset:
          path: spec.jobTemplate.spec.template.metadata.labels
          content:
            app.kubernetes.io/instance: RELEASE-NAME
