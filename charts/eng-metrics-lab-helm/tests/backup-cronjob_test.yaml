# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: backup-cronjob
templates:
  - templates/backup-cronjob.yaml
release:
  name: eng-metrics-lab
tests:
  - it: prunes dumps older than keepDays
    asserts:
      - matchRegex: {path: "spec.jobTemplate.spec.template.spec.containers[0].args[0]", pattern: "-mtime \\+30"}

  - it: dumps the database to the backup volume with the postgres image
    asserts:
      - equal: {path: metadata.name, value: eng-metrics-lab-backup}
      - equal: {path: spec.concurrencyPolicy, value: Forbid}
      - equal: {path: spec.successfulJobsHistoryLimit, value: 3}
      - equal: {path: spec.failedJobsHistoryLimit, value: 3}
      - equal: {path: "spec.jobTemplate.spec.template.spec.containers[0].image", value: "docker.io/library/postgres:18-bookworm"}
      - equal: {path: "spec.jobTemplate.spec.template.spec.containers[0].command", value: [sh, "-c"]}
      - matchRegex: {path: "spec.jobTemplate.spec.template.spec.containers[0].args[0]", pattern: "pg_dump -Fc -h eng-metrics-lab-postgres -U postgres quality"}
      - matchRegex: {path: "spec.jobTemplate.spec.template.spec.containers[0].args[0]", pattern: "> /backups/quality-\\$\\(date \\+%F\\)\\.dump"}
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[?(@.name=="PGPASSWORD")].valueFrom.secretKeyRef
          value: {name: eng-metrics-lab-secrets, key: POSTGRES_PASSWORD}
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes[0]
          value: {name: backups, persistentVolumeClaim: {claimName: eng-metrics-lab-backup}}

  - it: honours keepDays
    set:
      backup.keepDays: 7
    asserts:
      - matchRegex: {path: "spec.jobTemplate.spec.template.spec.containers[0].args[0]", pattern: "-mtime \\+7 "}
