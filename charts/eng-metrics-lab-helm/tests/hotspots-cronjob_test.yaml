# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: hotspots-cronjob
templates:
  - templates/hotspots-cronjob.yaml
release:
  name: eng-metrics-lab
set:
  hotspots.repos: [firstdime, replica-sync]
tests:
  - it: renders nothing without repos
    set:
      hotspots.repos: []
    asserts:
      - hasDocuments: {count: 0}

  - it: computes the configured repos' hotspots on Sunday, never concurrently
    asserts:
      - equal: {path: metadata.name, value: eng-metrics-lab-hotspots}
      - equal: {path: spec.schedule, value: "0 4 * * 0"}
      - equal: {path: spec.concurrencyPolicy, value: Forbid}
      - equal: {path: spec.successfulJobsHistoryLimit, value: 3}
      - equal: {path: spec.failedJobsHistoryLimit, value: 1}
      - equal: {path: spec.jobTemplate.spec.ttlSecondsAfterFinished, value: 86400}
      - equal: {path: spec.jobTemplate.spec.backoffLimit, value: 0}
      - equal: {path: spec.jobTemplate.spec.template.spec.restartPolicy, value: Never}
      - equal: {path: "spec.jobTemplate.spec.template.spec.containers[0].command", value: [quality-collector]}
      - equal: {path: "spec.jobTemplate.spec.template.spec.containers[0].args", value: [hotspots]}
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content: {name: QUALITY_HOTSPOT_REPOS, value: "firstdime,replica-sync"}
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content: {name: QUALITY_GITHUB_OWNER, value: jfms7s}
      - equal: {path: "spec.jobTemplate.spec.template.metadata.labels[\"app.kubernetes.io/component\"]", value: hotspots}

  - it: takes its own schedule
    set:
      hotspots.schedule: "15 5 * * 6"
    asserts:
      - equal: {path: spec.schedule, value: "15 5 * * 6"}

  - it: builds the collector URL after the password it references
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[1].name
          value: QUALITY_COLLECTOR_PASSWORD
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[2]
          value:
            name: QUALITY_COLLECTOR_URL
            value: postgresql://quality_collector:$(QUALITY_COLLECTOR_PASSWORD)@eng-metrics-lab-postgres:5432/quality

  - it: tolerates an absent GITHUB_TOKEN so the run exits 2 instead of failing to start
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[?(@.name=="GITHUB_TOKEN")].valueFrom.secretKeyRef
          value: {name: eng-metrics-lab-secrets, key: GITHUB_TOKEN, optional: true}

  - it: clones into a size-limited /tmp, as uid 1000 on a read-only root
    asserts:
      - equal: {path: "spec.jobTemplate.spec.template.spec.containers[0].securityContext.runAsUser", value: 1000}
      - equal: {path: "spec.jobTemplate.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem", value: true}
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content: {name: HOME, value: /tmp}
      - equal: {path: "spec.jobTemplate.spec.template.spec.containers[0].volumeMounts", value: [{name: tmp, mountPath: /tmp}]}
      - equal: {path: spec.jobTemplate.spec.template.spec.volumes, value: [{name: tmp, emptyDir: {sizeLimit: 1Gi}}]}

  - it: takes its own resources and size limit
    set:
      hotspots.workdirSizeLimit: 2Gi
      hotspots.resources: {limits: {memory: 512Mi}}
    asserts:
      - equal: {path: "spec.jobTemplate.spec.template.spec.containers[0].resources", value: {limits: {memory: 512Mi}}}
      - equal: {path: "spec.jobTemplate.spec.template.spec.volumes[0].emptyDir.sizeLimit", value: 2Gi}
