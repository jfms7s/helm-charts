# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: postgres-pvc
templates:
  - templates/postgres-pvc.yaml
release:
  name: eng-metrics-lab
tests:
  - it: keeps the database claim on uninstall
    asserts:
      - equal: {path: metadata.name, value: eng-metrics-lab-postgres-data}
      - equal: {path: "metadata.annotations[\"helm.sh/resource-policy\"]", value: keep}
      - equal: {path: spec.storageClassName, value: synology-iscsi}
      - equal: {path: spec.resources.requests.storage, value: 2Gi}
      - equal: {path: spec.accessModes, value: [ReadWriteOnce]}

  - it: renders nothing when the claim is cleared
    set:
      postgres.persistence.claim.storageClassName: ""
    asserts:
      - hasDocuments: {count: 0}

  - it: needs a size with a storage class
    set:
      postgres.persistence.claim.size: ""
    asserts:
      - failedTemplate:
          errorPattern: "postgres.persistence.claim.size is required"
