apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-backup
  labels:
    {{- include "eng-metrics-lab-helm.labels" (dict "context" $ "name" "backup" "component" "backup") | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "eng-metrics-lab-helm.labels" (dict "context" $ "name" "backup" "component" "backup") | nindent 12 }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: {{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}
              imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
              command: [sh, -c]
              # $(date) is shell, not Kubernetes: it is not a declared env var, so it is passed through.
              args:
                - >-
                  pg_dump -Fc -h {{ include "eng-metrics-lab-helm.postgresHost" . }} -U postgres {{ .Values.postgres.database }}
                  > /backups/quality-$(date +%F).dump
                  && find /backups -name 'quality-*.dump' -mtime +{{ .Values.backup.keepDays | int }} -delete
              securityContext:
                runAsUser: 999
                runAsGroup: 999
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.existingSecret }}
                      key: POSTGRES_PASSWORD
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: {{ .Values.backup.persistence.claim | default (printf "%s-backup" .Release.Name) }}
