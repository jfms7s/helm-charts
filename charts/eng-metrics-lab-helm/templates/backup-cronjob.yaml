apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-backup
  labels:
    {{- include "eng-metrics-lab-helm.labels" (dict "context" $ "name" "backup" "component" "backup") | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "eng-metrics-lab-helm.labels" (dict "context" $ "name" "backup" "component" "backup") | nindent 12 }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          {{- with (include "eng-metrics-lab-helm.placement" . | trim) }}
          {{- . | nindent 10 }}
          {{- end }}
          securityContext:
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: {{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}
              imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
              command: [sh, -c]
              # A dump is only renamed into place once complete; pruning runs even when the dump fails, and the dump's
              # status stays the job's. $(date) is shell: Kubernetes leaves an undeclared $(...) untouched.
              args:
                - |
                  umask 077
                  out=/backups/quality-$(date +%F).dump
                  rc=0
                  if pg_dump -Fc -h {{ include "eng-metrics-lab-helm.postgresHost" . }} -U postgres {{ .Values.postgres.database }} > "$out.tmp"; then
                    mv "$out.tmp" "$out" || rc=$?
                  else
                    rc=$?
                    rm -f "$out.tmp"
                  fi
                  find /backups -name 'quality-*.dump' -mtime +{{ .Values.backup.keepDays | int }} -delete
                  exit $rc
              securityContext:
                runAsUser: 999
                runAsGroup: 999
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.existingSecret }}
                      key: POSTGRES_PASSWORD
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              {{- include "eng-metrics-lab-helm.volumeSource" (dict "persistence" .Values.backup.persistence "claimName" (printf "%s-backup" .Release.Name) "key" "backup.persistence") | nindent 14 }}
