# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: redis-secret
templates:
  - templates/redis-secret.yaml
tests:
  - it: base64-encodes the CHANGE_ME placeholder password by default
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-patchmon-redis
      - equal:
          path: data["redis-password"]
          value: Q0hBTkdFX01F # base64("CHANGE_ME")

  - it: base64-encodes a custom password from values
    set:
      redis.password: s3cr3t
    asserts:
      - equal:
          path: data["redis-password"]
          value: czNjcjN0 # base64("s3cr3t")

  - it: renders nothing when redis.existingSecret is set
    set:
      redis.existingSecret: my-external-secret
    asserts:
      - hasDocuments:
          count: 0
