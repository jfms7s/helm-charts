# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: credentials-in-workloads
templates:
  - templates/postgres-deployment.yaml
  - templates/redis-deployment.yaml
  - templates/server-deployment.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: never inlines a credential given as value into a workload spec
    template: templates/server-deployment.yaml
    set:
      server.jwtSecret.value: s3ntinel
    asserts:
      - notExists:
          path: spec.template.spec.containers[*].env[?(@.value == "s3ntinel")]
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-patchmon-credentials
                key: JWT_SECRET

  - it: passes a credential's own valueFrom through unchanged
    template: templates/server-deployment.yaml
    set:
      server.jwtSecret.valueFrom.secretKeyRef: {name: my-secret, key: my-key}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: my-key

  - it: annotates postgres-deployment with a checksum of only the credentials it reads
    template: templates/postgres-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/credentials"]
          value: aaaffe505cf57eb506b78ae9105d6322a90b044bf74a461346a4e8b5bea784cb

  - it: keeps postgres-deployment's checksum when an unrelated credential changes
    template: templates/postgres-deployment.yaml
    set:
      redis.password.value: rotated-elsewhere
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/credentials"]
          value: aaaffe505cf57eb506b78ae9105d6322a90b044bf74a461346a4e8b5bea784cb

  - it: changes postgres-deployment's checksum when one of its credentials changes
    template: templates/postgres-deployment.yaml
    set:
      postgres.password.value: rotated
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/credentials"]
          value: bdcc666d0401a4bd7b43f6820adfd50722ff3d973355756c3068fbfc9ec02bf1

  - it: has no credentials checksum on postgres-deployment when every credential uses valueFrom
    template: templates/postgres-deployment.yaml
    set:
      postgres.password.valueFrom.secretKeyRef: {name: ext, key: POSTGRES_PASSWORD}
      redis.password.valueFrom.secretKeyRef: {name: ext, key: REDIS_PASSWORD}
      server.jwtSecret.valueFrom.secretKeyRef: {name: ext, key: JWT_SECRET}
      server.sessionSecret.valueFrom.secretKeyRef: {name: ext, key: SESSION_SECRET}
      server.aiEncryptionKey.valueFrom.secretKeyRef: {name: ext, key: AI_ENCRYPTION_KEY}
    asserts:
      - notExists:
          path: spec.template.metadata.annotations

  - it: annotates redis-deployment with a checksum of only the credentials it reads
    template: templates/redis-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/credentials"]
          value: 19d24dbb386132d5b2a63f72f051d85e1dd23f3fe4a26bcbb7fa5b35f9e143a9

  - it: keeps redis-deployment's checksum when an unrelated credential changes
    template: templates/redis-deployment.yaml
    set:
      postgres.password.value: rotated-elsewhere
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/credentials"]
          value: 19d24dbb386132d5b2a63f72f051d85e1dd23f3fe4a26bcbb7fa5b35f9e143a9

  - it: changes redis-deployment's checksum when one of its credentials changes
    template: templates/redis-deployment.yaml
    set:
      redis.password.value: rotated
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/credentials"]
          value: af561d2b058aadebf1d1cef2e411a51481eac05aa59de26a5612ac0329b0ba4b

  - it: has no credentials checksum on redis-deployment when every credential uses valueFrom
    template: templates/redis-deployment.yaml
    set:
      postgres.password.valueFrom.secretKeyRef: {name: ext, key: POSTGRES_PASSWORD}
      redis.password.valueFrom.secretKeyRef: {name: ext, key: REDIS_PASSWORD}
      server.jwtSecret.valueFrom.secretKeyRef: {name: ext, key: JWT_SECRET}
      server.sessionSecret.valueFrom.secretKeyRef: {name: ext, key: SESSION_SECRET}
      server.aiEncryptionKey.valueFrom.secretKeyRef: {name: ext, key: AI_ENCRYPTION_KEY}
    asserts:
      - notExists:
          path: spec.template.metadata.annotations

  - it: annotates server-deployment with a checksum of only the credentials it reads
    template: templates/server-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/credentials"]
          value: 058df696416ef75475f12f3bf9f270fa9a1d7d5589281ef3d9d05c17df9c8590

  - it: changes server-deployment's checksum when one of its credentials changes
    template: templates/server-deployment.yaml
    set:
      server.aiEncryptionKey.value: rotated
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/credentials"]
          value: 10ecc38a8c329fdcb8f0bd811b4459b2160b199d0e180e8067c85f1471a7e232

  - it: has no credentials checksum on server-deployment when every credential uses valueFrom
    template: templates/server-deployment.yaml
    set:
      postgres.password.valueFrom.secretKeyRef: {name: ext, key: POSTGRES_PASSWORD}
      redis.password.valueFrom.secretKeyRef: {name: ext, key: REDIS_PASSWORD}
      server.jwtSecret.valueFrom.secretKeyRef: {name: ext, key: JWT_SECRET}
      server.sessionSecret.valueFrom.secretKeyRef: {name: ext, key: SESSION_SECRET}
      server.aiEncryptionKey.valueFrom.secretKeyRef: {name: ext, key: AI_ENCRYPTION_KEY}
    asserts:
      - notExists:
          path: spec.template.metadata.annotations
