# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: server-service
templates:
  - templates/server-service.yaml
tests:
  - it: renders the server Service
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-patchmon-server
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: server
      - equal:
          path: spec.ports[0]
          value:
            name: http
            port: 3000
            targetPort: 3000
            protocol: TCP
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: server
            app.kubernetes.io/instance: RELEASE-NAME
