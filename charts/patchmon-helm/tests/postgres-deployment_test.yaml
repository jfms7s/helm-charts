# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: postgres-deployment
templates:
  - templates/postgres-deployment.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: renders with chart defaults
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-patchmon-postgres
      - equal:
          path: metadata.labels
          value:
            app.kubernetes.io/name: postgres
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: database
            app.kubernetes.io/part-of: patchmon
            app.kubernetes.io/managed-by: Helm
            helm.sh/chart: patchmon-helm-0.6.1
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.template.spec.containers[0].image
          value: postgres:17-alpine
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_DB
            value: patchmon_db
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_USER
            value: patchmon_user
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            value: "test-postgres-password"
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value:
            - pg_isready
            - -U
            - patchmon_user
            - -d
            - patchmon_db
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
      - contains:
          path: spec.template.spec.volumes
          content:
            name: postgres-data
            emptyDir: {}
      - equal:
          path: spec.template.spec.restartPolicy
          value: Always

  - it: uses a custom postgres image, user, and db
    set:
      postgres.image.repository: my-registry/postgres
      postgres.image.tag: "16-alpine"
      postgres.user: custom_user
      postgres.db: custom_db
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: my-registry/postgres:16-alpine
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value:
            - pg_isready
            - -U
            - custom_user
            - -d
            - custom_db

  - it: uses a custom volume source for postgres persistence instead of emptyDir
    set:
      postgres.persistence.volume:
        nfs:
          server: 192.168.1.10
          path: /volumes/patchmon/postgres
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: postgres-data
            nfs:
              server: 192.168.1.10
              path: /volumes/patchmon/postgres

  - it: sources POSTGRES_PASSWORD from postgres.password.valueFrom when set, taking precedence over the value default
    set:
      postgres.password.valueFrom.secretKeyRef.name: my-external-secret
      postgres.password.valueFrom.secretKeyRef.key: MY_KEY
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-external-secret
                key: MY_KEY

  - it: mounts the postgres data volume at a subPath when persistence.subPath is set
    set:
      postgres:
        persistence:
          subPath: data
          volume:
            persistentVolumeClaim:
              claimName: pg-data
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: postgres-data
            mountPath: /var/lib/postgresql/data
            subPath: data

  - it: mounts the postgres data volume without a subPath by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: postgres-data
            mountPath: /var/lib/postgresql/data

  # Credential guard (<chart>.validate): this template refuses to render alone
  # with a placeholder credential, and renders with valueFrom only.
  - it: postgres-deployment.yaml refuses to render with a placeholder credential
    set:
      server.jwtSecret.value: "CHANGE_ME"
    asserts:
      - failedTemplate:
          errorPattern: "server.jwtSecret must be set"
  - it: postgres-deployment.yaml renders with every credential given as valueFrom only
    set:
      server.jwtSecret.value: ""
      server.jwtSecret.valueFrom.secretKeyRef.name: s
      server.jwtSecret.valueFrom.secretKeyRef.key: jwtsecret
      server.sessionSecret.value: ""
      server.sessionSecret.valueFrom.secretKeyRef.name: s
      server.sessionSecret.valueFrom.secretKeyRef.key: sessionsecret
      server.aiEncryptionKey.value: ""
      server.aiEncryptionKey.valueFrom.secretKeyRef.name: s
      server.aiEncryptionKey.valueFrom.secretKeyRef.key: aiencryptionkey
      postgres.password.value: ""
      postgres.password.valueFrom.secretKeyRef.name: s
      postgres.password.valueFrom.secretKeyRef.key: password
      redis.password.value: ""
      redis.password.valueFrom.secretKeyRef.name: s
      redis.password.valueFrom.secretKeyRef.key: password
    asserts:
      - notFailedTemplate: {}
