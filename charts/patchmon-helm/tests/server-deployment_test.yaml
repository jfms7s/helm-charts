# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: server-deployment
templates:
  - templates/server-deployment.yaml
tests:
  - it: renders with chart defaults
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-patchmon-server
      - equal:
          path: metadata.labels
          value:
            app.kubernetes.io/name: server
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: server
            app.kubernetes.io/part-of: patchmon
            app.kubernetes.io/managed-by: Helm
            helm.sh/chart: patchmon-helm-0.3.0
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: server
            app.kubernetes.io/instance: RELEASE-NAME
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/patchmon/patchmon-server:latest
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CORS_ORIGIN
            value: "http://localhost:3000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JWT_SECRET
            value: "CHANGE_ME"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            value: "CHANGE_ME"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@RELEASE-NAME-patchmon-postgres:5432/patchmon_db
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_HOST
            value: RELEASE-NAME-patchmon-redis
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            value: "CHANGE_ME"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GUACD_ADDRESS
            value: RELEASE-NAME-patchmon-guacd:4822
      - equal:
          path: spec.template.spec.containers[0].ports[0]
          value:
            name: http
            containerPort: 3000
            protocol: TCP
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].resources
          value: {}
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value: {}
      - equal:
          path: spec.template.spec.securityContext
          value: {}
      - equal:
          path: spec.template.spec.restartPolicy
          value: Always

  - it: omits GUACD_ADDRESS when guacd is disabled
    set:
      guacd.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GUACD_ADDRESS
            value: RELEASE-NAME-patchmon-guacd:4822

  - it: appends extraEnv entries after the built-in vars
    set:
      server.extraEnv:
        - name: LOG_LEVEL
          value: debug
        - name: TZ
          value: UTC
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
            value: debug
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TZ
            value: UTC

  - it: uses a custom image repository and tag
    set:
      image.repository: my-registry/patchmon-server
      image.tag: "1.2.3"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: my-registry/patchmon-server:1.2.3

  - it: builds CORS_ORIGIN and DATABASE_URL from custom values
    set:
      server.corsOrigin: "https://patchmon.example.com"
      postgres.user: custom_user
      postgres.db: custom_db
      postgres.password.value: s3cr3t
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CORS_ORIGIN
            value: "https://patchmon.example.com"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@RELEASE-NAME-patchmon-postgres:5432/custom_db

  - it: sources JWT_SECRET/SESSION_SECRET/AI_ENCRYPTION_KEY from their valueFrom when set, taking precedence over the value default
    set:
      server.jwtSecret.valueFrom.secretKeyRef.name: ext-server-secret
      server.jwtSecret.valueFrom.secretKeyRef.key: jwt-secret
      server.sessionSecret.valueFrom.secretKeyRef.name: ext-server-secret
      server.sessionSecret.valueFrom.secretKeyRef.key: session-secret
      server.aiEncryptionKey.valueFrom.secretKeyRef.name: ext-server-secret
      server.aiEncryptionKey.valueFrom.secretKeyRef.key: ai-encryption-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: ext-server-secret
                key: jwt-secret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SESSION_SECRET
            valueFrom:
              secretKeyRef:
                name: ext-server-secret
                key: session-secret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AI_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: ext-server-secret
                key: ai-encryption-key

  - it: sources POSTGRES_PASSWORD/REDIS_PASSWORD from their valueFrom when set, taking precedence over the value default
    set:
      postgres.password.valueFrom.secretKeyRef.name: ext-pg-secret
      postgres.password.valueFrom.secretKeyRef.key: postgres-password
      redis.password.valueFrom.secretKeyRef.name: ext-redis-secret
      redis.password.valueFrom.secretKeyRef.key: redis-password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ext-pg-secret
                key: postgres-password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ext-redis-secret
                key: redis-password

  - it: scales replicas and renders resources/securityContext when set
    set:
      replicas: 3
      resources:
        limits:
          cpu: "1"
      securityContext:
        runAsNonRoot: true
      podSecurityContext:
        fsGroup: 1000
    asserts:
      - equal:
          path: spec.replicas
          value: 3
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "1"
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000
