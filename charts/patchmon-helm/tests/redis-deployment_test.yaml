# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: redis-deployment
templates:
  - templates/redis-deployment.yaml
values:
  - ../ci/test-values.yaml
# Pin the chart version so a version bump needs no test edit.
chart:
  version: 0.0.0-test
tests:
  - it: renders with chart defaults
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-patchmon-redis
      - equal:
          path: metadata.labels
          value:
            app.kubernetes.io/name: redis
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: cache
            app.kubernetes.io/part-of: patchmon
            app.kubernetes.io/managed-by: Helm
            helm.sh/chart: patchmon-helm-0.0.0-test
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.template.spec.containers[0].image
          value: redis:7-alpine
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - sh
            - -c
            - |
              pw=$(printf '%s' "$REDIS_PASSWORD" | od -An -v -tx1 | tr -d ' \n' | sed 's/../\\x&/g')
              exec redis-server - <<EOF
              requirepass "$pw"
              EOF
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-patchmon-credentials
                key: REDIS_PASSWORD
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value: [redis-cli, ping]
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value: [redis-cli, ping]
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDISCLI_AUTH
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-patchmon-credentials
                key: REDIS_PASSWORD
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
      - contains:
          path: spec.template.spec.volumes
          content:
            name: redis-data
            emptyDir: {}
      - equal:
          path: spec.template.spec.restartPolicy
          value: Always

  - it: uses a custom redis image
    set:
      redis.image.repository: my-registry/redis
      redis.image.tag: "7"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: my-registry/redis:7

  - it: uses a custom volume source for redis persistence instead of emptyDir
    set:
      redis.persistence.volume:
        nfs:
          server: 192.168.1.10
          path: /volumes/patchmon/redis
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: redis-data
            nfs:
              server: 192.168.1.10
              path: /volumes/patchmon/redis

  - it: sources REDIS_PASSWORD from redis.password.valueFrom when set, taking precedence over the value default
    set:
      redis.password.valueFrom.secretKeyRef.name: my-external-secret
      redis.password.valueFrom.secretKeyRef.key: MY_KEY
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-external-secret
                key: MY_KEY
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDISCLI_AUTH
            valueFrom:
              secretKeyRef:
                name: my-external-secret
                key: MY_KEY

  - it: mounts the redis data volume at a subPath when persistence.subPath is set
    set:
      redis:
        persistence:
          subPath: data
          volume:
            persistentVolumeClaim:
              claimName: redis-data-claim
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: redis-data
            mountPath: /data
            subPath: data

  - it: mounts the redis data volume without a subPath by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: redis-data
            mountPath: /data

  # Credential guard (<chart>.validate): this template refuses to render alone
  # with a placeholder credential, and renders with valueFrom only.
  - it: redis-deployment.yaml refuses to render with a placeholder credential
    set:
      server.jwtSecret.value: "CHANGE_ME"
    asserts:
      - failedTemplate:
          errorPattern: "server.jwtSecret must be set"
  - it: redis-deployment.yaml renders with every credential given as valueFrom only
    set:
      server.jwtSecret.value: ""
      server.jwtSecret.valueFrom.secretKeyRef.name: s
      server.jwtSecret.valueFrom.secretKeyRef.key: jwtsecret
      server.sessionSecret.value: ""
      server.sessionSecret.valueFrom.secretKeyRef.name: s
      server.sessionSecret.valueFrom.secretKeyRef.key: sessionsecret
      server.aiEncryptionKey.value: ""
      server.aiEncryptionKey.valueFrom.secretKeyRef.name: s
      server.aiEncryptionKey.valueFrom.secretKeyRef.key: aiencryptionkey
      postgres.password.value: ""
      postgres.password.valueFrom.secretKeyRef.name: s
      postgres.password.valueFrom.secretKeyRef.key: password
      redis.password.value: ""
      redis.password.valueFrom.secretKeyRef.name: s
      redis.password.valueFrom.secretKeyRef.key: password
    asserts:
      - notFailedTemplate: {}

  - it: keeps the redis password off every command line
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: (--requirepass|\$\(REDIS_PASSWORD\))
      - notContains:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          content: -a
      - notContains:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          content: -a
      # Hex-escaped, so a newline or quote in the password cannot break the
      # config line (checked against redis:7-alpine in podman).
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: od -An -v -tx1 .*\\x&

  - it: hardens the redis container (no escalation, RuntimeDefault seccomp, minimal capabilities)
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETUID, SETGID]

  - it: runs the liveness ping every 30 s (readiness stays at 10 s)
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 5
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 10
