# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: credentials-secret
templates:
  - templates/credentials-secret.yaml
values:
  - ../ci/test-values.yaml
chart:
  version: 0.0.0-test
tests:
  - it: holds every credential given as value, base64-encoded
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-patchmon-credentials
      - equal:
          path: type
          value: Opaque
      - equal:
          path: data
          value:
            AI_ENCRYPTION_KEY: dGVzdC1haS1lbmNyeXB0aW9uLWtleS1ub3QtcmVhbA==
            JWT_SECRET: dGVzdC1qd3Qtc2VjcmV0LW5vdC1yZWFs
            POSTGRES_PASSWORD: dGVzdC1wb3N0Z3Jlcy1wYXNzd29yZA==
            REDIS_PASSWORD: dGVzdC1yZWRpcy1wYXNzd29yZA==
            SESSION_SECRET: dGVzdC1zZXNzaW9uLXNlY3JldC1ub3QtcmVhbA==

  - it: leaves out a credential given as valueFrom
    set:
      server.jwtSecret.valueFrom.secretKeyRef: {name: ext, key: k}
    asserts:
      - notExists:
          path: data.JWT_SECRET

  - it: renders no Secret when every credential uses valueFrom
    set:
      postgres.password.valueFrom.secretKeyRef: {name: ext, key: POSTGRES_PASSWORD}
      redis.password.valueFrom.secretKeyRef: {name: ext, key: REDIS_PASSWORD}
      server.jwtSecret.valueFrom.secretKeyRef: {name: ext, key: JWT_SECRET}
      server.sessionSecret.valueFrom.secretKeyRef: {name: ext, key: SESSION_SECRET}
      server.aiEncryptionKey.valueFrom.secretKeyRef: {name: ext, key: AI_ENCRYPTION_KEY}
    asserts:
      - hasDocuments:
          count: 0
