# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
# Render-time credential guard (<chart>.validate): every credential must be
# set through value or valueFrom; empty, null and the CHANGE_ME placeholder fail.
suite: credentials
templates:
  - templates/server-deployment.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: fails when server.jwtSecret is CHANGE_ME
    template: templates/server-deployment.yaml
    set:
      server.jwtSecret.value: "CHANGE_ME"
    asserts:
      - failedTemplate:
          errorPattern: "server.jwtSecret must be set"
  - it: fails when server.jwtSecret is empty
    template: templates/server-deployment.yaml
    set:
      server.jwtSecret.value: ""
    asserts:
      - failedTemplate:
          errorPattern: "server.jwtSecret must be set"
  - it: fails when server.jwtSecret is null
    template: templates/server-deployment.yaml
    set:
      server.jwtSecret: null
    asserts:
      - failedTemplate:
          errorPattern: "server.jwtSecret must be set"
  - it: fails when server.sessionSecret is CHANGE_ME
    template: templates/server-deployment.yaml
    set:
      server.sessionSecret.value: "CHANGE_ME"
    asserts:
      - failedTemplate:
          errorPattern: "server.sessionSecret must be set"
  - it: fails when server.sessionSecret is empty
    template: templates/server-deployment.yaml
    set:
      server.sessionSecret.value: ""
    asserts:
      - failedTemplate:
          errorPattern: "server.sessionSecret must be set"
  - it: fails when server.sessionSecret is null
    template: templates/server-deployment.yaml
    set:
      server.sessionSecret: null
    asserts:
      - failedTemplate:
          errorPattern: "server.sessionSecret must be set"
  - it: fails when server.aiEncryptionKey is CHANGE_ME
    template: templates/server-deployment.yaml
    set:
      server.aiEncryptionKey.value: "CHANGE_ME"
    asserts:
      - failedTemplate:
          errorPattern: "server.aiEncryptionKey must be set"
  - it: fails when server.aiEncryptionKey is empty
    template: templates/server-deployment.yaml
    set:
      server.aiEncryptionKey.value: ""
    asserts:
      - failedTemplate:
          errorPattern: "server.aiEncryptionKey must be set"
  - it: fails when server.aiEncryptionKey is null
    template: templates/server-deployment.yaml
    set:
      server.aiEncryptionKey: null
    asserts:
      - failedTemplate:
          errorPattern: "server.aiEncryptionKey must be set"
  - it: fails when postgres.password is CHANGE_ME
    template: templates/server-deployment.yaml
    set:
      postgres.password.value: "CHANGE_ME"
    asserts:
      - failedTemplate:
          errorPattern: "postgres.password must be set"
  - it: fails when postgres.password is empty
    template: templates/server-deployment.yaml
    set:
      postgres.password.value: ""
    asserts:
      - failedTemplate:
          errorPattern: "postgres.password must be set"
  - it: fails when postgres.password is null
    template: templates/server-deployment.yaml
    set:
      postgres.password: null
    asserts:
      - failedTemplate:
          errorPattern: "postgres.password must be set"
  - it: fails when redis.password is CHANGE_ME
    template: templates/server-deployment.yaml
    set:
      redis.password.value: "CHANGE_ME"
    asserts:
      - failedTemplate:
          errorPattern: "redis.password must be set"
  - it: fails when redis.password is empty
    template: templates/server-deployment.yaml
    set:
      redis.password.value: ""
    asserts:
      - failedTemplate:
          errorPattern: "redis.password must be set"
  - it: fails when redis.password is null
    template: templates/server-deployment.yaml
    set:
      redis.password: null
    asserts:
      - failedTemplate:
          errorPattern: "redis.password must be set"
  - it: server-deployment.yaml refuses to render with a placeholder credential
    template: templates/server-deployment.yaml
    set:
      server.jwtSecret.value: "CHANGE_ME"
    asserts:
      - failedTemplate:
          errorPattern: "server.jwtSecret must be set"
  - it: server-deployment.yaml renders with every credential given as valueFrom only
    template: templates/server-deployment.yaml
    set:
      server.jwtSecret.value: ""
      server.jwtSecret.valueFrom.secretKeyRef.name: s
      server.jwtSecret.valueFrom.secretKeyRef.key: jwtsecret
      server.sessionSecret.value: ""
      server.sessionSecret.valueFrom.secretKeyRef.name: s
      server.sessionSecret.valueFrom.secretKeyRef.key: sessionsecret
      server.aiEncryptionKey.value: ""
      server.aiEncryptionKey.valueFrom.secretKeyRef.name: s
      server.aiEncryptionKey.valueFrom.secretKeyRef.key: aiencryptionkey
      postgres.password.value: ""
      postgres.password.valueFrom.secretKeyRef.name: s
      postgres.password.valueFrom.secretKeyRef.key: password
      redis.password.value: ""
      redis.password.valueFrom.secretKeyRef.name: s
      redis.password.valueFrom.secretKeyRef.key: password
    asserts:
      - notFailedTemplate: {}
  - it: fails when a credential is whitespace only
    template: templates/server-deployment.yaml
    set:
      server.jwtSecret.value: "   "
    asserts:
      - failedTemplate:
          errorPattern: "server.jwtSecret must be set"
  - it: fails when the placeholder is padded with whitespace
    template: templates/server-deployment.yaml
    set:
      redis.password.value: " CHANGE_ME "
    asserts:
      - failedTemplate:
          errorPattern: "redis.password must be set"
