# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: server-secret
templates:
  - templates/server-secret.yaml
tests:
  - it: base64-encodes the CHANGE_ME placeholders by default
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-patchmon-server
      - equal:
          path: type
          value: Opaque
      - equal:
          path: data
          value:
            jwt-secret: Q0hBTkdFX01F # base64("CHANGE_ME")
            session-secret: Q0hBTkdFX01F
            ai-encryption-key: Q0hBTkdFX01F

  - it: base64-encodes custom secret values from values.yaml
    set:
      server.jwtSecret: jwt-value
      server.sessionSecret: session-value
      server.aiEncryptionKey: ai-value
    asserts:
      - equal:
          path: data["jwt-secret"]
          value: and0LXZhbHVl # base64("jwt-value")
      - equal:
          path: data["session-secret"]
          value: c2Vzc2lvbi12YWx1ZQ== # base64("session-value")
      - equal:
          path: data["ai-encryption-key"]
          value: YWktdmFsdWU= # base64("ai-value")

  - it: renders nothing when server.existingSecret is set
    set:
      server.existingSecret: my-external-secret
    asserts:
      - hasDocuments:
          count: 0
