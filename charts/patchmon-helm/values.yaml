image:
  repository: ghcr.io/patchmon/patchmon-server
  tag: latest
  pullPolicy: IfNotPresent

replicas: 1

server:
  # Must match the URL(s) used to reach the server; comma-separated for
  # multiple origins. See PatchMon's docker/env.example (CORS_ORIGIN).
  corsOrigin: "http://localhost:3000"
  # Secrets consumed by the server (JWT signing, session cookies, and AI
  # credential encryption), each a standard Kubernetes EnvVarSource: set
  # `value` for a plain literal (Argo CD does not support Helm's `lookup`
  # function, so these can't be safely auto-generated and persisted across
  # syncs -- pin explicitly, e.g. from a values-secrets file kept out of
  # version control; generate each with `openssl rand -hex 64`), or
  # `valueFrom` (e.g. a `secretKeyRef`) to source it from a Secret you manage
  # yourself instead. `valueFrom` takes precedence when both are set; each
  # of the three toggles independently.
  jwtSecret:
    value: "CHANGE_ME"
    valueFrom: {}
  sessionSecret:
    value: "CHANGE_ME"
    valueFrom: {}
  aiEncryptionKey:
    value: "CHANGE_ME"
    valueFrom: {}
  # Extra environment variables appended to the server container, for any of
  # the optional settings in PatchMon's docker/env.example (LOG_LEVEL,
  # OIDC_*, rate limits, TZ, ...). Each entry is {name, value}.
  extraEnv: []

postgres:
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  db: patchmon_db
  user: patchmon_user
  # Password for the patchmon-postgres database, as a standard Kubernetes
  # EnvVarSource: set `value` for a plain literal (Argo CD does not support
  # Helm's `lookup` function, so this can't be safely auto-generated and
  # persisted across syncs -- pin it explicitly, e.g. from a values-secrets
  # file kept out of version control), or `valueFrom` (e.g. a
  # `secretKeyRef`) to source it from a Secret you manage yourself instead.
  # `valueFrom` takes precedence when both are set.
  password:
    value: "CHANGE_ME"
    valueFrom: {}
  resources: {}
  # Volume source for the Postgres data directory. Each value is the full
  # body of a Kubernetes volume source (excluding `name`) -- nfs, hostPath,
  # persistentVolumeClaim, etc. Left empty (emptyDir, non-persistent) by
  # default since the right backend is environment-specific; set explicitly
  # by the caller, e.g.:
  #   persistence:
  #     volume:
  #       nfs:
  #         server: 192.168.1.10
  #         path: /volumes/patchmon/postgres
  persistence:
    volume: {}

redis:
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  # Password for Redis (started with --requirepass), as a standard
  # Kubernetes EnvVarSource. Same shape/rationale as postgres.password above.
  password:
    value: "CHANGE_ME"
    valueFrom: {}
  resources: {}
  # Volume source for the Redis data directory. Same shape as
  # postgres.persistence.volume above; defaults to emptyDir when unset.
  persistence:
    volume: {}

# guacd backs PatchMon's in-browser RDP (Windows host) feature. Runs
# read-only/hardened per upstream's docker-compose.yml (no writable root
# filesystem, no extra Linux capabilities, no privilege escalation).
guacd:
  enabled: true
  image:
    repository: guacamole/guacd
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "1"
      memory: 512Mi

resources: {}
  # limits:
  #   cpu: 1000m
  #   memory: 1Gi
  # requests:
  #   cpu: 250m
  #   memory: 512Mi

securityContext: {}
  # runAsNonRoot: true
  # runAsUser: 1000

podSecurityContext: {}
  # fsGroup: 1000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # traefik.ingress.kubernetes.io/rewrite-target: "/"
  hosts:
    - host: patchmon.example.local
      paths:
        - path: /
          pathType: Prefix
          port: 3000
  tls: []
