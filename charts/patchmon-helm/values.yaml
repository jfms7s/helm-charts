image:
  repository: ghcr.io/patchmon/patchmon-server
  tag: latest
  pullPolicy: IfNotPresent

replicas: 1

server:
  # Must match the URL(s) used to reach the server; comma-separated for
  # multiple origins. See PatchMon's docker/env.example (CORS_ORIGIN).
  corsOrigin: "http://localhost:3000"
  # Secrets consumed by the server (JWT signing, session cookies, and AI
  # credential encryption). Argo CD does not support Helm's `lookup`
  # function, so these can't be safely auto-generated and persisted across
  # syncs -- set them explicitly (e.g. from a values-secrets file kept out
  # of version control). Generate each with: openssl rand -hex 64
  jwtSecret: "CHANGE_ME"
  sessionSecret: "CHANGE_ME"
  aiEncryptionKey: "CHANGE_ME"
  # Optional: name of a pre-existing Kubernetes Secret holding
  # jwtSecret/sessionSecret/aiEncryptionKey instead of the plaintext values
  # above (e.g. one synced by an external secrets manager). When set, this
  # chart stops rendering its own Secret and every consumer references this
  # one instead -- leave unset to keep the default plaintext-values.yaml
  # behavior untouched. Must contain all three keys named below.
  existingSecret: ""
  existingSecretJwtKey: "jwt-secret"
  existingSecretSessionKey: "session-secret"
  existingSecretAiEncryptionKey: "ai-encryption-key"
  # Extra environment variables appended to the server container, for any of
  # the optional settings in PatchMon's docker/env.example (LOG_LEVEL,
  # OIDC_*, rate limits, TZ, ...). Each entry is {name, value}.
  extraEnv: []

postgres:
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  db: patchmon_db
  user: patchmon_user
  # Pinned password for the patchmon-postgres database. Argo CD does not
  # support Helm's `lookup` function, so a password can't be safely
  # auto-generated and persisted across syncs -- set this explicitly (e.g.
  # from a values-secrets file kept out of version control).
  password: "CHANGE_ME"
  # Optional: name of a pre-existing Kubernetes Secret holding the password
  # instead of the plaintext value above. When set, this chart stops
  # rendering its own Secret from `password` and every consumer references
  # this one instead -- leave unset to keep the default plaintext-values.yaml
  # behavior untouched.
  existingSecret: ""
  # Key within existingSecret holding the password. Only read when
  # existingSecret is set; the chart's own generated Secret always uses
  # "postgres-password".
  existingSecretPasswordKey: "postgres-password"
  resources: {}
  # Volume source for the Postgres data directory. Each value is the full
  # body of a Kubernetes volume source (excluding `name`) -- nfs, hostPath,
  # persistentVolumeClaim, etc. Left empty (emptyDir, non-persistent) by
  # default since the right backend is environment-specific; set explicitly
  # by the caller, e.g.:
  #   persistence:
  #     volume:
  #       nfs:
  #         server: 192.168.1.10
  #         path: /volumes/patchmon/postgres
  persistence:
    volume: {}

redis:
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  # Pinned password for Redis (started with --requirepass). Same rationale
  # as postgres.password -- set explicitly, not auto-generated.
  password: "CHANGE_ME"
  # Optional: name of a pre-existing Kubernetes Secret holding the password
  # instead of the plaintext value above. Same behavior/rationale as
  # postgres.existingSecret above.
  existingSecret: ""
  # Key within existingSecret holding the password. Only read when
  # existingSecret is set; the chart's own generated Secret always uses
  # "redis-password".
  existingSecretPasswordKey: "redis-password"
  resources: {}
  # Volume source for the Redis data directory. Same shape as
  # postgres.persistence.volume above; defaults to emptyDir when unset.
  persistence:
    volume: {}

# guacd backs PatchMon's in-browser RDP (Windows host) feature. Runs
# read-only/hardened per upstream's docker-compose.yml (no writable root
# filesystem, no extra Linux capabilities, no privilege escalation).
guacd:
  enabled: true
  image:
    repository: guacamole/guacd
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "1"
      memory: 512Mi

resources: {}
  # limits:
  #   cpu: 1000m
  #   memory: 1Gi
  # requests:
  #   cpu: 250m
  #   memory: 512Mi

securityContext: {}
  # runAsNonRoot: true
  # runAsUser: 1000

podSecurityContext: {}
  # fsGroup: 1000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # traefik.ingress.kubernetes.io/rewrite-target: "/"
  hosts:
    - host: patchmon.example.local
      paths:
        - path: /
          pathType: Prefix
          port: 3000
  tls: []
