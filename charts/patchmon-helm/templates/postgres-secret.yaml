{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-patchmon-postgres
  labels:
    {{- include "patchmon-helm.labels" (dict "context" $ "name" "postgres" "component" "database") | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ include "patchmon-helm.postgres.password" . | b64enc }}
{{- end }}
