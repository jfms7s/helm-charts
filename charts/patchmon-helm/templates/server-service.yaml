apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-patchmon-server
  labels:
    {{- include "patchmon-helm.labels" (dict "context" $ "name" "server" "component" "server") | nindent 4 }}
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    {{- include "patchmon-helm.selectorLabels" (dict "context" $ "name" "server") | nindent 4 }}
