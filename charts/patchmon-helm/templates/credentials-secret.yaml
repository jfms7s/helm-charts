{{- include "patchmon-helm.validate" . }}
{{- with include "patchmon-helm.credentialsSecretData" (dict "ctx" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "patchmon-helm.credentialsSecretName" $ }}
  labels:
    {{- include "patchmon-helm.labels" (dict "context" $ "name" "credentials" "component" "credentials") | nindent 4 }}
type: Opaque
data:
  {{- . | trim | nindent 2 }}
{{- end }}
