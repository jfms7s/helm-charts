{{- include "patchmon-helm.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-patchmon-redis
  labels:
    {{- include "patchmon-helm.labels" (dict "context" $ "name" "redis" "component" "cache") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "patchmon-helm.selectorLabels" (dict "context" $ "name" "redis") | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "patchmon-helm.podLabels" (dict "context" $ "name" "redis" "component" "cache") | nindent 8 }}
    spec:
      containers:
        - name: patchmon-redis
          image: {{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          # The password goes to redis-server as config on stdin, never on a
          # command line (argv is readable from the process list). Every byte
          # is written as a \xHH escape inside a double-quoted string, so any
          # value (newlines included) reaches Redis unchanged. Needs sh, od,
          # tr and sed in the image (the official redis images have them).
          command:
            - sh
            - -c
            - |
              pw=$(printf '%s' "$REDIS_PASSWORD" | od -An -v -tx1 | tr -d ' \n' | sed 's/../\\x&/g')
              exec redis-server - <<EOF
              requirepass "$pw"
              EOF
          env:
            - name: REDIS_PASSWORD
              {{- include "patchmon-helm.credentialEnv" .Values.redis.password | nindent 14 }}
            # redis-cli reads its password from REDISCLI_AUTH (the probes).
            - name: REDISCLI_AUTH
              {{- include "patchmon-helm.credentialEnv" .Values.redis.password | nindent 14 }}
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /data
              name: redis-data
              {{- with .Values.redis.persistence.subPath }}
              subPath: {{ . | quote }}
              {{- end }}
      restartPolicy: Always
      volumes:
        - name: redis-data
          {{- if .Values.redis.persistence.volume }}
          {{- toYaml .Values.redis.persistence.volume | nindent 10 }}
          {{- else }}
          emptyDir: {}
          {{- end }}
