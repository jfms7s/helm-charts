{{- include "patchmon-helm.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-patchmon-postgres
  labels:
    {{- include "patchmon-helm.labels" (dict "context" $ "name" "postgres" "component" "database") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "patchmon-helm.selectorLabels" (dict "context" $ "name" "postgres") | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "patchmon-helm.podLabels" (dict "context" $ "name" "postgres" "component" "database") | nindent 8 }}
      {{- with include "patchmon-helm.credentialsChecksum" (dict "ctx" $ "keys" (list "POSTGRES_PASSWORD")) }}{{ . | nindent 6 }}{{ end }}
    spec:
      containers:
        - name: patchmon-postgres
          image: {{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          # The official image starts as root: its docker-entrypoint.sh chowns
          # and chmods the data directory (CHOWN, FOWNER, DAC_OVERRIDE to read
          # a 0700 directory it does not own yet) and then drops to the
          # postgres user with su-exec (SETUID, SETGID). Every other
          # capability is dropped.
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.db }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user }}
            - name: POSTGRES_PASSWORD
              {{- include "patchmon-helm.credentialEnv" (dict "ctx" $ "key" "POSTGRES_PASSWORD") | nindent 14 }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgres.user }}
                - -d
                - {{ .Values.postgres.db }}
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgres.user }}
                - -d
                - {{ .Values.postgres.db }}
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-data
              {{- with .Values.postgres.persistence.subPath }}
              subPath: {{ . | quote }}
              {{- end }}
      restartPolicy: Always
      volumes:
        - name: postgres-data
          {{- if .Values.postgres.persistence.volume }}
          {{- toYaml .Values.postgres.persistence.volume | nindent 10 }}
          {{- else }}
          emptyDir: {}
          {{- end }}
